<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">
<title>Page Not Found — DLA Kappa Alpha Psi</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Archivo',sans-serif;background:#2a0604;color:#f2ebd7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;position:relative;overflow:hidden;}
.lattice{position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><path d='M32 0L64 32L32 64L0 32Z' fill='none' stroke='%23f2ebd7' stroke-width='1'/></svg>");background-size:72px 72px;pointer-events:none;}
.inner{position:relative;z-index:1;max-width:560px;}
.crest{width:72px;height:72px;object-fit:contain;margin-bottom:2rem;opacity:.85;}
.code{font-family:'Cinzel',serif;font-size:5rem;font-weight:700;color:#c69a3f;line-height:1;margin-bottom:.5rem;letter-spacing:.04em;}
.divider{width:48px;height:2px;background:#c69a3f;margin:.75rem auto 1.5rem;}
h1{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#f2ebd7;margin-bottom:.75rem;}
p{font-size:.9rem;color:rgba(242,235,215,.65);line-height:1.7;margin-bottom:2.5rem;}
.links{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-bottom:2.5rem;}
.links a{display:inline-block;padding:.6rem 1.4rem;font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:3px;transition:background .2s,color .2s;}
.btn-gold{background:#c69a3f;color:#2a0604;}
.btn-gold:hover{background:#daa70f;}
.btn-outline{background:none;border:1.5px solid rgba(198,154,63,.4);color:#c69a3f;}
.btn-outline:hover{border-color:#c69a3f;background:rgba(198,154,63,.08);}
.redirect-note{font-size:.75rem;color:rgba(242,235,215,.35);letter-spacing:.04em;}
#countdown{color:#c69a3f;}
</style>
</head>
<body>
<div class="lattice"></div>
<div class="inner">
  <img class="crest" src="/img/kappa-crest.png" alt="Kappa Alpha Psi Crest">
  <div class="code">404</div>
  <div class="divider"></div>
  <h1>Page Not Found</h1>
  <p>This page may have moved or no longer exists. The DLA site was recently updated — use the links below to find what you're looking for.</p>
  <div class="links">
    <a href="/" class="btn-gold">← Home</a>
    <a href="/events.html" class="btn-outline">Events</a>
    <a href="/programs.html" class="btn-outline">Programs</a>
    <a href="/dla_guide_right.html" class="btn-outline">Guide Right</a>
    <a href="/contact.html" class="btn-outline">Contact</a>
  </div>
  <p class="redirect-note">Redirecting to the homepage in <span id="countdown">10</span>s…</p>
</div>
<script>
  var n = 10;
  var el = document.getElementById('countdown');
  var t = setInterval(function() {
    n--;
    el.textContent = n;
    if (n <= 0) { clearInterval(t); window.location.replace('/'); }
  }, 1000);
</script>
</body>
</html>
