<title>501(c)(3) & 501(c)(7) Compliance Training | Denton-Lewisville Alumni Chapter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cr:#70110c;--cr-d:#4a0b08;--cr-dd:#3a0906;--cr-l:#8c1812;
  --cm:#f2ebd7;--cm-d:#e5d9bf;--cm-dd:#d4c9a8;
  --go:#c9a84c;--go-d:#a88838;--go-l:#d4b563;
  --tx:#1a1a1a;--tx-m:#555;--tx-l:#888;
  --wh:#fff;--sw:260px;--r:8px;--rl:12px;
  --sh:0 2px 8px rgba(0,0,0,.12);--sh-l:0 4px 20px rgba(0,0,0,.15);
  --tr:.2s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--tx);background:#ede9df;min-height:100vh;line-height:1.6}
.skip-link{position:absolute;top:-40px;left:6px;background:var(--go);color:var(--cr-d);padding:8px 12px;border-radius:var(--r);font-weight:600;z-index:1000;text-decoration:none}
.skip-link:focus{top:6px}
#sidebar{width:var(--sw);min-width:var(--sw);background:var(--cr);height:100vh;position:fixed;left:0;top:0;overflow-y:auto;display:flex;flex-direction:column;z-index:100;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
#main{margin-left:var(--sw);min-height:100vh}
.sb-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo-badge{width:42px;height:42px;background:var(--go);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--cr-d);flex-shrink:0;font-family:'Playfair Display',serif}
.sb-title{font-size:12px;font-weight:700;color:var(--cm);line-height:1.3;letter-spacing:.02em}
.sb-sub{font-size:10px;color:rgba(242,235,215,.55);margin-top:2px}
.sb-progress{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.prog-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(242,235,215,.55);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.prog-track{height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--go);border-radius:3px;transition:width .4s ease}
.sb-nav{flex:1;padding:8px 0}
.sec-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,235,215,.38);padding:10px 16px 3px}
.mod-item{display:flex;align-items:flex-start;gap:9px;padding:9px 14px;cursor:pointer;transition:background var(--tr);border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.mod-item:hover{background:rgba(255,255,255,.07)}
.mod-item.active{background:rgba(255,255,255,.11);border-left-color:var(--go)}
.mod-item.completed .mod-badge{background:var(--go);color:var(--cr-d)}
.mod-badge{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--cm);flex-shrink:0;margin-top:1px}
.mod-title{font-size:12px;font-weight:600;color:var(--cm);line-height:1.3}
.mod-sub{font-size:10px;color:rgba(242,235,215,.48);margin-top:1px}
.sb-foot{padding:8px 0;border-top:1px solid rgba(255,255,255,.1)}
.sb-foot-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;transition:background var(--tr);border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.sb-foot-item:hover{background:rgba(255,255,255,.07)}
.sb-foot-item.active{background:rgba(255,255,255,.11);border-left-color:var(--go)}
.sb-foot-icon{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sb-foot-label{font-size:12px;font-weight:600;color:var(--cm)}
.hero{background:linear-gradient(135deg,var(--cr-dd) 0%,var(--cr) 55%,var(--cr-l) 100%);color:var(--wh);padding:52px 56px 48px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-8%;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.22);border:1px solid rgba(201,168,76,.45);color:var(--go);padding:5px 13px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:20px}
.hero-title{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;line-height:1.15;margin-bottom:14px;color:var(--wh);max-width:600px}
.hero-sub{font-size:15px;line-height:1.7;color:rgba(255,255,255,.72);max-width:540px;margin-bottom:28px}
.hero-name-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.hero-name-row label{font-size:13px;font-weight:600;color:var(--cm);white-space:nowrap}
.name-input{padding:10px 15px;border-radius:var(--r);border:2px solid rgba(201,168,76,.45);background:rgba(255,255,255,.1);color:var(--wh);font-size:14px;font-weight:500;width:230px;outline:none;transition:border-color var(--tr);font-family:inherit}
.name-input::placeholder{color:rgba(255,255,255,.38)}
.name-input:focus{border-color:var(--go)}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.stat-item{display:flex;align-items:center;gap:7px}
.stat-label{font-size:13px;font-weight:600;color:var(--cm)}
.btn-begin{display:inline-flex;align-items:center;gap:8px;background:var(--go);color:var(--cr-d);border:none;padding:13px 26px;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;transition:all var(--tr);font-family:inherit}
.btn-begin:hover{background:var(--go-l);transform:translateY(-1px)}
.btn-begin:focus{outline:3px solid var(--wh);outline-offset:2px}
.land-body{background:var(--wh);padding:48px 56px}
.sec-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--cr);margin-bottom:6px}
.sec-intro{font-size:14px;color:var(--tx-m);margin-bottom:22px;max-width:560px;line-height:1.6}
.obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:40px}
.obj-card{display:flex;align-items:flex-start;gap:11px;padding:15px;background:var(--cm);border-radius:var(--r);border-left:4px solid var(--go)}
.obj-num{width:26px;height:26px;background:var(--cr);color:var(--wh);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.obj-text{font-size:13px;line-height:1.5;color:var(--tx);font-weight:500}
.path-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.path-card{border:2px solid var(--cm-d);border-radius:var(--rl);padding:18px;transition:all var(--tr);cursor:pointer}
.path-card:hover{border-color:var(--cr);box-shadow:var(--sh)}
.path-num{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx-l);font-weight:700;margin-bottom:5px}
.path-title{font-size:14px;font-weight:700;color:var(--cr);margin-bottom:7px;line-height:1.3}
.path-desc{font-size:12px;color:var(--tx-m);line-height:1.5}
.mod-page{min-height:100vh;background:#ede9df}
.mod-header{background:var(--cr);color:var(--wh);padding:24px 44px;display:flex;align-items:center;gap:18px}
.mod-num-badge{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);width:50px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.mod-num-sm{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.55);font-weight:600;line-height:1}
.mod-num-lg{font-size:20px;font-weight:800;color:var(--wh);line-height:1}
.mod-hdr-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5);font-weight:600;margin-bottom:3px}
.mod-hdr-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--wh);line-height:1.25}
.mod-content{padding:36px 44px;max-width:880px}
.scr-dots{display:flex;align-items:center;gap:7px;margin-bottom:24px}
.scr-dot{width:8px;height:8px;border-radius:50%;background:var(--cm-dd);transition:all var(--tr)}
.scr-dot.active{background:var(--cr);width:22px;border-radius:4px}
.scr-dot.done{background:var(--go)}
.card{background:var(--wh);border-radius:var(--rl);padding:26px 30px;margin-bottom:18px;box-shadow:var(--sh)}
.card h3{font-size:17px;font-weight:700;color:var(--cr);margin-bottom:11px}
.card p{font-size:14px;line-height:1.7;color:var(--tx);margin-bottom:11px}
.card p:last-child{margin-bottom:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sl{list-style:none;padding:0}
.sl li{padding:7px 0 7px 22px;position:relative;font-size:14px;line-height:1.5;color:var(--tx);border-bottom:1px solid var(--cm-d)}
.sl li:last-child{border-bottom:none}
.sl li::before{content:'→';position:absolute;left:0;color:var(--go-d);font-weight:700}
.exp-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.exp-card{background:var(--wh);border:2px solid var(--cm-d);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:all var(--tr)}
.exp-card:hover{border-color:var(--cr)}
.exp-card.open{border-color:var(--cr);box-shadow:var(--sh)}
.exp-hdr{padding:14px 18px;display:flex;align-items:center;gap:11px}
.exp-num{width:30px;height:30px;border-radius:7px;background:var(--cr);color:var(--wh);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.exp-title{font-size:14px;font-weight:700;color:var(--tx);flex:1}
.exp-toggle{font-size:18px;color:var(--tx-m);transition:transform var(--tr)}
.exp-card.open .exp-toggle{transform:rotate(45deg);color:var(--cr)}
.exp-body{display:none;padding:12px 18px 14px;font-size:13px;line-height:1.6;color:var(--tx-m);border-top:1px solid var(--cm-d)}
.exp-card.open .exp-body{display:block}
.mod-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 44px;background:var(--wh);border-top:1px solid var(--cm-d);position:sticky;bottom:0;z-index:10}
.btn-nav{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);border:2px solid;font-family:inherit}
.btn-prev{background:var(--wh);color:var(--cr);border-color:var(--cr)}
.btn-prev:hover{background:var(--cm)}
.btn-next{background:var(--cr);color:var(--wh);border-color:var(--cr)}
.btn-next:hover{background:var(--cr-d)}
.btn-nav:disabled{opacity:.38;cursor:not-allowed}
.btn-nav:focus{outline:3px solid var(--go);outline-offset:2px}
.scr-pos{font-size:12px;color:var(--tx-m);font-weight:500}
.quiz{background:var(--wh);border-radius:var(--rl);padding:26px 30px;margin-bottom:16px;box-shadow:var(--sh)}
.quiz-q-num{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx-l);font-weight:600;margin-bottom:8px}
.quiz-q{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:18px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:9px}
.quiz-opt{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border:2px solid var(--cm-d);border-radius:var(--r);cursor:pointer;transition:all var(--tr);background:var(--wh);font-family:inherit;text-align:left;width:100%}
.quiz-opt:hover:not(:disabled){border-color:var(--cr);background:var(--cm)}
.quiz-opt.sel{border-color:var(--cr);background:rgba(112,17,12,.05)}
.quiz-opt.cor{border-color:#15803d;background:rgba(21,128,61,.08)}
.quiz-opt.inc{border-color:#b91c1c;background:rgba(185,28,28,.07)}
.quiz-opt:disabled{cursor:not-allowed}
.opt-ltr{width:24px;height:24px;border-radius:50%;background:var(--cm-d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx-m);flex-shrink:0}
.quiz-opt.cor .opt-ltr{background:#15803d;color:#fff}
.quiz-opt.inc .opt-ltr{background:#b91c1c;color:#fff}
.opt-text{font-size:13px;line-height:1.5;color:var(--tx)}
.quiz-fb{margin-top:14px;padding:13px 15px;border-radius:var(--r);font-size:13px;line-height:1.5;display:none}
.quiz-fb.show{display:block}
.quiz-fb.cor-fb{background:rgba(21,128,61,.1);border:1px solid #15803d;color:#14532d}
.quiz-fb.inc-fb{background:rgba(185,28,28,.09);border:1px solid #b91c1c;color:#7f1d1d}
.title-screen{min-height:55vh;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
.ts-mod-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--tx-l);margin-bottom:11px}
.ts-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--cr);line-height:1.25;margin-bottom:18px}
.ts-obj{font-size:15px;color:var(--tx-m);line-height:1.7;max-width:580px;background:var(--cm);padding:18px 22px;border-radius:var(--rl);border-left:4px solid var(--go)}
.info-box{background:rgba(112,17,12,.06);border:1px solid rgba(112,17,12,.18);border-radius:var(--r);padding:14px 18px;font-size:13px;line-height:1.6;color:var(--tx);margin:14px 0}
.info-box strong{color:var(--cr)}
.warn-box{background:rgba(185,28,28,.07);border:1px solid #b91c1c;border-radius:var(--r);padding:14px 18px;font-size:13px;line-height:1.6;color:#7f1d1d;margin:14px 0}
.warn-box strong{color:#991b1b}
.compare-tbl{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
.compare-tbl th{background:var(--cr);color:#fff;padding:9px 13px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.compare-tbl td{padding:10px 13px;border-bottom:1px solid var(--cm-d);vertical-align:top;line-height:1.5}
.compare-tbl tr:nth-child(even) td{background:var(--cm)}
.assess-header{background:var(--cr);color:var(--wh);padding:24px 44px}
.assess-q-num{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:7px}
.assess-mod-tag{display:inline-block;background:rgba(255,255,255,.15);padding:2px 9px;border-radius:100px;font-size:10px;color:var(--cm);margin-bottom:14px}
.assess-q{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--wh);line-height:1.35}
.assess-body{padding:32px 44px;max-width:780px}
.assess-dots{display:flex;gap:5px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.assess-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--cm-d);background:var(--wh);font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr);color:var(--tx-m)}
.assess-dot.answered{background:var(--cm);border-color:var(--cr);color:var(--cr)}
.assess-dot.current{background:var(--cr);border-color:var(--cr);color:#fff}
.results-pg{padding:40px 44px;max-width:680px}
.results-circle{width:130px;height:130px;border-radius:50%;border:7px solid var(--go);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 28px}
.results-score{font-size:36px;font-weight:800;color:var(--cr);line-height:1}
.results-slbl{font-size:11px;color:var(--tx-m);font-weight:600}
.results-status{text-align:center;margin-bottom:28px}
.r-pass{font-size:20px;font-weight:700;color:#166534}
.r-fail{font-size:20px;font-weight:700;color:#991b1b}
.breakdown{background:var(--wh);border-radius:var(--rl);padding:22px;box-shadow:var(--sh);margin-bottom:22px}
.bd-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--cm-d)}
.bd-row:last-child{border-bottom:none}
.bd-mod{font-size:13px;font-weight:600;color:var(--tx)}
.bd-score{font-size:13px;font-weight:700}
.sg{color:#166534}.sb-c{color:#991b1b}
.cert-wrapper{padding:36px;background:#ede9df;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cert{width:760px;max-width:100%;background:var(--wh);border:7px solid var(--go);border-radius:var(--rl);padding:44px 52px;text-align:center;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.14)}
.cert::before{content:'';position:absolute;inset:11px;border:2px solid var(--cm-d);border-radius:var(--r);pointer-events:none}
.cert-logo{font-size:44px;font-family:'Playfair Display',serif;font-weight:700;color:var(--cr);margin-bottom:7px}
.cert-org{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--tx-l);font-weight:600;margin-bottom:24px}
.cert-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--cr);margin-bottom:18px;line-height:1.2}
.cert-certifies{font-size:13px;color:var(--tx-m);margin-bottom:7px;font-style:italic}
.cert-name{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--go-d);margin-bottom:18px;line-height:1.2}
.cert-completed{font-size:13px;color:var(--tx-m);margin-bottom:7px}
.cert-course{font-size:17px;font-weight:700;color:var(--tx);margin-bottom:7px;font-family:'Playfair Display',serif}
.cert-chapter{font-size:13px;color:var(--tx-m);margin-bottom:22px}
.cert-date{font-size:13px;color:var(--tx-l);margin-bottom:22px;font-style:italic}
.cert-div{width:110px;height:3px;background:var(--go);margin:0 auto 22px;border-radius:2px}
.cert-seal{font-size:36px;margin-bottom:14px}
.btn-print{display:inline-flex;align-items:center;gap:7px;background:var(--cr);color:var(--wh);border:none;padding:11px 22px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;margin-top:18px;transition:background var(--tr);font-family:inherit}
.btn-print:hover{background:var(--cr-d)}
.resources-pg{padding:36px 44px}
.res-grid{display:flex;flex-direction:column;gap:14px}
.res-card{background:var(--wh);border-radius:var(--rl);padding:22px;box-shadow:var(--sh);display:flex;align-items:flex-start;gap:14px}
.res-icon{width:44px;height:44px;background:var(--cm);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.res-title{font-size:15px;font-weight:700;color:var(--cr);margin-bottom:4px}
.res-desc{font-size:12px;color:var(--tx-m);line-height:1.5}
.complete-badge{background:var(--go);color:var(--cr-d);text-align:center;padding:10px 18px;font-size:13px;font-weight:700;border-radius:var(--r);margin-bottom:14px}
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);transition:transform .3s ease}
  #sidebar.sb-open{transform:translateX(0)}
  #main{margin-left:0}
  .hero,.land-body{padding:28px 22px}
  .obj-grid,.path-grid,.two-col,.exp-cards{grid-template-columns:1fr}
  .mod-content,.mod-header,.mod-nav,.assess-header,.assess-body{padding-left:22px;padding-right:22px}
  .hero-title{font-size:28px}
  .hamburger{display:flex}
}
@media(max-width:480px){.hero-stats{flex-direction:column;gap:10px}}
@media print{
  #sidebar,.btn-print,.mod-nav,.scr-dots,.hamburger{display:none!important}
  #main{margin-left:0!important}
  .cert{box-shadow:none;border:5px solid var(--go);page-break-inside:avoid}

<script>
// ========== STATE ==========
const NS = 'DLA_COMPLIANCE_2026';
let S = {
  page: 'landing',
  mi: 0,
  si: 0,
  name: '',
  done: [false,false,false,false,false,false,false,false],
  visited: {},
  ix: {},
  aa: {},
  aScore: null,
  aSubmitted: false
};

function save(){try{localStorage.setItem(NS,JSON.stringify(S))}catch(e){}}
function load(){try{const d=localStorage.getItem(NS);if(d){const p=JSON.parse(d);Object.assign(S,p)}}catch(e){}}

// ========== MODULE META ==========
const MODS = [
  {title:'Two Organizations, One Mission',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'Revenue Rules & Funding Sources',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'Keeping Funds Separate',dur:'~30 min',screens:10,section:'COMPLIANCE OPERATIONS'},
  {title:'Co-Sponsored Events & MOUs',dur:'~30 min',screens:10,section:'COMPLIANCE OPERATIONS'},
  {title:'Compensation & Worker Classification',dur:'~30 min',screens:10,section:'COMPLIANCE OPERATIONS'},
  {title:'Facilities: Center & Chapter House',dur:'~30 min',screens:10,section:'COMPLIANCE OPERATIONS'},
  {title:'Annual Filing & Auto-Revocation',dur:'~30 min',screens:10,section:'ADVANCED TOPICS'},
  {title:'Governance, UBIT & Advanced Tax Issues',dur:'~30 min',screens:10,section:'ADVANCED TOPICS'}
];

// ========== PROGRESS ==========
function calcProgress(){
  const total = MODS.reduce((a,m)=>a+m.screens,0)+14+2;
  let done = 0;
  for(let mi=0;mi<MODS.length;mi++){
    for(let si=0;si<MODS[mi].screens;si++){
      if(S.visited[`${mi}-${si}`]) done++;
    }
  }
  if(S.aSubmitted) done+=14;
  if(S.aScore!==null && S.aScore>=11) done+=2;
  return Math.round((done/total)*100);
}

function getIx(){ return S.ix[`${S.mi}-${S.si}`]||{}; }
function setIx(data){ S.ix[`${S.mi}-${S.si}`]=Object.assign(getIx(),data); save(); }

// ========== SIDEBAR ==========
function renderSidebar(){
  const pct = calcProgress();
  let secShown = {};
  let items = '';
  for(let i=0;i<MODS.length;i++){
    const m=MODS[i];
    if(!secShown[m.section]){
      items+=`<div class="sec-label">${m.section}</div>`;
      secShown[m.section]=true;
    }
    const isActive=S.page==='module'&&S.mi===i;
    const isDone=S.done[i];
    items+=`<button class="mod-item${isActive?' active':''}${isDone?' completed':''}" onclick="goModule(${i})" aria-current="${isActive?'page':'false'}">
      <div class="mod-badge">${isDone?'&#10003;':(i+1)}</div>
      <div>
        <div class="mod-title">${m.title}</div>
        <div class="mod-sub">Module ${i+1} &middot; ${m.dur}</div>
      </div>
    </button>`;
  }
  return `
  <div class="sb-header">
    <div class="sb-logo">
      <div class="logo-badge">K&#913;&#936;</div>
      <div>
        <div class="sb-title">501(c)(3) &amp; 501(c)(7) Compliance</div>
        <div class="sb-sub">Denton-Lewisville Alumni Chapter &middot; 2026</div>
      </div>
    </div>
  </div>
  <div class="sb-progress">
    <div class="prog-label"><span>Course Progress</span><span>${pct}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="sb-nav">${items}</div>
  <div class="sb-foot">
    <button class="sb-foot-item${S.page==='resources'?' active':''}" onclick="goPage('resources')">
      <div class="sb-foot-icon">&#128196;</div>
      <div class="sb-foot-label">References &amp; Resources</div>
    </button>
    ${S.aScore!==null&&S.aScore>=11?`<button class="sb-foot-item${S.page==='certificate'?' active':''}" onclick="goPage('certificate')">
      <div class="sb-foot-icon">&#127885;</div>
      <div class="sb-foot-label">My Certificate</div>
    </button>`:''}
    ${S.aSubmitted?`<button class="sb-foot-item${S.page==='results'?' active':''}" onclick="goPage('results')">
      <div class="sb-foot-icon">&#128202;</div>
      <div class="sb-foot-label">Assessment Results</div>
    </button>`:''}
  </div>`;
}

// ========== NAVIGATION ==========
function goPage(p){S.page=p;save();render();}
function goModule(mi){S.page='module';S.mi=mi;S.si=0;S.visited[`${mi}-0`]=true;save();render();}
function nextScreen(){
  if(S.si<MODS[S.mi].screens-1){
    S.si++;
    S.visited[`${S.mi}-${S.si}`]=true;
    save();render();
    window.scrollTo(0,0);
  } else {
    S.done[S.mi]=true;
    const last=MODS.length-1;
    if(S.mi<last){
      const next=S.mi+1;
      if(window.confirm('Module '+(S.mi+1)+' complete! Start Module '+(next+1)+'?')){
        S.page='module';S.mi=next;S.si=0;S.visited[`${next}-0`]=true;
      } else {
        S.page='landing';
      }
    } else {
      if(window.confirm('All modules complete! Proceed to the Final Assessment?')){
        S.page='assessment';S.si=0;
      } else {
        S.page='landing';
      }
    }
    save();render();
    window.scrollTo(0,0);
  }
}
function prevScreen(){if(S.si>0){S.si--;save();render();window.scrollTo(0,0);}}

function screenDots(count,current){
  let d='';
  for(let i=0;i<count;i++){
    const isDone=S.visited[`${S.mi}-${i}`]&&i<current;
    d+=`<div class="scr-dot${i===current?' active':isDone?' done':''}"></div>`;
  }
  return `<div class="scr-dots">${d}</div>`;
}

function modHeader(mi){
  const m=MODS[mi];
  return `<div class="mod-header">
    <div class="mod-num-badge"><div class="mod-num-sm">MOD</div><div class="mod-num-lg">${mi+1}</div></div>
    <div><div class="mod-hdr-lbl">Module ${mi+1} of ${MODS.length}</div><div class="mod-hdr-title">${m.title}</div></div>
  </div>`;
}

function navBar(si,total,nextLabel){
  nextLabel=nextLabel||'Next &rarr;';
  return `<div class="mod-nav">
    <button class="btn-nav btn-prev" onclick="prevScreen()" ${si===0?'disabled':''}>&#8592; Previous</button>
    <span class="scr-pos">Screen ${si+1} of ${total}</span>
    <button class="btn-nav btn-next" onclick="nextScreen()">${nextLabel}</button>
  </div>`;
}

// ========== QUIZ HELPER ==========
function renderQuiz(qid, question, opts, correctIdx, feedback){
  const ix=getIx();
  const sel=ix[qid];
  const submitted=sel!==undefined;
  let optHtml='';
  opts.forEach(function(o,i){
    let cls='quiz-opt';
    if(submitted){
      if(i===correctIdx) cls+=' cor';
      else if(i===sel&&i!==correctIdx) cls+=' inc';
    } else if(i===sel) cls+=' sel';
    optHtml+=`<button class="${cls}" onclick="answerQuiz('${qid}',${i},${correctIdx})" ${submitted?'disabled':''}>
      <div class="opt-ltr">${String.fromCharCode(65+i)}</div>
      <div class="opt-text">${o}</div>
    </button>`;
  });
  const fbShow=submitted?'show':'';
  const fbCls=submitted&&sel===correctIdx?'cor-fb':'inc-fb';
  return `<div class="quiz">
    <div class="quiz-q-num">${qid.replace(/-/g,' ')}</div>
    <div class="quiz-q">${question}</div>
    <div class="quiz-opts">${optHtml}</div>
    <div class="quiz-fb ${fbCls} ${fbShow}">${submitted?feedback:''}</div>
  </div>`;
}

function answerQuiz(qid,sel,correct){
  const ix=getIx();
  if(ix[qid]!==undefined) return;
  ix[qid]=sel;
  setIx(ix);
  render();
}

function toggleExp(i){
  const cards=document.querySelectorAll('.exp-card');
  if(cards[i]) cards[i].classList.toggle('open');
}

const AQ = [
  {mod:'Module 1',q:'Which entity is organized as a 501(c)(3) public charity?',opts:['The Denton-Lewisville Alumni Chapter (KL)','The Kappa Alpha Psi Guide Right Foundation (local)','Both entities share the same tax status','Neither — fraternities cannot obtain 501(c)(3) status'],cor:1,fb:'The Guide Right Foundation is the 501(c)(3) charitable entity. The Alumni Chapter is a 501(c)(7) social club. These are distinct legal organizations with different tax rules.'},

  {mod:'Module 3',q:'The chapter treasurer informally transfers $2,000 from the Chapter account to the Foundation account to cover a scholarship gap. This is:',opts:['Permissible as an inter-organizational loan','A compliance risk requiring a formal grant agreement between the entities','Acceptable if documented in meeting minutes','Required by IRS rules when funds are insufficient'],cor:1,fb:'Any transfer of funds between the two entities requires a formal grant agreement. Informal transfers are considered commingling and can jeopardize both organizations\' tax-exempt status.'},
  {mod:'Module 3',q:'Brothers want to support the Guide Right Foundation. The compliant approach is:',opts:['Write a chapter check to the Foundation','Use a shared account and reimburse later','Have individual members donate directly from their personal funds','Pool chapter dues and redirect them to the Foundation'],cor:2,fb:'Individual members may donate personally to the 501(c)(3) Foundation. The chapter cannot redirect member dues without a formal grant process.'},

  {mod:'Module 6',q:'A chapter rents its house to a for-profit business for commercial office use. This rental income is subject to:',opts:['No tax — real property rental is always exempt for nonprofits','Unrelated Business Income Tax (UBIT) and requires filing Form 990-T','The 65%/35% membership income test only','State property tax but not federal income tax'],cor:1,fb:'Rental of real property to an unrelated commercial tenant generates Unrelated Business Income. The chapter must file Form 990-T and pay tax on net UBI exceeding $1,000.'},
  {mod:'Module 7',q:'The Denton-Lewisville Alumni Chapter (December 31 fiscal year end) must file its annual Form 990 by:',opts:['March 15 of the following year','May 15 of the following year','April 15 of the following year','June 30 of the following year'],cor:1,fb:'For organizations with a December 31 fiscal year end, the Form 990 is due by May 15. A 6-month extension to November 15 is available via Form 8868.'},
  {mod:'Module 7',q:'An organization that fails to file its required annual return for three consecutive years will:',opts:['Receive a warning letter and a 90-day cure period','Have its tax-exempt status automatically revoked with no prior notice','Be downgraded to 501(c)(4) status','Owe back taxes at the corporate rate for those three years only'],cor:1,fb:'The IRS automatically revokes tax-exempt status after three consecutive years of non-filing. There is no warning — the revocation is immediate and retroactive.'},

function m8s4(){

  <div class="card"><h3>Unrelated Business Income Tax: What Triggers It</h3>

  <div class="card">
    <h3>The Three-Part UBIT Test</h3>
    <ul class="sl">
      <li><strong>1. Trade or business:</strong> The activity involves the production of income from selling goods or performing services. Passive investment income (dividends, interest, royalties) is generally not a &ldquo;trade or business.&rdquo;</li>
      <li><strong>2. Regularly carried on:</strong> The activity occurs with a frequency and continuity that a for-profit organization would conduct. A single annual event is generally not &ldquo;regularly carried on.&rdquo; Weekly or monthly commercial activities are.</li>

    <h3>UBIT Calculation Basics</h3>
    <ul class="sl">

      <li>$1,000 specific deduction available before the tax applies</li>
      <li>Net operating losses from one UBI activity can offset UBI from the same activity in future years (not across separate unrelated activities)</li>

      <li><strong>Passive investment:</strong> Dividends, interest, royalties, and annuities are generally excluded from UBIT &mdash; invest in securities rather than operating businesses.</li>

function renderAssessment(){
  if(S.aSubmitted){ goPage('results'); return ''; }
  const qi=S.si;
  const q=AQ[qi];
  const ans=S.aa[qi];
  const submitted=ans!==undefined;
  let opts='';
  q.opts.forEach(function(o,i){
    let cls='quiz-opt';
    if(submitted){
      if(i===q.cor) cls+=' cor';
      else if(i===ans&&i!==q.cor) cls+=' inc';
    } else if(i===ans) cls+=' sel';
    opts+=`<button class="${cls}" onclick="assessAnswer(${i})" ${submitted?'disabled':''}>
      <div class="opt-ltr">${String.fromCharCode(65+i)}</div>
      <div class="opt-text">${o}</div>
    </button>`;
  });
  const fbShow=submitted?'show':'';
  const fbCls=submitted&&ans===q.cor?'cor-fb':'inc-fb';
  const allAnswered=AQ.every(function(_,i){return S.aa[i]!==undefined;});
  let dots='';
  AQ.forEach(function(_,i){
    dots+=`<div class="assess-dot${i===qi?' current':S.aa[i]!==undefined?' answered':''}" onclick="goAssessQ(${i})">${i+1}</div>`;
  });
  return `
  <div class="assess-header">
    <div class="assess-q-num">Question ${qi+1} of ${AQ.length}</div>
    <div class="assess-mod-tag">${q.mod}</div>
    <div class="assess-q">${q.q}</div>
  </div>
  <div class="assess-body">
    <div class="quiz-opts" style="margin-bottom:14px">${opts}</div>
    <div class="quiz-fb ${fbCls} ${fbShow}" style="margin-bottom:18px">${submitted?q.fb:''}</div>
    <div style="display:flex;gap:11px;margin-bottom:22px;flex-wrap:wrap">
      ${qi>0?`<button class="btn-nav btn-prev" onclick="goAssessQ(${qi-1})">&#8592; Previous</button>`:''}
      ${qi<AQ.length-1?`<button class="btn-nav btn-next" onclick="goAssessQ(${qi+1})">Next &#8594;</button>`:''}
      ${allAnswered&&!S.aSubmitted?`<button class="btn-nav btn-next" onclick="submitAssessment()" style="background:var(--go);color:var(--cr-d);border-color:var(--go)">Submit Assessment</button>`:''}
    </div>
    <div class="assess-dots">${dots}</div>
    ${!allAnswered?`<p style="text-align:center;font-size:12px;color:var(--tx-l);margin-top:11px">Answer all ${AQ.length} questions to submit. (${Object.keys(S.aa).length}/${AQ.length} answered)</p>`:''}
  </div>`;
}

function assessAnswer(i){
  if(S.aa[S.si]!==undefined) return;
  S.aa[S.si]=i;
  save();render();
}
function goAssessQ(i){S.si=i;save();render();}
function submitAssessment(){
  var score=0;
  AQ.forEach(function(q,i){if(S.aa[i]===q.cor) score++;});
  S.aScore=score;
  S.aSubmitted=true;
  save();
  goPage('results');
}

// ========== RESULTS ==========
function renderResults(){
  const score=S.aScore;
  const total=AQ.length;
  const pct=Math.round((score/total)*100);
  const pass=score>=11;
  var mods=[...new Set(AQ.map(function(q){return q.mod;}))];
  var rows='';
  mods.forEach(function(mod){
    var qs=AQ.map(function(q,i){return Object.assign({},q,{i:i});}).filter(function(q){return q.mod===mod;});
    var c=qs.filter(function(q){return S.aa[q.i]===q.cor;}).length;
    rows+=`<div class="bd-row"><div class="bd-mod">${mod}</div><div class="bd-score ${c===qs.length?'sg':'sb-c'}">${c}/${qs.length}</div></div>`;
  });
  return `<div class="results-pg">
    <div class="results-circle"><div class="results-score">${pct}%</div><div class="results-slbl">${score}/${total}</div></div>
    <div class="results-status">
      ${pass?`<div class="r-pass">&#10003; Assessment Passed</div><p style="font-size:14px;color:var(--tx-m);margin-top:7px">You have demonstrated compliance knowledge. Your certificate is ready.</p>`:
      `<div class="r-fail">Assessment Not Yet Passed</div><p style="font-size:14px;color:var(--tx-m);margin-top:7px">A score of 79% (11/14) is required. Review the modules and retake.</p>`}
    </div>
    <div class="breakdown">${rows}</div>
    ${pass?`<button class="btn-begin" onclick="goPage('certificate')">View My Certificate &#8594;</button>`:''}
    <button class="btn-nav btn-prev" style="margin-top:11px${pass?';margin-left:11px':''}" onclick="retakeAssessment()">Retake Assessment</button>
  </div>`;
}

function retakeAssessment(){
  S.aa={};S.aScore=null;S.aSubmitted=false;S.si=0;S.page='assessment';
  save();render();
}

          <div class="res-desc">IRC 501(c)(3) &mdash; Public charities &middot; IRC 501(c)(7) &mdash; Social clubs &middot; IRC 4958 &mdash; Excess benefit transactions &middot; IRC 511&ndash;514 &mdash; UBIT &middot; IRC 6033 &mdash; Annual information return requirements</div>
        </div>
      </div>
      <div class="res-card">
        <div class="res-icon">&#128196;</div>
        <div>
          <div class="res-title">IRS Forms</div>
          <div class="res-desc">Form 990-N &mdash; e-Postcard (&le;$50K) &middot; Form 990-EZ &mdash; Short form &middot; Form 990 &mdash; Full annual return &middot; Form 990-T &mdash; Unrelated business income &middot; Form 1023 &mdash; 501(c)(3) application &middot; Form 1024 &mdash; Other exemptions &middot; Form 8868 &mdash; Extension request</div>
        </div>
      </div>
      <div class="res-card">
        <div class="res-icon">&#128218;</div>
        <div>
          <div class="res-title">IRS Publications</div>
          <div class="res-desc">Publication 557 &mdash; Tax-Exempt Status for Your Organization &middot; Publication 598 &mdash; Tax on Unrelated Business Income &middot; IRS Stay Exempt &mdash; Free online training for exempt organizations at stayexempt.irs.gov</div>
        </div>
      </div>
      <div class="res-card">
        <div class="res-icon">&#9878;</div>
        <div>
          <div class="res-title">Key Compliance Rules Summary</div>
          <div class="res-desc">501(c)(7): &ge;65% member income &middot; &le;35% non-member income &middot; &le;15% public use &middot; Separate accounts required &middot; No tax-deductible donations &middot; Annual 990 filing required. 501(c)(3): Public support test (33&frac13;%) &middot; Tax-deductible gifts &middot; No political activity &middot; Excess benefit rules apply &middot; Annual 990 required &middot; UBIT on unrelated commercial income.</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ========== LANDING ==========
function renderLanding(){
  const pct=calcProgress();
  const allDone=S.done.every(Boolean);
  return `
  <div class="hero">
    <div class="hero-badge">K&#913;&#936; Compliance Training &middot; 2026</div>
    <div class="hero-title">501(c)(3) &amp; 501(c)(7) Compliance Training</div>
    <div class="hero-sub">Protect our chapter's tax-exempt status. Master the rules that govern two organizations, one mission.</div>
    <div class="hero-name-row">
      <label for="name-input">Your Name:</label>
      <input class="name-input" id="name-input" type="text" placeholder="Brother Last Name" value="${S.name}" oninput="S.name=this.value;save()">
    </div>
    <div class="hero-stats">
      <div class="stat-item"><span style="font-size:18px">&#128218;</span><span class="stat-label">8 Modules</span></div>
      <div class="stat-item"><span style="font-size:18px">&#9200;</span><span class="stat-label">~4 Hours</span></div>
      <div class="stat-item"><span style="font-size:18px">&#128221;</span><span class="stat-label">14-Question Assessment</span></div>
      <div class="stat-item"><span style="font-size:18px">&#127885;</span><span class="stat-label">Certificate of Completion</span></div>
    </div>
    ${pct>0?`<div style="margin-bottom:18px"><div style="font-size:12px;color:var(--cm);margin-bottom:6px">Progress: ${pct}%</div><div style="height:6px;background:rgba(255,255,255,.2);border-radius:3px;width:280px"><div style="height:100%;background:var(--go);border-radius:3px;width:${pct}%"></div></div></div>`:''}
    <button class="btn-begin" onclick="beginCourse()">${pct>0?'Continue Course &#8594;':'Begin Course &#8594;'}</button>
  </div>
  <div class="land-body">
    <div class="sec-title">Course Objectives</div>
    <div class="sec-intro">After completing this course, you will be able to protect both entities, stay in compliance, and make confident decisions about money, events, and governance.</div>
    <div class="obj-grid">
      <div class="obj-card"><div class="obj-num">1</div><div class="obj-text">Distinguish 501(c)(3) and 501(c)(7) rules and apply the correct standard to each entity</div></div>
      <div class="obj-card"><div class="obj-num">2</div><div class="obj-text">Prevent fund commingling by maintaining separate accounts and formal transfer agreements</div></div>
      <div class="obj-card"><div class="obj-num">3</div><div class="obj-text">Execute compliant MOUs for co-sponsored events and joint fundraising activities</div></div>
      <div class="obj-card"><div class="obj-num">4</div><div class="obj-text">Correctly classify workers, avoid excess benefit transactions, and meet annual filing deadlines</div></div>
      <div class="obj-card"><div class="obj-num">5</div><div class="obj-text">Apply the three fiduciary duties and conflict of interest requirements to board decisions</div></div>
      <div class="obj-card"><div class="obj-num">6</div><div class="obj-text">Identify UBIT-generating activities and understand the consequences of auto-revocation</div></div>
    </div>
    <div class="sec-title">Course Modules</div>
    <div class="sec-intro">Eight modules organized across three topic areas.</div>
    <div class="path-grid">
      ${MODS.map(function(m,i){return `<div class="path-card" onclick="goModule(${i})">
        <div class="path-num">Module ${i+1} &middot; ${m.section}</div>
        <div class="path-title">${m.title}</div>
        <div class="path-desc">${m.dur} &middot; ${m.screens} screens${S.done[i]?' &middot; &#10003; Complete':''}</div>
      </div>`;}).join('')}
    </div>
    ${allDone?'<div style="margin-top:28px"><button class="btn-begin" onclick="goPage(\'assessment\')">Proceed to Final Assessment &#8594;</button></div>':''}
  </div>`;
}

function beginCourse(){
  var firstIncomplete=S.done.findIndex(function(d){return !d;});
  if(firstIncomplete>=0) goModule(firstIncomplete);
  else goPage('assessment');
}

// ========== MAIN RENDER ==========
function render(){
  document.getElementById('sidebar').innerHTML=renderSidebar();
  const main=document.getElementById('main-content');
  if(S.page==='landing'){
    main.innerHTML=renderLanding();
  } else if(S.page==='module'){
    const fns=SCREEN_FNS[S.mi];
    const content=fns[S.si]();
    const isLast=S.si===MODS[S.mi].screens-1;
    var nextLabel=isLast?(S.mi<MODS.length-1?'Complete &amp; Start Module '+(S.mi+2)+' &#8594;':'Complete &amp; Go to Assessment &#8594;'):'Next &#8594;';
    main.innerHTML=`<div class="mod-page">
      ${modHeader(S.mi)}
      <div class="mod-content">
        ${screenDots(MODS[S.mi].screens,S.si)}
        ${content}
      </div>
      ${navBar(S.si,MODS[S.mi].screens,nextLabel)}
    </div>`;
  } else if(S.page==='assessment'){
    main.innerHTML=renderAssessment();
  } else if(S.page==='results'){
    main.innerHTML=renderResults();
  } else if(S.page==='certificate'){
    main.innerHTML=renderCertificate();
  } else if(S.page==='resources'){
    main.innerHTML=renderResources();
  }
  // Hamburger
  const ham=document.getElementById('hamburger');
  const sb=document.getElementById('sidebar');
  const overlay=document.getElementById('sb-overlay');
  ham.onclick=function(){
    const open=sb.classList.toggle('sb-open');
    overlay.classList.toggle('show',open);
    ham.setAttribute('aria-expanded',open);
  };
  overlay.onclick=function(){
    sb.classList.remove('sb-open');
    overlay.classList.remove('show');
    ham.setAttribute('aria-expanded','false');
  };
}

load();
render();
</script>
</body>
</html>
