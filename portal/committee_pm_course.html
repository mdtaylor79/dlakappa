      </div>
      <button class="btn-print" onclick="window.print()" style="margin-top:16px"> Print Template</button>
    </div>`,
    status:`<div class="ja-wrap">
      <div style="margin-bottom:16px"><button class="btn-nav btn-prev" onclick="clearJobAid()">← Back to Resources</button></div>
      <div class="ja-header"><div class="ja-hdr-title">Committee Status Report Template</div><div class="ja-hdr-sub">Report to chapter at every meeting — one traffic light and one sentence per milestone</div></div>
      <div class="ja-body">
        <div class="ja-field" style="margin-bottom:16px">Committee: _____________________________ &nbsp;|&nbsp; Project: _____________________________ &nbsp;|&nbsp; Reporting Date: __________</div>
        <div class="ja-section">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:18px">
            <div style="background:rgba(21,128,61,.1);border:2px solid #16a34a;border-radius:var(--r);padding:11px;text-align:center"><div style="font-size:20px">🟢</div><strong style="color:#166534;font-size:13px">ON TRACK</strong></div>
            <div style="background:rgba(217,119,6,.1);border:2px solid #d97706;border-radius:var(--r);padding:11px;text-align:center"><div style="font-size:20px">🟡</div><strong style="color:#b45309;font-size:13px">AT RISK</strong></div>
            <div style="background:rgba(220,38,38,.1);border:2px solid #dc2626;border-radius:var(--r);padding:11px;text-align:center"><div style="font-size:20px"></div><strong style="color:#b91c1c;font-size:13px">OFF TRACK</strong></div>
          </div>
          <table class="ja-tbl"><thead><tr><th>Milestone</th><th>Target Date</th><th>Owner</th><th>Status</th><th>One-Sentence Update</th></tr></thead>
          <tbody>
            ${[1,2,3,4,5,6].map(n=>`<tr><td>${n}. ________________________</td><td>__________</td><td>__________</td><td>🟢 / 🟡 / </td><td>________________________</td></tr>`).join('')}
          </tbody></table>
        </div>
        <div class="ja-section"><div class="ja-sec-title">Overall Project Status</div>
          <div class="ja-field">Overall: 🟢 On Track &nbsp;|&nbsp; 🟡 At Risk &nbsp;|&nbsp;  Off Track &nbsp;&nbsp;&nbsp; Chair Signature: _____________________________</div>
        </div>
        <div class="ja-section"><div class="ja-sec-title">Escalation Items (Items requiring Polemarch attention)</div>
          <div class="ja-field" style="min-height:50px">________________________________________________________________________________________</div>
        </div>
      </div>
      <button class="btn-print" onclick="window.print()" style="margin-top:16px"> Print Template</button>
    </div>`,
    workload:`<div class="ja-wrap">
      <div style="margin-bottom:16px"><button class="btn-nav btn-prev" onclick="clearJobAid()">← Back to Resources</button></div>
      <div class="ja-header"><div class="ja-hdr-title">Workload Distribution Audit Worksheet</div><div class="ja-hdr-sub">Run this audit once per project cycle — any member over 40% of tasks is overloaded</div></div>
      <div class="ja-body">
        <div class="ja-field" style="margin-bottom:16px">Committee: _____________________________ &nbsp;|&nbsp; Project: _____________________________ &nbsp;|&nbsp; Total Tasks: ______</div>
        <div class="ja-section"><div class="ja-sec-title">Step 1 — Count Tasks by Member</div>
          <table class="ja-tbl"><thead><tr><th>Member Name</th><th>Tasks Assigned (list or count)</th><th>Task Count</th><th>% of Total</th><th>Status</th></tr></thead>
          <tbody>
            ${[1,2,3,4,5,6].map(n=>`<tr><td>${n}. ________________________</td><td>________________________</td><td>___</td><td>___%</td><td>OK / Overloaded / Underutilized</td></tr>`).join('')}
          </tbody></table>
        </div>
        <div class="ja-section"><div class="ja-sec-title">Step 2 — Apply the 40% Rule</div>
          <div class="info-box">
            <strong>Overloaded Threshold:</strong> Any member holding more than 40% of the team's tasks is overloaded — regardless of whether they volunteered for those tasks.<br><br>
            <strong>Formula:</strong> Member's task count ÷ Total tasks × 100 = % of total<br><br>
            <strong>Action Required:</strong> If any member is over 40%, redistribute at least enough tasks to bring them below the threshold. Redistribute to members with zero or few tasks based on capacity and availability — not willingness.
          </div>
        </div>
        <div class="ja-section"><div class="ja-sec-title">Step 3 — Redistribution Plan</div>
          <table class="ja-tbl"><thead><tr><th>Task Being Moved</th><th>Moving FROM</th><th>Moving TO</th><th>Reason</th></tr></thead>
          <tbody>

          </tbody></table>
        </div>
        <div class="ja-section"><div class="ja-sec-title">Step 4 — Revised Distribution (After Audit)</div>
          <table class="ja-tbl"><thead><tr><th>Member</th><th>Revised Task Count</th><th>% of Total</th><th>Within 40% Threshold?</th></tr></thead>
          <tbody>
            ${[1,2,3,4,5,6].map(n=>`<tr><td>${n}. ________________________</td><td>___</td><td>___%</td><td> Yes &nbsp; No</td></tr>`).join('')}
          </tbody></table>
        </div>
      </div>
      <button class="btn-print" onclick="window.print()" style="margin-top:16px"> Print Template</button>
    </div>`
  };
  return templates[id]||'<div style="padding:40px">Template not found.</div>';
}

// ========== INTERACTION HANDLERS ==========
function toggleExp(i){
  const cards=document.querySelectorAll('.exp-card');
  const card=cards[i];
  if(!card) return;
  const wasOpen=card.classList.contains('open');
  cards.forEach(c=>c.classList.remove('open'));
  if(!wasOpen) card.classList.add('open');
}

function selectPattern(i){
  const ix=getIx();
  const sel=ix.selected||[];
  if(!sel.includes(i)) sel.push(i);
  ix.selected=sel;
  setIx(ix);
  render();
}

function showPatternFeedback(){
  const ix=getIx();
  ix.feedbackShown=true;
  setIx(ix);
  render();
}

function openCtab(i){
  const ix=getIx();
  ix.openTab=ix.openTab===i?null:i;
  setIx(ix);
  render();
}

function answerCharter(secIdx,optIdx){
  const ix=getIx();
  const answers=ix.answers||{};
  answers[secIdx]=optIdx;
  ix.answers=answers;
  setIx(ix);
  render();
}

function selectScopeItem(i){
  const ix=getIx();
  ix.selectedItem=i;
  setIx(ix);
  render();
}

function placeScopeItem(zone){
  const ix=getIx();
  if(ix.selectedItem===undefined) return;
  const placed=ix.placed||{};
  placed[ix.selectedItem]=zone;
  ix.placed=placed;
  delete ix.selectedItem;
  setIx(ix);
  render();
}

function submitScopeSort(){
  const ix=getIx();
  ix.submitted=true;
  setIx(ix);
  render();
}

function selectAgendaItem(i){
  const ix=getIx();
  ix.selectedItem=i;
  setIx(ix);
  render();
}

function placeAgendaItem(dest){
  const ix=getIx();
  if(ix.selectedItem===undefined) return;
  const agenda=ix.agenda||[];
  const parking=ix.parking||[];
  if(dest==='agenda') agenda.push(ix.selectedItem);
  else parking.push(ix.selectedItem);
  ix.agenda=agenda;
  ix.parking=parking;
  delete ix.selectedItem;
  setIx(ix);
  render();
}

function removeAgendaItem(idx,from){
  const ix=getIx();
  if(from==='agenda'){
    ix.agenda=(ix.agenda||[]).filter(i=>i!==idx);
  } else {
    ix.parking=(ix.parking||[]).filter(i=>i!==idx);
  }
  setIx(ix);
  render();
}

function submitAgenda(){
  const ix=getIx();
  ix.submitted=true;
  setIx(ix);
  render();
}

function setRaciAnswer(key,val){
  const ix=getIx();
  const answers=ix.answers||{};
  answers[key]=val;
  ix.answers=answers;
  setIx(ix);
  // Don't re-render to avoid resetting dropdowns
  // Just update button state
  const btn=document.querySelector('#btn-confirm-raci');
  // Re-render to update submit button state
  render();
}

function submitRaci(){
  const ix=getIx();
  ix.submitted=true;
  setIx(ix);
  render();
}

function flagProblem(i){
  const ix=getIx();
  const flagged=ix.flagged||[];
  if(!flagged.includes(i)) flagged.push(i);
  ix.flagged=flagged;
  setIx(ix);
  render();
}

function setMilestoneStatus(i,status){
  const ix=getIx();
  const answers=ix.answers||{};
  answers[i]=status;
  ix.answers=answers;
  setIx(ix);
  render();
}

function submitMilestones(){
  const ix=getIx();
  ix.submitted=true;
  setIx(ix);
  render();
}

function dtChoice(dp,choice){
  const ix=getIx();
  const choices=ix.choices||{};
  const defs={1:{correct:2},2:{correct:1},3:{correct:1}};
  choices[dp]=choice;
  ix.choices=choices;
  if(choice===defs[dp].correct){
    if(dp<3) ix.decisionPoint=dp+1;
    else ix.complete=true;
  }
  ix.decisionPoint=ix.decisionPoint||dp;
  setIx(ix);
  render();
}

function toggleReflect(i){
  const ix=getIx();
  const checks=ix.checks||{};
  checks[i]=!checks[i];
  ix.checks=checks;
  setIx(ix);
  render();
}

function setCsAnswer(i,status){
  const ix=getIx();
  const csAnswers=ix.csAnswers||{};
  csAnswers[i]=status;
  ix.csAnswers=csAnswers;
  setIx(ix);
  render();
}

function submitCsStatus(){
  const ix=getIx();
  ix.csSubmitted=true;
  setIx(ix);
  render();
}

function dtChoiceClosure(dp,choice){
  const ix=getIx();
  const choices=ix.choices||{};
  const defs={1:{correct:1},2:{correct:1},3:{correct:1}};
  if(choice===null){
    ix.decisionPoint=dp;
    setIx(ix);
    render();
    return;
  }
  choices[dp]=choice;
  ix.choices=choices;
  if(choice===defs[dp].correct){
    if(dp<3) ix.decisionPoint=dp+1;
    else ix.complete=true;
  }
  ix.decisionPoint=ix.decisionPoint||dp;
  setIx(ix);
  render();
}

function answerAssess(optIdx){
  S.aa[S.si]=optIdx;
  save();
  render();
}

function goAssessQ(i){
  if(i<0||i>=AQ.length) return;
  if(S.aSubmitted){S.si=i;render();return;}
  S.si=i;
  render();
}

function submitAssessment(){
  if(Object.keys(S.aa).length<AQ.length) return;
  S.aSubmitted=true;
  S.aScore=AQ.filter((_,i)=>S.aa[i]===AQ[i].cor).length;
  save();
  goPage('results');
}

function retakeAssessment(){
  S.aa={};
  S.aSubmitted=false;
  S.aScore=null;
  S.si=0;
  save();
  goPage('assessment');
}

function startCourse(){
  if(!S.name) {
    const inp=document.getElementById('learner-name');
    if(inp&&inp.value.trim()){S.name=inp.value.trim();save();}
  }
  // Find first incomplete module
  let found=false;
  for(let mi=0;mi<4;mi++){
    if(!S.done[mi]){
      goModule(mi);
      found=true;
      break;
    }
  }
  if(!found){
    S.page='assessment';S.si=0;save();render();
  }
}

function setName(val){
  S.name=val;
  save();
}

function viewJobAid(id){
  S.resourceAid=id;
  save();
  render();
}

function clearJobAid(){
  delete S.resourceAid;
  save();
  render();
}

// ========== MAIN RENDER ==========
function render(){
  const sb=document.getElementById('sidebar');
  const mc=document.getElementById('main-content');
  sb.innerHTML=renderSidebar();
  let html='';
  switch(S.page){
    case 'landing': html=renderLanding(); break;
    case 'module': html=renderModule(); break;
    case 'assessment': html=renderAssessment(); break;
    case 'results': html=renderResults(); break;
    case 'certificate': html=renderCertificate(); break;
    case 'resources': html=renderResources(); break;
    default: html=renderLanding();
  }
  mc.innerHTML=html;
  // Re-attach sidebar interactions
  initSidebarUI();
}

function initSidebarUI(){
  const ham=document.getElementById('hamburger');
  const overlay=document.getElementById('sb-overlay');
  const sb=document.getElementById('sidebar');
  if(ham){
    ham.onclick=()=>{
      const open=sb.classList.contains('sb-open');
      sb.classList.toggle('sb-open',!open);
      overlay.classList.toggle('show',!open);
      ham.setAttribute('aria-expanded',!open);
    };
  }
  if(overlay){
    overlay.onclick=()=>{
      sb.classList.remove('sb-open');
      overlay.classList.remove('show');
      ham&&ham.setAttribute('aria-expanded',false);
    };
  }
  // Keyboard nav for module items (enter/space)
  document.querySelectorAll('.mod-item, .path-card, .exp-card').forEach(el=>{
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}
    });
  });
}

// ========== INIT ==========
load();
if(!S.page) S.page='landing';
render();
</script>
</body>
</html>
