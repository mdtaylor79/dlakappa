<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Sign Up Roster — DLGRF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap">
  <style>
    :root {
      --bg:        #ffffff;
      --surface:   #ffffff;
      --surface2:  #f2ebd7;
      --border:    #e0d6c0;
      --crimson:   #70110c;
      --crimson-dim: #9a1a14;
      --silver:    #5a4a3a;
      --text:      #1a0a08;
      --text-dim:  #7a6055;
      --tabc-yes:  #2a7a4a;
      --tabc-no:   #c04040;
      --badge-bg:  #f2ebd7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 3px solid var(--crimson);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo-mark {
      width: 44px; height: 44px;
      background: var(--crimson);
      border-radius: 6px;
      display: grid; place-items: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: #f2ebd7;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .header-title h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.06em;
      color: var(--text);
      line-height: 1.1;
    }
    .header-title p {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .stat-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-dim);
      display: flex; align-items: center; gap: 6px;
    }
    .stat-pill strong { color: var(--crimson); font-weight: 600; font-variant-numeric: tabular-nums; }

    .btn {
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.82; }
    .btn-primary { background: var(--crimson); color: #f2ebd7; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* FILTER BAR */
    .filter-bar {
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .filter-bar label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .filter-bar select, .filter-bar input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .filter-bar select:focus, .filter-bar input:focus { border-color: var(--crimson); }
    .filter-bar input { width: 200px; }
    .filter-bar .spacer { flex: 1; }

    /* MAIN */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 32px 80px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* LOADING / EMPTY */
    .state-msg {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
      font-size: 15px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--crimson);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* GAME CARD */
    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .game-header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 24px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .game-date-block { flex-shrink: 0; text-align: center; min-width: 52px; }
    .game-month {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--crimson);
    }
    .game-day {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 44px;
      line-height: 1;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .game-year { font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; }
    .game-divider {
      width: 1px; height: 52px;
      background: var(--border);
      flex-shrink: 0;
    }
    .game-info { flex: 1; min-width: 0; }
    .game-matchup {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 0.06em;
      color: var(--text);
      line-height: 1.1;
      text-wrap: balance;
    }
    .game-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
    .game-count {
      margin-left: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .game-count strong { color: var(--text); font-weight: 600; }

    /* ROSTER TABLE */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    thead tr { border-bottom: 1px solid var(--border); }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 10px 16px;
      white-space: nowrap;
      background: var(--bg);
    }
    td {
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface2); transition: background 0.1s; }

    .vol-name { font-weight: 500; }
    .vol-sub { color: var(--text-dim); font-size: 13px; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .badge-assignment {
      background: var(--badge-bg);
      color: var(--silver);
      border: 1px solid var(--border);
    }
    .badge-tabc-yes {
      background: rgba(42,122,74,0.1);
      color: var(--tabc-yes);
      border: 1px solid rgba(42,122,74,0.25);
    }
    .badge-tabc-no {
      background: rgba(192,64,64,0.08);
      color: var(--tabc-no);
      border: 1px solid rgba(192,64,64,0.2);
    }
    .badge-status {
      background: rgba(112,17,12,0.08);
      color: var(--crimson);
      border: 1px solid rgba(112,17,12,0.2);
    }
    .expiry-note { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

    .no-volunteers {
      padding: 28px 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
      font-style: italic;
    }

    /* PRINT */
    @media print {
      header { position: static; box-shadow: none; }
      .filter-bar, .btn { display: none !important; }
      body { background: white; color: black; }
      .game-card { break-inside: avoid; border: 1px solid #ccc; box-shadow: none; }
      th { background: #f5f5f5; }
    }

    @media (max-width: 640px) {
      header, .filter-bar, main { padding-left: 16px; padding-right: 16px; }
      .game-day { font-size: 34px; }
      .filter-bar input { width: 140px; }
      .stat-pill { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">DLA</div>
    <div class="header-title">
      <h1>Game Sign Up Roster</h1>
      <p>AT&amp;T Stadium · 2026–27 Cowboys Season</p>
    </div>
  </div>
  <div class="header-right">
    <div class="stat-pill">Volunteers: <strong id="stat-total">—</strong></div>
    <div class="stat-pill">Games: <strong id="stat-games">—</strong></div>
    <button class="btn btn-primary" onclick="loadRoster()">↻ Refresh</button>
  </div>
</header>

<div class="filter-bar">
  <label>Search:</label>
  <input type="text" id="search" placeholder="Name or email…" oninput="renderRoster()">
  <label>Assignment:</label>
  <select id="filter-assignment" onchange="renderRoster()">
    <option value="">All Assignments</option>
    <option>Concessions</option>
    <option>Guest Services</option>
    <option>Parking/Traffic</option>
    <option>Security Support</option>
    <option>Anywhere Needed</option>
  </select>
  <label>TABC:</label>
  <select id="filter-tabc" onchange="renderRoster()">
    <option value="">All</option>
    <option value="yes">Certified</option>
    <option value="no">Not Certified</option>
  </select>
  <div class="spacer"></div>
  <button class="btn btn-secondary" onclick="exportCSV()">⬇ Export CSV</button>
  <button class="btn btn-secondary" onclick="window.print()">🖨 Print</button>
</div>

<div id="loading" class="state-msg">
  <div class="spinner"></div>
  Loading volunteer roster…
</div>

<main id="roster-main" style="display:none;"></main>

<script>
  const SUPABASE_URL = 'https://eithccduveikejdhvnmq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpdGhjY2R1dmVpa2VqZGh2bm1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyODU4MDYsImV4cCI6MjA5OTg2MTgwNn0.fuqE-f5TjxvN1xuxfJqstnlvVF22VdKkwRLdsGMQcoQ';

  const GAME_SCHEDULE = {
    '2026-09-20': { matchup: 'Cowboys vs. Cleveland Browns',     day: 'Sunday',   time: '12:00 PM CT' },
    '2026-10-08': { matchup: 'Cowboys vs. Philadelphia Eagles',  day: 'Thursday', time: '7:20 PM CT'  },
    '2026-11-01': { matchup: 'Cowboys vs. Washington Commanders',day: 'Sunday',   time: '3:25 PM CT'  },
    '2026-11-15': { matchup: 'Cowboys vs. New York Giants',      day: 'Sunday',   time: '7:20 PM CT'  },
    '2026-11-26': { matchup: 'Cowboys vs. Atlanta Falcons',      day: 'Thursday', time: '3:30 PM CT — Thanksgiving' },
    '2026-12-13': { matchup: 'Cowboys vs. Chicago Bears',        day: 'Sunday',   time: '12:00 PM CT' },
    '2027-01-03': { matchup: 'Cowboys vs. Philadelphia Eagles',  day: 'Sunday',   time: '3:25 PM CT — Season Finale' },
  };

  let allVolunteers = [];

  async function loadRoster() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('roster-main').style.display = 'none';
    document.getElementById('loading').innerHTML = '<div class="spinner"></div>Loading volunteer roster…';

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/volunteers?select=full_name,email,mobile_phone,preferred_assignment,tabc_certified,tabc_expiry,volunteer_dates,status&order=full_name.asc`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allVolunteers = await res.json();
    } catch (e) {
      document.getElementById('loading').innerHTML = `<p style="color:var(--tabc-no)">Could not load roster — ${e.message}. Please refresh.</p>`;
      return;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('roster-main').style.display = 'flex';
    renderRoster();
  }

  function applyFilters() {
    const search = document.getElementById('search').value.toLowerCase();
    const filterAssign = document.getElementById('filter-assignment').value;
    const filterTabc = document.getElementById('filter-tabc').value;
    return allVolunteers.filter(v => {
      if (search && !v.full_name?.toLowerCase().includes(search) && !v.email?.toLowerCase().includes(search)) return false;
      if (filterAssign && v.preferred_assignment !== filterAssign) return false;
      if (filterTabc === 'yes' && !v.tabc_certified) return false;
      if (filterTabc === 'no' && v.tabc_certified) return false;
      return true;
    });
  }

  function renderRoster() {
    const filtered = applyFilters();

    const byGame = {};
    filtered.forEach(v => {
      (v.volunteer_dates || []).forEach(d => {
        if (!byGame[d]) byGame[d] = [];
        byGame[d].push(v);
      });
    });

    const sortedDates = Object.keys(byGame).sort();
    const uniqueVols = new Set(filtered.map(v => v.email)).size;
    document.getElementById('stat-total').textContent = uniqueVols;
    document.getElementById('stat-games').textContent = sortedDates.length;

    const main = document.getElementById('roster-main');
    if (sortedDates.length === 0) {
      main.innerHTML = '<div class="state-msg">No volunteers match the current filters.</div>';
      return;
    }

    main.innerHTML = sortedDates.map(date => {
      const vols = byGame[date];
      const game = GAME_SCHEDULE[date] || {};
      const d = new Date(date + 'T12:00:00');
      const month = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
      const day = d.getDate();
      const year = d.getFullYear();

      const rows = vols.map(v => {
        const tabc = v.tabc_certified
          ? `<span class="badge badge-tabc-yes">✓ Certified</span>${v.tabc_expiry ? `<div class="expiry-note">Exp ${v.tabc_expiry}</div>` : ''}`
          : `<span class="badge badge-tabc-no">✗ Not Certified</span>`;
        const phone = v.mobile_phone
          ? v.mobile_phone.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3')
          : '—';
        return `<tr>
          <td><div class="vol-name">${esc(v.full_name || '—')}</div><div class="vol-sub">${esc(v.email || '')}</div></td>
          <td class="vol-sub">${phone}</td>
          <td><span class="badge badge-assignment">${esc(v.preferred_assignment || 'Unspecified')}</span></td>
          <td>${tabc}</td>
          <td><span class="badge badge-status">${esc(v.status || 'Registered')}</span></td>
        </tr>`;
      }).join('');

      return `<div class="game-card">
        <div class="game-header">
          <div class="game-date-block">
            <div class="game-month">${month}</div>
            <div class="game-day">${day}</div>
            <div class="game-year">${year}</div>
          </div>
          <div class="game-divider"></div>
          <div class="game-info">
            <div class="game-matchup">${esc(game.matchup || 'Game TBD')}</div>
            <div class="game-meta">${esc(game.day || '')} · ${esc(game.time || '')} · AT&amp;T Stadium, Arlington TX</div>
          </div>
          <div class="game-count"><strong>${vols.length}</strong> volunteer${vols.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Volunteer</th><th>Phone</th><th>Assignment</th><th>TABC</th><th>Status</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
    }).join('');
  }

  function exportCSV() {
    const filtered = applyFilters();
    const rows = [['Game Date','Matchup','Full Name','Email','Phone','Assignment','TABC Certified','TABC Expiry','Status']];
    filtered.forEach(v => {
      (v.volunteer_dates || []).forEach(date => {
        const game = GAME_SCHEDULE[date] || {};
        const phone = v.mobile_phone ? v.mobile_phone.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3') : '';
        rows.push([date, game.matchup || 'TBD', v.full_name || '', v.email || '', phone,
          v.preferred_assignment || '', v.tabc_certified ? 'Yes' : 'No', v.tabc_expiry || '', v.status || 'Registered']);
      });
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `DLGRF-GameRoster-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadRoster();
</script>
</body>
</html>
