<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyByeD0nNCcgZmlsbD0nIzcwMTEwYycvPjx0ZXh0IHg9JzE2JyB5PScyMicgdGV4dC1hbmNob3I9J21pZGRsZScgZm9udC1mYW1pbHk9J0dlb3JnaWEsc2VyaWYnIGZvbnQtc2l6ZT0nMTMnIGZvbnQtd2VpZ2h0PSdib2xkJyBmaWxsPScjYzlhODRjJz5LQVx4Y2VceGE4PC90ZXh0Pjwvc3ZnPg==" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cr:#70110c;--cr-d:#4a0b08;--cm:#f2ebd7;--go:#c9a84c;--sw:260px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;}
/* SIDEBAR */
#sidebar{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--cr);color:#fff;display:flex;flex-direction:column;overflow-y:auto;z-index:100;transition:transform .3s;}
.sb-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo-badge{width:42px;height:42px;background:var(--go);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--cr-d);flex-shrink:0;font-family:'Playfair Display',serif}
.sb-title{font-size:12px;font-weight:700;color:var(--cm);line-height:1.3;letter-spacing:.02em}
.sb-sub{font-size:10px;color:rgba(242,235,215,.55);margin-top:2px}
.sb-progress{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.prog-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(242,235,215,.55);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.prog-track{height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--go);border-radius:3px;transition:width .4s ease}
.sb-nav{flex:1;padding:8px 0}
.sec-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,235,215,.38);padding:10px 16px 3px}
.mod-item{display:flex;align-items:flex-start;gap:9px;padding:9px 14px;cursor:pointer;transition:background .2s;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.mod-item:hover{background:rgba(255,255,255,.07)}
.mod-item.active{background:rgba(255,255,255,.11);border-left-color:var(--go)}
.mod-item.completed .mod-badge{background:var(--go);color:var(--cr-d)}
.mod-badge{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--cm);flex-shrink:0;margin-top:1px}
.mod-title{font-size:12px;font-weight:600;color:var(--cm);line-height:1.3}
.mod-sub{font-size:10px;color:rgba(242,235,215,.48);margin-top:1px}
/* MAIN */
#main{margin-left:var(--sw);min-height:100vh;transition:margin-left .3s;}
/* HAMBURGER */
#hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--cr);color:#fff;border:none;border-radius:6px;width:40px;height:40px;font-size:1.2rem;cursor:pointer;align-items:center;justify-content:center;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;}
/* LANDING */
.land-hero{background:var(--cr);color:#fff;padding:60px 40px 48px;text-align:center;}
.land-kap{font-size:1rem;font-weight:600;letter-spacing:3px;color:var(--go);text-transform:uppercase;margin-bottom:12px;}
.land-hero h1{font-family:'Playfair Display',serif;font-size:2rem;line-height:1.3;margin-bottom:16px;}
.land-hero p{font-size:1rem;opacity:.85;max-width:560px;margin:0 auto;}
.land-body{padding:40px;max-width:720px;margin:0 auto;}
.land-name-box{background:#fff;border-radius:10px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:28px;}
.land-name-box label{display:block;font-weight:600;margin-bottom:8px;color:var(--cr);}
.land-name-box input{width:100%;padding:10px 14px;border:2px solid #ddd;border-radius:6px;font-size:1rem;font-family:'Inter',sans-serif;}
.land-name-box input:focus{outline:none;border-color:var(--cr);}
.land-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
.stat-card{background:#fff;border-radius:8px;padding:18px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.stat-n{font-size:1.8rem;font-weight:700;color:var(--cr);font-family:'Playfair Display',serif;}
.stat-l{font-size:.75rem;color:#666;margin-top:2px;}
.land-obj{background:#fff;border-radius:10px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:28px;}
.land-obj h3{font-size:.85rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cr);margin-bottom:12px;}
.land-obj ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.land-obj li{font-size:.85rem;padding-left:16px;position:relative;color:#444;line-height:1.4;}
.land-obj li::before{content:'›';position:absolute;left:0;color:var(--go);font-weight:700;}
.btn-begin{display:block;width:100%;padding:16px;background:var(--cr);color:#fff;border:none;border-radius:8px;font-size:1.05rem;font-weight:600;cursor:pointer;transition:opacity .2s;}
.btn-begin:hover{opacity:.88;}
/* MODULE SCREEN */
.mod-header{background:var(--cr);color:#fff;padding:28px 36px 22px;}
.mod-label{font-size:.7rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--go);margin-bottom:6px;}
.mod-header h2{font-family:'Playfair Display',serif;font-size:1.5rem;line-height:1.3;}
.screen-dots{display:flex;gap:8px;padding:14px 36px;background:#fff;border-bottom:1px solid #eee;}
.dot{width:10px;height:10px;border-radius:50%;background:#ddd;cursor:pointer;transition:background .2s;}
.dot.active{background:var(--cr);}
.dot.done{background:var(--go);}
.screen-body{padding:28px 36px;max-width:780px;}
.screen-body h3{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--cr);margin-bottom:14px;}
.screen-body p{font-size:.9rem;line-height:1.6;color:#333;margin-bottom:12px;}
.screen-body ul{list-style:none;margin-bottom:14px;}
.screen-body ul li{font-size:.9rem;line-height:1.5;color:#333;padding-left:20px;position:relative;margin-bottom:6px;}
.screen-body ul li::before{content:'';position:absolute;left:0;color:var(--go);}
.info-box{background:var(--cm);border-left:4px solid var(--go);border-radius:0 6px 6px 0;padding:14px 16px;margin-bottom:14px;font-size:.88rem;line-height:1.6;}
.exp-card{border:1px solid #e0ddd6;border-radius:8px;overflow:hidden;margin-bottom:10px;}
.exp-card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;background:#fff;font-weight:600;font-size:.88rem;}
.exp-card-head:hover{background:#faf9f5;}
.exp-card-body{display:none;padding:12px 16px;background:#fafaf8;font-size:.85rem;line-height:1.6;color:#444;}
.exp-card.open .exp-card-body{display:block;}
.exp-card-head .arr{transition:transform .2s;}
.exp-card.open .arr{transform:rotate(180deg);}
/* INLINE QUIZ */
.quiz-wrap{background:#fff;border:2px solid #e8e4dc;border-radius:10px;padding:20px;margin:16px 0;}
.quiz-q{font-weight:600;font-size:.9rem;margin-bottom:12px;color:#1a1a1a;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;}
.quiz-opt{padding:10px 14px;border:2px solid #ddd;border-radius:6px;cursor:pointer;font-size:.85rem;text-align:left;background:#fff;transition:border-color .2s;}
.quiz-opt:hover:not(:disabled){border-color:var(--cr);}
.quiz-opt.correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;}
.quiz-opt.wrong{border-color:#c62828;background:#ffebee;color:#b71c1c;}
.quiz-feedback{margin-top:10px;font-size:.82rem;padding:8px 12px;border-radius:6px;display:none;}
.quiz-feedback.show{display:block;}
.quiz-feedback.ok{background:#e8f5e9;color:#2e7d32;}
.quiz-feedback.bad{background:#ffebee;color:#c62828;}
/* NAV BAR */
.nav-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e0ddd6;padding:14px 36px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.nav-btn{padding:10px 22px;border-radius:6px;border:none;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .2s;}
.nav-btn.prev{background:#f0ede7;color:#555;}
.nav-btn.next{background:var(--cr);color:#fff;}
.nav-btn:hover{opacity:.85;}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.nav-pos{font-size:.8rem;color:#888;}
/* ASSESSMENT */
.assess-wrap{padding:36px;max-width:760px;}
.assess-wrap h2{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--cr);margin-bottom:8px;}
.assess-wrap .sub{color:#666;font-size:.9rem;margin-bottom:24px;}
.assess-q{background:#fff;border-radius:10px;padding:20px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.assess-q-num{font-size:.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--go);margin-bottom:6px;}
.assess-q-txt{font-weight:600;font-size:.9rem;margin-bottom:12px;}
.assess-opt{display:block;padding:9px 14px;border:2px solid #ddd;border-radius:6px;cursor:pointer;font-size:.85rem;text-align:left;background:#fff;margin-bottom:6px;width:100%;transition:border-color .2s;}
.assess-opt:hover{border-color:var(--cr);}
.assess-opt.selected{border-color:var(--cr);background:#fdf5f5;}
.assess-opt.correct{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;}
.assess-opt.wrong{border-color:#c62828;background:#ffebee;color:#c62828;}
.assess-submit{width:100%;padding:14px;background:var(--cr);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px;}
.assess-submit:disabled{opacity:.4;cursor:not-allowed;}
/* RESULTS */
.result-card{background:#fff;border-radius:12px;padding:36px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.08);margin-bottom:24px;}
.result-score{font-size:3rem;font-weight:700;font-family:'Playfair Display',serif;color:var(--cr);}
.result-label{font-size:1rem;color:#666;margin:4px 0 16px;}
.result-badge{display:inline-block;padding:6px 18px;border-radius:20px;font-size:.85rem;font-weight:700;margin-bottom:16px;}
.pass-badge{background:#e8f5e9;color:#2e7d32;}
.fail-badge{background:#ffebee;color:#c62828;}
.result-msg{font-size:.9rem;color:#555;max-width:420px;margin:0 auto;}
.retry-btn{padding:12px 28px;background:#f0ede7;color:#333;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;margin-right:12px;}
.cert-btn{padding:12px 28px;background:var(--cr);color:#fff;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;}
/* CERTIFICATE */
.cert-wrap{padding:36px;max-width:720px;}
.cert-card{background:#fff;border:3px solid var(--go);border-radius:12px;padding:48px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.1);}
.cert-kap{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--cr);letter-spacing:3px;margin-bottom:4px;}
.cert-sub{font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:24px;}
.cert-card h2{font-family:'Playfair Display',serif;font-size:1.2rem;color:#333;margin-bottom:8px;}
.cert-name{font-family:'Playfair Display',serif;font-size:2rem;color:var(--cr);margin:12px 0;border-bottom:2px solid var(--go);padding-bottom:12px;}
.cert-course{font-size:.9rem;color:#555;max-width:480px;margin:0 auto 20px;}
.cert-date{font-size:.8rem;color:#888;margin-bottom:28px;}
.cert-seal{display:inline-block;width:60px;height:60px;border-radius:50%;background:var(--cr);color:var(--go);font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;line-height:60px;margin-bottom:16px;}
.print-btn{padding:12px 28px;background:var(--cr);color:#fff;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;}
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #hamburger{display:flex;}
  #overlay.show{display:block;}
  .land-hero{padding:60px 20px 36px;}
  .land-hero h1{font-size:1.5rem;}
  .land-body{padding:20px;}
  .land-stats{grid-template-columns:1fr 1fr;}
  .land-obj ul{grid-template-columns:1fr;}
  .screen-body,.nav-bar{padding-left:20px;padding-right:20px;}
  .mod-header{padding:24px 20px 18px;}
  .screen-dots{padding:12px 20px;}
  .assess-wrap,.cert-wrap{padding:20px;}
}
@media print{
  #sidebar,#hamburger,#overlay,.print-btn{display:none!important;}
  #main{margin-left:0!important;}
  .cert-card{box-shadow:none;border:2px solid var(--go);}
}
</style>
</head>
<body>
<button id="hamburger" aria-label="Menu">&#9776;</button>
<div id="overlay"></div>
<nav id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">
      <div class="logo-badge">K&#913;&#936;</div>
      <div>
        <div class="sb-title">Constitution &amp; Statutes</div>
        <div class="sb-sub">Denton-Lewisville Alumni Chapter · 2026</div>
      </div>
    </div>
  </div>
  <div class="sb-progress">
    <div class="prog-label"><span>COURSE PROGRESS</span><span id="pct">0%</span></div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div class="sb-nav" id="sbNav"></div>
</nav>
<main id="main"></main>
<script>
const NS='DLA_CONS_STAT_2026';
let S={page:'landing',mi:0,si:0,name:'',done:[false,false,false,false,false,false,false,false,false],visited:{},ix:{},aa:{},aScore:null,aSubmitted:false};
function save(){try{localStorage.setItem(NS,JSON.stringify(S));}catch(e){}}
function load(){try{const d=localStorage.getItem(NS);if(d){const p=JSON.parse(d);if(p&&p.name!==undefined)Object.assign(S,p);}}catch(e){}}

const MODS=[
  {title:'Constitution, Statutes &amp; Bylaws — The Whole System',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'The Governance Hierarchy — Bylaws, Policies, Guides &amp; SOPs',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'Navigating the Governing Documents',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'Constitution I — Identity, Objectives &amp; Government',dur:'~30 min',screens:10,section:'THE CONSTITUTION'},
  {title:'Constitution II — The National Governing Bodies',dur:'~30 min',screens:10,section:'THE CONSTITUTION'},
  {title:'Constitution III — Provinces, Chapters, Membership &amp; Change',dur:'~30 min',screens:10,section:'THE CONSTITUTION'},
  {title:'Statutes I — Money, Funds &amp; Operations',dur:'~30 min',screens:10,section:'THE STATUTES'},
  {title:'Statutes II — Elections, Chapters &amp; Membership',dur:'~30 min',screens:10,section:'THE STATUTES'},
  {title:'Statutes III — Programs, Awards, Ritual &amp; Discipline',dur:'~30 min',screens:10,section:'THE STATUTES'}
];

function calcProgress(){
  let total=0,done=0;
  MODS.forEach((m,i)=>{total+=m.screens;for(let s=0;s<m.screens;s++){if(S.visited[i+','+s])done++;}});
  total+=2;
  if(S.aScore!==null)done++;
  if(S.done.every(d=>d)&&S.aScore>=0.8)done++;
  return Math.round((done/total)*100);
}

function renderNav(){
  let html='', lastSec='';
  MODS.forEach((m,i)=>{
    if(m.section !== lastSec){
      html += `<div class="sec-label">${m.section}</div>`;
      lastSec = m.section;
    }
    const active = S.mi===i && S.page==='module';
    const done = S.done[i];
    html += `<button class="mod-item${active?' active':''}${done?' completed':''}" onclick="goModule(${i})">
      <div class="mod-badge">${i+1}</div>
      <div>
        <div class="mod-title">${m.title}</div>
        <div class="mod-sub">Module ${i+1} · ${m.dur}</div>
      </div>
    </button>`;
  });
  document.getElementById('sbNav').innerHTML = html;
}

function updateProgress(){
  const pct = calcProgress();
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('pct').textContent = pct+'%';
}

function goModule(mi){
  S.page='module';S.mi=mi;S.si=0;save();render();
  if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open');
}
function goToScreen(si){S.si=si;save();render();}
function prevScreen(){if(S.si>0){S.si--;save();render();}}
function nextScreen(){
  const m=MODS[S.mi];
  S.visited[S.mi+','+S.si]=true;
  if(S.si<m.screens-1){S.si++;save();render();}
  else{
    S.done[S.mi]=true;save();
    if(S.mi<MODS.length-1){
      const next=S.mi+1;
      const existing=document.getElementById('mod-complete-bar');
      if(!existing){
        const bar=document.createElement('div');
        bar.id='mod-complete-bar';
        bar.style.cssText='padding:16px 36px;background:#fff;border-top:1px solid #eee;display:flex;gap:12px;align-items:center;';
        bar.innerHTML=`<span style="font-size:.9rem;color:#555;flex:1">Module ${S.mi+1} complete!</span>
          <button class="nav-btn prev" onclick="goPage('landing')">Course Home</button>
          <button class="nav-btn next" onclick="goModule(${next})">Next Module →</button>`;
        document.getElementById('main').appendChild(bar);
      }
    } else {
      const existing=document.getElementById('mod-complete-bar');
      if(!existing){
        const bar=document.createElement('div');
        bar.id='mod-complete-bar';
        bar.style.cssText='padding:16px 36px;background:#fff;border-top:1px solid #eee;display:flex;gap:12px;align-items:center;';
        bar.innerHTML=`<span style="font-size:.9rem;color:#555;flex:1">All modules complete! Ready for the final assessment.</span>
          <button class="nav-btn next" onclick="goPage('assess')">Take Assessment →</button>`;
        document.getElementById('main').appendChild(bar);
      }
    }
    renderNav(); updateProgress();
  }
}

function screenDots(count,cur){
  return '<div class="screen-dots">'+
    Array.from({length:count},(_,i)=>`<div class="dot${i===cur?' active':i<cur?' done':''}" onclick="goToScreen(${i})"></div>`).join('')+
    '</div>';
}
function modHeader(mi){
  const m=MODS[mi];
  return `<div class="mod-header"><div class="mod-label">Module ${mi+1} · ${m.section}</div><h2>${m.title}</h2></div>`;
}
function navBar(si,total){
  const isLast=si===total-1;
  const nextLabel=isLast?'Complete Module ':'Next →';
  return `<div class="nav-bar">
    <button class="nav-btn prev" onclick="prevScreen()" ${si===0?'disabled':''}← Back</button>
    <span class="nav-pos">Screen ${si+1} of ${total}</span>
    <button class="nav-btn next" onclick="nextScreen()">${nextLabel}</button>
  </div>`;
}
function renderQuiz(qid,question,opts,correctIdx,feedback){
  const ans=S.ix[qid];
  const done=ans!==undefined;
  let optsHtml=opts.map((o,i)=>{
    let cls='';
    if(done){cls=i===correctIdx?'correct':(i===ans?'wrong':'');}
    return `<button class="quiz-opt ${cls}" onclick="answerQuiz('${qid}',${i},${i===correctIdx})" ${done?'disabled':''}>${o}</button>`;
  }).join('');
  const fbCls=done?(ans===correctIdx?'ok':'bad'):'';
  const fbShow=done?'show':'';
  return `<div class="quiz-wrap"><div class="quiz-q">${question}</div><div class="quiz-opts">${optsHtml}</div>
    <div class="quiz-feedback ${fbCls} ${fbShow}">${feedback}</div></div>`;
}
function answerQuiz(qid,sel,correct){
  if(S.ix[qid]!==undefined)return;
  S.ix[qid]=sel;save();render();
}

// MODULE SCREEN CONTENT
function m0s0(){return `<div class="screen-body">
  <h3>Three Documents, One Framework</h3>
  <p>Kappa Alpha Psi is governed by three primary documents that form a unified legal framework:</p>
  <ul>
    <li><strong>The Constitution</strong> — The supreme governing document; cannot be overridden</li>
    <li><strong>The Statutes</strong> — Operational rules enacted under the Constitution</li>
    <li><strong>The Ritual</strong> — Esoteric, ceremonial law; third in precedence</li>
  </ul>
  <div class="info-box"><strong>Order of Precedence (Art. III §5):</strong> Constitution → Statutes → Ritual → Fraternity Regulations → Province Council Rules → Chapter Bylaws</div>
  <p>Every rule at every level must align with the document above it. Nothing in the Statutes may contradict the Constitution.</p>
</div>`;}
function m0s1(){return `<div class="screen-body">
  <h3>Where Chapter Bylaws Fit</h3>
  <p>Chapter Bylaws are local rules — but they sit at the <em>bottom</em> of the hierarchy. They may add local structure but cannot contradict anything above them.</p>
  <ul>
    <li>Chapter Bylaws must be approved by IHQ before taking effect</li>
    <li>A chapter cannot grant itself authority the Constitution reserves to Grand Chapter</li>
    <li>If a bylaw conflicts with the Constitution, the Constitution wins automatically</li>

const FINAL_PASS=0.8;

function renderAssessment(){
  if(S.aSubmitted){renderResults();return;}
  let html=`<div class="assess-wrap"><h2>Final Assessment</h2><div class="sub">Answer all 15 questions. You need 12 correct (80%) to pass.</div>`;
  AQ.forEach((q,i)=>{
    const sel=S.aa[i];
    html+=`<div class="assess-q"><div class="assess-q-num">Question ${i+1} of ${AQ.length}</div><div class="assess-q-txt">${q.q}</div>`;
    q.opts.forEach((o,j)=>{
      const cls=sel===j?'selected':'';
      html+=`<button class="assess-opt ${cls}" onclick="selectAssess(${i},${j})">${o}</button>`;
    });
    html+='</div>';
  });
  const allAnswered=AQ.every((_,i)=>S.aa[i]!==undefined);
  html+=`<button class="assess-submit" onclick="submitAssess()" ${allAnswered?'':'disabled'}>Submit Assessment</button></div>`;
  document.getElementById('main').innerHTML=html;
}

function selectAssess(qi,opt){
  if(S.aSubmitted)return;
  S.aa[qi]=opt;save();
  const cards=document.querySelectorAll('.assess-q');
  if(cards[qi]){
    cards[qi].querySelectorAll('.assess-opt').forEach((b,j)=>{
      b.classList.toggle('selected',j===opt);
    });
  }
  const allAnswered=AQ.every((_,i)=>S.aa[i]!==undefined);
  const btn=document.querySelector('.assess-submit');
  if(btn)btn.disabled=!allAnswered;
}

function submitAssess(){
  let correct=0;
  AQ.forEach((q,i)=>{if(S.aa[i]===q.a)correct++;});
  S.aScore=correct/AQ.length;
  S.aSubmitted=true;save();
  renderResults();
}

function renderResults(){
  const pct=Math.round(S.aScore*100);
  const passed=S.aScore>=FINAL_PASS;
  const correct=Math.round(S.aScore*AQ.length);
  document.getElementById('main').innerHTML=`<div class="assess-wrap">
    <div class="result-card">
      <div class="cert-seal">KAΨ</div>
      <div class="result-score">${pct}%</div>
      <div class="result-label">${correct} of ${AQ.length} correct</div>
      <div class="result-badge ${passed?'pass-badge':'fail-badge'}">${passed?'PASSED':'NOT PASSED'}</div>
      <div class="result-msg">${passed?'Congratulations, Brother '+S.name+'! You have demonstrated mastery of the Constitution &amp; Statutes. Proceed to receive your certificate.':'You need 80% (12/15) to pass. Review the modules and try again.'}</div>
    </div>
    <div style="text-align:center;margin-top:8px;">
      ${!passed?`<button class="retry-btn" onclick="retryAssess()">Retry Assessment</button>`:''}
      ${passed?`<button class="cert-btn" onclick="goPage('cert')">View Certificate →</button>`:''}
    </div>
  </div>`;
  renderNav(); updateProgress();
}

function retryAssess(){
  S.aa={};S.aScore=null;S.aSubmitted=false;save();renderAssessment();
}

function renderCert(){
  const d=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('main').innerHTML=`<div class="cert-wrap">

      <div class="cert-kap">Kappa Alpha Psi Fraternity, Inc.</div>
      <div class="cert-sub">Certificate of Completion</div>

      <button class="print-btn" onclick="window.print()">Print Certificate</button>
    </div>
  </div>`;
}

function beginCourse(){
