<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cr:#70110c;--cr-d:#4a0b08;--cr-dd:#3a0906;--cr-l:#8c1812;
  --cm:#f2ebd7;--cm-d:#e5d9bf;--cm-dd:#d4c9a8;
  --go:#c9a84c;--go-d:#a88838;--go-l:#d4b563;
  --tx:#1a1a1a;--tx-m:#555;--tx-l:#888;
  --wh:#fff;--sw:260px;--r:8px;--rl:12px;
  --sh:0 2px 8px rgba(0,0,0,.12);--sh-l:0 4px 20px rgba(0,0,0,.15);
  --tr:.2s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--tx);background:#ede9df;min-height:100vh;line-height:1.6}
.skip-link{position:absolute;top:-40px;left:6px;background:var(--go);color:var(--cr-d);padding:8px 12px;border-radius:var(--r);font-weight:600;z-index:1000;text-decoration:none}
.skip-link:focus{top:6px}
#sidebar{width:var(--sw);min-width:var(--sw);background:var(--cr);height:100vh;position:fixed;left:0;top:0;overflow-y:auto;display:flex;flex-direction:column;z-index:100;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
#main{margin-left:var(--sw);min-height:100vh}
.sb-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo-badge{width:42px;height:42px;background:var(--go);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--cr-d);flex-shrink:0;font-family:'Playfair Display',serif}
.sb-title{font-size:12px;font-weight:700;color:var(--cm);line-height:1.3;letter-spacing:.02em}
.sb-sub{font-size:10px;color:rgba(242,235,215,.55);margin-top:2px}
.sb-progress{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.prog-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(242,235,215,.55);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.prog-track{height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--go);border-radius:3px;transition:width .4s ease}
.sb-nav{flex:1;padding:8px 0}
.sec-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,235,215,.38);padding:10px 16px 3px}
.mod-item{display:flex;align-items:flex-start;gap:9px;padding:9px 14px;cursor:pointer;transition:background var(--tr);border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.mod-item:hover{background:rgba(255,255,255,.07)}
.mod-item.active{background:rgba(255,255,255,.11);border-left-color:var(--go)}
.mod-item.completed .mod-badge{background:var(--go);color:var(--cr-d)}
.mod-badge{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--cm);flex-shrink:0;margin-top:1px}
.mod-title{font-size:12px;font-weight:600;color:var(--cm);line-height:1.3}
.mod-sub{font-size:10px;color:rgba(242,235,215,.48);margin-top:1px}
.sb-foot{padding:8px 0;border-top:1px solid rgba(255,255,255,.1)}
.sb-foot-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;transition:background var(--tr);border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.sb-foot-item:hover{background:rgba(255,255,255,.07)}
.sb-foot-item.active{background:rgba(255,255,255,.11);border-left-color:var(--go)}
.sb-foot-icon{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sb-foot-label{font-size:12px;font-weight:600;color:var(--cm)}
.hero{background:linear-gradient(135deg,var(--cr-dd) 0%,var(--cr) 55%,var(--cr-l) 100%);color:var(--wh);padding:52px 56px 48px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-8%;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.22);border:1px solid rgba(201,168,76,.45);color:var(--go);padding:5px 13px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:20px}
.draft-hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(184,92,0,.3);border:1px solid rgba(184,92,0,.6);color:#ffd090;padding:4px 12px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-left:8px}
.hero-title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;line-height:1.15;margin-bottom:14px;color:var(--wh);max-width:600px}
.hero-sub{font-size:15px;line-height:1.7;color:rgba(255,255,255,.72);max-width:540px;margin-bottom:28px}
.hero-name-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.hero-name-row label{font-size:13px;font-weight:600;color:var(--cm);white-space:nowrap}
.name-input{padding:10px 15px;border-radius:var(--r);border:2px solid rgba(201,168,76,.45);background:rgba(255,255,255,.1);color:var(--wh);font-size:14px;font-weight:500;width:230px;outline:none;transition:border-color var(--tr);font-family:inherit}
.name-input::placeholder{color:rgba(255,255,255,.38)}
.name-input:focus{border-color:var(--go)}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.stat-item{display:flex;align-items:center;gap:7px}
.stat-label{font-size:13px;font-weight:600;color:var(--cm)}
.btn-begin{display:inline-flex;align-items:center;gap:8px;background:var(--go);color:var(--cr-d);border:none;padding:13px 26px;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;transition:all var(--tr);font-family:inherit}
.btn-begin:hover{background:var(--go-l);transform:translateY(-1px)}
.btn-begin:focus{outline:3px solid var(--wh);outline-offset:2px}
.land-body{background:var(--wh);padding:48px 56px}
.sec-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--cr);margin-bottom:6px}
.sec-intro{font-size:14px;color:var(--tx-m);margin-bottom:22px;max-width:560px;line-height:1.6}
.obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:40px}
.obj-card{display:flex;align-items:flex-start;gap:11px;padding:15px;background:var(--cm);border-radius:var(--r);border-left:4px solid var(--go)}
.obj-num{width:26px;height:26px;background:var(--cr);color:var(--wh);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.obj-text{font-size:13px;line-height:1.5;color:var(--tx);font-weight:500}
.mod-page{min-height:100vh;background:#ede9df}
.mod-header{background:var(--cr);color:var(--wh);padding:24px 44px;display:flex;align-items:center;gap:18px}
.mod-num-badge{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);width:50px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.mod-num-sm{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.55);font-weight:600;line-height:1}
.mod-num-lg{font-size:20px;font-weight:800;color:var(--wh);line-height:1}
.mod-hdr-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5);font-weight:600;margin-bottom:3px}
.mod-hdr-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--wh);line-height:1.25}
.mod-content{padding:36px 44px;max-width:880px}
.scr-dots{display:flex;align-items:center;gap:7px;margin-bottom:24px}
.scr-dot{width:8px;height:8px;border-radius:50%;background:var(--cm-dd);transition:all var(--tr)}
.scr-dot.active{background:var(--cr);width:22px;border-radius:4px}
.scr-dot.done{background:var(--go)}
.card{background:var(--wh);border-radius:var(--rl);padding:26px 30px;margin-bottom:18px;box-shadow:var(--sh)}
.card h3{font-size:17px;font-weight:700;color:var(--cr);margin-bottom:11px}
.card p{font-size:14px;line-height:1.7;color:var(--tx);margin-bottom:11px}
.card p:last-child{margin-bottom:0}
.card ul,.card ol{margin-left:22px;margin-bottom:11px}
.card li{font-size:14px;line-height:1.6;color:var(--tx);margin-bottom:4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.callout{background:var(--cm);border-left:5px solid var(--go);padding:16px 20px;border-radius:0 var(--r) var(--r) 0;margin-bottom:16px;font-size:13px;line-height:1.7;color:var(--tx)}
.callout strong{color:var(--cr)}
.sl{list-style:none;padding:0}
.sl li{padding:7px 0 7px 22px;position:relative;font-size:14px;line-height:1.5;color:var(--tx);border-bottom:1px solid var(--cm-d)}
.sl li:last-child{border-bottom:none}
.sl li::before{content:'→';position:absolute;left:0;color:var(--go-d);font-weight:700}
.smart-tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.smart-tbl th{background:var(--cr);color:#fff;padding:9px 13px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.smart-tbl td{padding:10px 13px;border-bottom:1px solid var(--cm-d);vertical-align:top;line-height:1.5}
.smart-tbl tr:nth-child(even) td{background:var(--cm)}
.phase-box{border:1px solid var(--cm-d);border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:var(--wh)}
.phase-hdr{background:var(--cr);color:var(--wh);padding:10px 16px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:700}
.phase-num{width:26px;height:26px;border-radius:50%;background:var(--go);color:var(--cr-d);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phase-body{padding:14px 16px;font-size:13px;line-height:1.65;color:var(--tx)}
.path-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.path-card{border:2px solid var(--cm-d);border-radius:var(--r);overflow:hidden}
.path-head{padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--cr);color:var(--wh)}
.path-body{padding:14px;background:var(--wh);font-size:13px;line-height:1.6;color:var(--tx)}
.path-body ul{margin-left:16px;margin-top:5px}
.path-body li{margin-bottom:4px}
.quiz{background:var(--wh);border-radius:var(--rl);padding:26px 30px;margin-bottom:16px;box-shadow:var(--sh)}
.quiz-q-num{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx-l);font-weight:600;margin-bottom:8px}
.quiz-q{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:18px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:9px}
.quiz-opt{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border:2px solid var(--cm-d);border-radius:var(--r);cursor:pointer;transition:all var(--tr);background:var(--wh);font-family:inherit;text-align:left;width:100%}
.quiz-opt:hover:not(:disabled){border-color:var(--cr);background:var(--cm)}
.quiz-opt.sel{border-color:var(--cr);background:rgba(112,17,12,.05)}
.quiz-opt.cor{border-color:#15803d;background:rgba(21,128,61,.08)}
.quiz-opt.inc{border-color:#b91c1c;background:rgba(185,28,28,.07)}
.quiz-opt:disabled{cursor:not-allowed}
.opt-ltr{width:24px;height:24px;border-radius:50%;background:var(--cm-d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx-m);flex-shrink:0}
.quiz-opt.cor .opt-ltr{background:#15803d;color:#fff}
.quiz-opt.inc .opt-ltr{background:#b91c1c;color:#fff}
.opt-text{font-size:13px;line-height:1.5;color:var(--tx)}
.quiz-fb{margin-top:14px;padding:13px 15px;border-radius:var(--r);font-size:13px;line-height:1.5;display:none}
.quiz-fb.show{display:block}
.quiz-fb.cor-fb{background:rgba(21,128,61,.1);border:1px solid #15803d;color:#14532d}
.quiz-fb.inc-fb{background:rgba(185,28,28,.09);border:1px solid #b91c1c;color:#7f1d1d}
.mod-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 44px;background:var(--wh);border-top:1px solid var(--cm-d);position:sticky;bottom:0;z-index:10}
.btn-nav{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);border:2px solid;font-family:inherit}
.btn-prev{background:var(--wh);color:var(--cr);border-color:var(--cr)}
.btn-prev:hover{background:var(--cm)}
.btn-next{background:var(--cr);color:var(--wh);border-color:var(--cr)}
.btn-next:hover{background:var(--cr-d)}
.btn-nav:disabled{opacity:.38;cursor:not-allowed}
.btn-nav:focus{outline:3px solid var(--go);outline-offset:2px}
.scr-pos{font-size:12px;color:var(--tx-m);font-weight:500}
.assess-header{background:var(--cr);color:var(--wh);padding:24px 44px}
.assess-q-num{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:7px}
.assess-mod-tag{display:inline-block;background:rgba(255,255,255,.15);padding:2px 9px;border-radius:100px;font-size:10px;color:var(--cm);margin-bottom:14px}
.assess-q{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--wh);line-height:1.35}
.assess-body{padding:32px 44px;max-width:780px}
.assess-dots{display:flex;gap:5px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.assess-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--cm-d);background:var(--wh);font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr);color:var(--tx-m)}
.assess-dot.answered{background:var(--cm);border-color:var(--cr);color:var(--cr)}
.assess-dot.current{background:var(--cr);border-color:var(--cr);color:#fff}
.results-pg{padding:40px 44px;max-width:680px}
.results-circle{width:130px;height:130px;border-radius:50%;border:7px solid var(--go);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 28px}
.results-score{font-size:36px;font-weight:800;color:var(--cr);line-height:1}
.results-slbl{font-size:11px;color:var(--tx-m);font-weight:600}
.results-status{text-align:center;margin-bottom:28px}
.r-pass{font-size:20px;font-weight:700;color:#166534}
.r-fail{font-size:20px;font-weight:700;color:#991b1b}
.breakdown{background:var(--wh);border-radius:var(--rl);padding:22px;box-shadow:var(--sh);margin-bottom:22px}
.bd-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--cm-d)}
.bd-row:last-child{border-bottom:none}
.bd-mod{font-size:13px;font-weight:600;color:var(--tx)}
.bd-score{font-size:13px;font-weight:700}
.sg{color:#166534}.sb-c{color:#991b1b}
.cert-wrapper{padding:36px;background:#ede9df;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cert{width:760px;max-width:100%;background:var(--wh);border:7px solid var(--go);border-radius:var(--rl);padding:44px 52px;text-align:center;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.14)}
.cert::before{content:'';position:absolute;inset:11px;border:2px solid var(--cm-d);border-radius:var(--r);pointer-events:none}
.cert-logo{font-size:44px;font-family:'Playfair Display',serif;font-weight:700;color:var(--cr);margin-bottom:7px}
.cert-org{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--tx-l);font-weight:600;margin-bottom:24px}
.cert-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--cr);margin-bottom:18px;line-height:1.2}
.cert-certifies{font-size:13px;color:var(--tx-m);margin-bottom:7px;font-style:italic}
.cert-name{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--go-d);margin-bottom:18px;line-height:1.2}
.cert-completed{font-size:13px;color:var(--tx-m);margin-bottom:7px}
.cert-course{font-size:17px;font-weight:700;color:var(--tx);margin-bottom:7px;font-family:'Playfair Display',serif}
.cert-chapter{font-size:13px;color:var(--tx-m);margin-bottom:22px}
.cert-date{font-size:13px;color:var(--tx-l);margin-bottom:22px;font-style:italic}
.cert-div{width:110px;height:3px;background:var(--go);margin:0 auto 22px;border-radius:2px}
.cert-seal{font-size:36px;margin-bottom:14px}
.btn-print{display:inline-flex;align-items:center;gap:7px;background:var(--cr);color:var(--wh);border:none;padding:11px 22px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;margin-top:18px;transition:background var(--tr);font-family:inherit}
.btn-print:hover{background:var(--cr-d)}
.btn-primary{display:inline-flex;align-items:center;gap:7px;background:var(--cr);color:var(--wh);border:none;padding:11px 22px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;transition:all var(--tr);font-family:inherit}
.btn-primary:hover{background:var(--cr-d);transform:translateY(-1px)}
.btn-primary:focus{outline:3px solid var(--go);outline-offset:2px}
.btn-gold{background:var(--go);color:var(--cr-d)}
.btn-gold:hover{background:var(--go-l)!important}
.complete-badge{background:var(--go);color:var(--cr-d);text-align:center;padding:10px 18px;font-size:13px;font-weight:700;border-radius:var(--r);margin-bottom:14px}
.title-screen{min-height:55vh;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
.ts-mod-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--tx-l);margin-bottom:11px}
.ts-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--cr);line-height:1.25;margin-bottom:18px}
.ts-obj{font-size:15px;color:var(--tx-m);line-height:1.7;max-width:580px;background:var(--cm);padding:18px 22px;border-radius:var(--rl);border-left:4px solid var(--go)}
.mod-summary{background:linear-gradient(135deg,var(--cr-dd),var(--cr));color:var(--wh);border-radius:var(--rl);padding:28px 32px;margin-bottom:18px}
.mod-summary p{font-size:15px;line-height:1.8;color:rgba(255,255,255,.88);margin-bottom:11px}
.mod-summary p:last-child{margin-bottom:0}
.info-box{background:rgba(112,17,12,.06);border:1px solid rgba(112,17,12,.18);border-radius:var(--r);padding:14px 18px;font-size:13px;line-height:1.6;color:var(--tx);margin:14px 0}
.info-box strong{color:var(--cr)}
@media(max-width:768px){
  #sidebar{transform:translateX(-100%);transition:transform .3s ease}
  #sidebar.sb-open{transform:translateX(0)}
  #main{margin-left:0}
  .hero,.land-body{padding:28px 22px}
  .obj-grid,.two-col,.path-grid{grid-template-columns:1fr}
  .mod-content,.mod-header,.mod-nav,.assess-header,.assess-body{padding-left:22px;padding-right:22px}
  .hero-title{font-size:26px}
  .hamburger{display:flex}
}
@media(max-width:480px){.hero-stats{flex-direction:column;gap:10px}}
@media print{
  #sidebar,.btn-print,.mod-nav,.scr-dots,.hamburger{display:none!important}

<button class="hamburger" id="hamburger" aria-label="Open navigation" aria-expanded="false"></button>
<div class="sb-overlay" id="sb-overlay"></div>
<nav id="sidebar" aria-label="Course navigation"></nav>
<main id="main" role="main">
  <div id="main-content" tabindex="-1"></div>
</main>
<script>
// ========== STATE ==========
const NS = 'DLA_BYLAW_2026';
let S = {
  page:'landing', mi:0, si:0, name:'',
  done:[false,false,false,false,false,false,false],
  visited:{}, ix:{}, aa:{}, aScore:null, aSubmitted:false
};
function save(){try{localStorage.setItem(NS,JSON.stringify(S))}catch(e){}}
function load(){try{const d=localStorage.getItem(NS);if(d){const p=JSON.parse(d);Object.assign(S,p)}}catch(e){}}

// ========== MODULE META ==========
const MODS=[
  {title:'Constitutional Authority',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'Member Preparation',dur:'~30 min',screens:10,section:'SUBMISSION'},
  {title:'Portal Submission',dur:'~30 min',screens:10,section:'SUBMISSION'},
  {title:'Committee Review',dur:'~30 min',screens:10,section:'REVIEW'},
  {title:'Accept or Reject',dur:'~30 min',screens:10,section:'REVIEW'},
  {title:'Voting Process',dur:'~30 min',screens:10,section:'ADOPTION'},
  {title:'Adoption & Filing',dur:'~30 min',screens:10,section:'ADOPTION'}
];

function calcProgress(){
  const total=MODS.reduce((a,m)=>a+m.screens,0)+12;
  let done=0;
  for(let mi=0;mi<7;mi++) for(let si=0;si<MODS[mi].screens;si++) if(S.visited[`${mi}-${si}`]) done++;
  if(S.aSubmitted) done+=10;
  if(S.aScore!==null&&S.aScore>=8) done+=2;
  return Math.round((done/total)*100);
}
function getIx(){return S.ix[`${S.mi}-${S.si}`]||{};}
function setIx(data){S.ix[`${S.mi}-${S.si}`]=Object.assign(getIx(),data);save();}

// ========== SIDEBAR ==========
function renderSidebar(){
  const pct=calcProgress();
  let secShown={};
  let items='';
  for(let i=0;i<7;i++){
    const m=MODS[i];
    if(!secShown[m.section]){items+=`<div class="sec-label">${m.section}</div>`;secShown[m.section]=true;}
    const isActive=S.page==='module'&&S.mi===i;
    const isDone=S.done[i];
    items+=`<button class="mod-item${isActive?' active':''}${isDone?' completed':''}" onclick="goModule(${i})" aria-current="${isActive?'page':'false'}">
      <div class="mod-badge">${isDone?'':(i+1)}</div>
      <div><div class="mod-title">${m.title}</div><div class="mod-sub">Module ${i+1} · ${m.dur}</div></div>
    </button>`;
  }
  return `<div class="sb-header">
    <div class="sb-logo">
      <div class="logo-badge">KΑΨ</div>
      <div><div class="sb-title">Bylaw Amendment SOP</div><div class="sb-sub">Denton-Lewisville Alumni Chapter · 2026</div></div>
    </div>
  </div>
  <div class="sb-progress">
    <div class="prog-label"><span>Course Progress</span><span>${pct}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="sb-nav">${items}</div>
  <div class="sb-foot">
    ${S.aSubmitted?`<button class="sb-foot-item${S.page==='results'?' active':''}" onclick="goPage('results')">
      <div class="sb-foot-icon"></div><div class="sb-foot-label">Assessment Results</div>
    </button>`:''}
    ${S.aScore!==null&&S.aScore>=8?`<button class="sb-foot-item${S.page==='certificate'?' active':''}" onclick="goPage('certificate')">
      <div class="sb-foot-icon"></div><div class="sb-foot-label">My Certificate</div>
    </button>`:''}
  </div>`;
}

// ========== NAVIGATION ==========
function goPage(p){S.page=p;save();render();}
function goModule(mi){S.page='module';S.mi=mi;S.si=0;S.visited[`${mi}-0`]=true;save();render();}
function nextScreen(){
  if(S.si<MODS[S.mi].screens-1){
    S.si++;S.visited[`${S.mi}-${S.si}`]=true;save();render();window.scrollTo(0,0);
  } else {
    S.done[S.mi]=true;
    if(S.mi<6){
      const next=S.mi+1;
      if(window.confirm(`Module ${S.mi+1} complete! Start Module ${next+1}?`)){
        S.page='module';S.mi=next;S.si=0;S.visited[`${next}-0`]=true;
      } else {S.page='landing';}
    } else {
      if(window.confirm('All 7 modules complete! Proceed to the Final Assessment?')){S.page='assessment';S.si=0;}
      else {S.page='landing';}
    }
    save();render();window.scrollTo(0,0);
  }
}
function prevScreen(){if(S.si>0){S.si--;save();render();window.scrollTo(0,0);}}

function screenDots(count,current){
  let d='';
  for(let i=0;i<count;i++){
    const isDone=S.visited[`${S.mi}-${i}`]&&i<current;
    d+=`<div class="scr-dot${i===current?' active':isDone?' done':''}"></div>`;
  }
  return `<div class="scr-dots">${d}</div>`;
}
function modHeader(mi){
  const m=MODS[mi];
  return `<div class="mod-header">
    <div class="mod-num-badge"><div class="mod-num-sm">MOD</div><div class="mod-num-lg">${mi+1}</div></div>
    <div><div class="mod-hdr-lbl">Module ${mi+1} of 7</div><div class="mod-hdr-title">${m.title}</div></div>
  </div>`;
}
function navBar(si,total,nextLabel='Next →'){
  return `<div class="mod-nav">
    <button class="btn-nav btn-prev" onclick="prevScreen()" ${si===0?'disabled':''}>← Previous</button>
    <span class="scr-pos">Screen ${si+1} of ${total}</span>
    <button class="btn-nav btn-next" onclick="nextScreen()">${nextLabel}</button>
  </div>`;
}

// ========== QUIZ HELPER ==========
function renderQuiz(qid,question,opts,correctIdx,feedback){
  const ix=getIx();const sel=ix[qid];const submitted=sel!==undefined;
  let optHtml='';
  opts.forEach((o,i)=>{
    let cls='quiz-opt';
    if(submitted){if(i===correctIdx)cls+=' cor';else if(i===sel&&i!==correctIdx)cls+=' inc';}
    else if(i===sel)cls+=' sel';
    optHtml+=`<button class="${cls}" onclick="answerQuiz('${qid}',${i},${correctIdx})" ${submitted?'disabled':''}>
      <div class="opt-ltr">${String.fromCharCode(65+i)}</div><div class="opt-text">${o}</div>
    </button>`;
  });
  const fbShow=submitted?'show':'';
  const fbCls=submitted&&sel===correctIdx?'cor-fb':'inc-fb';
  return `<div class="quiz">
    <div class="quiz-q-num">Question</div>
    <div class="quiz-q">${question}</div>
    <div class="quiz-opts">${optHtml}</div>
    <div class="quiz-fb ${fbCls} ${fbShow}">${submitted?feedback:''}</div>
  </div>`;
}
function answerQuiz(qid,sel,correct){
  const ix=getIx();if(ix[qid]!==undefined)return;
  ix[qid]=sel;setIx(ix);render();
}

// ========== MODULE SCREENS ==========
// MODULE 1: Constitutional Authority
function m1s0(){return `<div class="title-screen">
  <div class="ts-mod-lbl">Module 1 of 7 · Foundations</div>
  <div class="ts-title">Constitutional Authority & the Non-Conflict Standard</div>
  <div class="ts-obj">Understand the constitutional foundation that authorizes the Denton-Lewisville Chapter to adopt and amend its own bylaws — and the legal constraints that every proposal must satisfy.</div>
</div>`;}

function m1s1(){return `<div>

  <div class="callout"><strong>KAP Constitution Art. XXX, Sec. 4:</strong> Alumni chapters shall have the power to adopt bylaws for their governance, provided that no such bylaws shall be in conflict with the Constitution, Statutes, Ritual, or other enactment of Kappa Alpha Psi.</div>

  </ul></div>
  <div class="card"><h3>Responsible Parties Under This SOP</h3>
  <table class="smart-tbl">
    <tr><th>Party</th><th>Primary Responsibility</th></tr>
    <tr><td><strong>Any Financial Member</strong></td><td>May initiate a proposal; responsible for research and complete submission</td></tr>
    <tr><td><strong>Keeper of Records (KOR)</strong></td><td>Receipt, logging, date-stamping, recordkeeping, and archiving</td></tr>
    <tr><td><strong>Bylaws Committee</strong></td><td>Constitutional review, classification, priority, and text update</td></tr>
    <tr><td><strong>Bylaws Committee Chairman</strong></td><td>Co-signs all adopted amendments; oversees compliance certification</td></tr>
    <tr><td><strong>Chapter Polemarch</strong></td><td>Co-signs all adopted amendments; confirms adoption authority</td></tr>
  </table></div>
</div>`;}

function m1s2(){
  const ix=getIx();const q1Done=ix.q1!==undefined;const q2Done=ix.q2!==undefined;
  return `<div>
  <div class="card"><h3>Knowledge Check — Constitutional Authority</h3><p>Answer both questions to reinforce your learning.</p></div>
  ${renderQuiz('q1','Which constitutional provision gives the Denton-Lewisville Chapter the authority to adopt its own bylaws?',
    ['KAP Statutes, Chapter 7, Section 2 — Alumni Chapter Operations',

  ${renderQuiz('q2','After a bylaw amendment is adopted by the chapter, the chapter must:',
    ['File the adopted amendment with IHQ within 30 days for official registration',
     'Submit a copy to the Province Polemarch for review and endorsement',

     'Post the amendment to the national KAP member portal within 10 business days'],2,
    'Correct — Art. XXX, Sec. 4 prescribes no filing obligation to IHQ or the Province. The chapter self-governs; the Bylaws Committee and KOR maintain compliance internally.')}

// MODULE 1 NEW SCREENS: Constitutional Authority (s3–s9)
function m1s3(){return `<div>
  <div class="card"><h3>Article XXX, Section 4 — Full Text Analysis</h3>
  <p>The full text of Art. XXX, Sec. 4 reads: <em>"Alumni chapters shall have the power to adopt bylaws for their governance, provided that no such bylaws shall be in conflict with the Constitution, Statutes, Ritual, or other enactment of Kappa Alpha Psi."</em></p>
  <p>Each clause carries specific legal weight that every member proposing an amendment must understand.</p></div>
  <table class="smart-tbl">
    <tr><th>Clause</th><th>What It Grants or Constrains</th><th>Practical Meaning</th></tr>
    <tr><td><strong>"Alumni chapters shall have the power…"</strong></td><td>Affirmative grant of authority</td><td>No outside approval from IHQ or Province is needed to adopt or amend bylaws</td></tr>
    <tr><td><strong>"…to adopt bylaws for their governance…"</strong></td><td>Scope limited to internal chapter governance</td><td>Chapter bylaws govern operations, procedures, duties — not external fraternity policy</td></tr>
    <tr><td><strong>"…provided that no such bylaws shall be in conflict…"</strong></td><td>Limiting condition — the non-conflict standard</td><td>This clause subordinates all chapter action to national governing documents</td></tr>
    <tr><td><strong>"…with the Constitution, Statutes, Ritual, or other enactment of Kappa Alpha Psi."</strong></td><td>Four categories of binding national authority</td><td>All four must be checked — not just the Constitution. "Other enactment" includes Grand Chapter resolutions</td></tr>
  </table>
  <div class="callout"><strong>Key Insight:</strong> The word "provided" is a legal condition precedent. The chapter's power to adopt bylaws exists <em>only if</em> the non-conflict standard is satisfied. A conflicting bylaw is not merely voidable — it is unauthorized from the moment of adoption.</div>
  <div class="card"><h3>The Four Categories of Binding National Authority</h3>
  <ul class="sl">
    <li><strong>Constitution:</strong> The foundational document of the fraternity — defines the organization, membership, officers, and fundamental powers</li>
    <li><strong>Statutes:</strong> Operational rules and procedures adopted by the Grand Chapter — includes chapter reporting, financial obligations, and membership standards</li>
    <li><strong>Ritual:</strong> The ceremonial and initiatory practices — chapter bylaws may not alter or contradict ritual requirements</li>
    <li><strong>Other Enactment of KAP:</strong> Grand Chapter resolutions, IHQ directives, and other official actions that carry binding force on all chapters</li>
  </ul></div>
</div>`;}

function m1s4(){return `<div>
  <div class="card"><h3>Constitutional vs. Statutory Authority — The Distinction That Matters</h3>
  <p>Many members treat the KAP Constitution and Statutes as a single document. They are not. Understanding the difference between constitutional and statutory authority affects how you research your proposal, how you cite alignment, and what level of national action could change the rule you are relying on.</p></div>
  <table class="smart-tbl">
    <tr><th>Feature</th><th>KAP Constitution</th><th>KAP Statutes</th></tr>
    <tr><td><strong>What it is</strong></td><td>Foundational charter of the fraternity — defines the organization itself</td><td>Operational rules governing how the fraternity functions</td></tr>
    <tr><td><strong>How it is changed</strong></td><td>Requires Grand Chapter action — typically a supermajority</td><td>May be amended by the Grand Chapter or authorized bodies with lower threshold</td></tr>
    <tr><td><strong>Stability</strong></td><td>Rarely changes — designed to be durable</td><td>More frequently updated — reflects current operational needs</td></tr>
    <tr><td><strong>Chapter bylaws must…</strong></td><td>Never contradict constitutional provisions — including Art. XXX, Sec. 4 itself</td><td>Never contradict statutory requirements — e.g., dues reporting, membership eligibility</td></tr>

  </table>
  <div class="callout"><strong>Why This Matters for Your Proposal:</strong> If your proposed amendment aligns with a statute that is currently in force, know that a future Statute change could create a conflict with your adopted bylaw. Constitutional provisions are more stable reference points for long-term bylaw language.</div>
  <div class="card"><h3>Ritual as a Binding Authority</h3>
  <p>The Ritual is often overlooked in bylaw research. However, it is explicitly listed in Art. XXX, Sec. 4 as a binding national authority. Chapter bylaws may not alter membership requirements, ceremonial obligations, or practices established in the Ritual. Any proposal touching on membership, initiation, or ceremonial duties must be cross-checked against Ritual requirements — not just the Constitution and Statutes.</p></div>
</div>`;}

function m1s5(){return `<div>
  <div class="card"><h3>How DL Chapter Bylaws Fit in the National Governance Framework</h3>
  <p>The Denton-Lewisville Alumni Chapter does not operate as an independent organization. It exists within a three-tier governance hierarchy. Understanding where chapter bylaws sit in this hierarchy explains why the non-conflict standard is absolute — not advisory.</p></div>
  <div class="phase-box"><div class="phase-hdr"><div class="phase-num">1</div>National Level — KAP Constitution, Statutes, Ritual & Enactments</div>
    <div class="phase-body">Supreme authority. All chapters, all members, all officers are subordinate. No chapter action — including bylaw adoption — may conflict with any national governing document. Changes require Grand Chapter action.</div></div>
  <div class="phase-box"><div class="phase-hdr"><div class="phase-num">2</div>Province Level — Province Bylaws & Directives</div>
    <div class="phase-body">Province authority applies within the Province structure. Province directives may impose additional obligations on chapters within that Province. However, for purposes of bylaw amendment review, the primary check under Art. XXX, Sec. 4 is against national documents — not Province directives.</div></div>
  <div class="phase-box"><div class="phase-hdr"><div class="phase-num">3</div>Chapter Level — DLA Bylaws (this document)</div>
    <div class="phase-body">The Denton-Lewisville Alumni Chapter bylaws govern internal chapter operations: officer duties, meeting procedures, dues structure, committee authority, and disciplinary procedures. These bylaws must remain subordinate to all national documents at all times.</div></div>
  <div class="card"><h3>Where Chapter Discretion Lives</h3>
  <p>The chapter has the broadest discretion in areas where national law is entirely silent. Examples include: the format of chapter meetings, the names and duties of standing committees beyond those required nationally, internal financial controls, and chapter communication procedures. In these areas, Art. XXX, Sec. 4 grants the chapter full authority to legislate as it sees fit — as long as the resulting language does not contradict anything in the national documents.</p></div>
  <div class="callout"><strong>Practical Rule:</strong> When researching a proposal, always move top-down — national first, then check what the current chapter bylaws say. Never assume chapter silence on a topic means the chapter is free to act. National law may mandate something the chapter has simply not yet codified.</div>
</div>`;}

  <p>Not every person associated with the chapter is bound equally by its bylaws. Understanding the scope of bylaw authority is essential — both for drafting proposals that are appropriately scoped and for understanding the limits of bylaw enforcement.</p></div>

function m1s9(){return `<div>
  <div class="card"><h3>Conflict Between National and Local Bylaws — Resolution</h3>
  <p>What happens when a chapter bylaw, once properly adopted, later comes into conflict with a new national governing document? This scenario is more common than members realize — Grand Chapter resolutions and Statute amendments can create post-adoption conflicts without any action by the chapter.</p></div>
  <div class="card"><h3>Types of Conflict</h3>
  <table class="smart-tbl">
    <tr><th>Conflict Type</th><th>Example</th><th>Resolution</th></tr>

    'Correct — the KAP Statute prevails automatically. The non-conflict standard in Art. XXX, Sec. 4 operates as a supremacy clause. The chapter should then amend its bylaws to conform to the new national requirement.')}
  ${renderQuiz('q2','Which of the following is NOT one of the four categories of binding national authority listed in Art. XXX, Sec. 4?',
    ['The KAP Constitution','The KAP Statutes','The KAP Ritual','Province Polemarch Directives'],3,

</div>`;}

function m2s8(){return `<div>

  <div class="card"><h3>Principles of Precise Drafting</h3>

function m4s3(){return `<div>
  <div class="card"><h3>The Keeper of Records — Role in the Review Process</h3>
  <p>The Keeper of Records (KOR) is not merely a filing clerk in the amendment process. The KOR performs a legally significant function: official receipt, date-stamping, and logging that establishes the formal record of submission. The KOR's receipt date is the controlling date for all subsequent timelines — including the 3-day logging window and the 10-business-day committee review window.</p></div>
  <div class="card"><h3>The KOR's Specific Responsibilities</h3>
  <ul class="sl">
    <li><strong>Receipt confirmation:</strong> The portal triggers an automated confirmation upon submission. The KOR also receives a system notification. The KOR must verify the automated confirmation matches the actual submission data within 1 business day</li>
    <li><strong>Date-stamping:</strong> The KOR records the official receipt date — which is the submission timestamp from the portal, not the date the KOR reviews it. These may differ if a submission arrives after business hours or on a weekend</li>
    <li><strong>Logging in the Amendment Tracking Register:</strong> A permanent entry is created: submitter name, tracking number, date received, article/section addressed, and priority designation</li>
    <li><strong>Forwarding to committee:</strong> The KOR transmits the complete submission package to the Bylaws Committee Chair within the 3-business-day window, along with the receipt number and date</li>
    <li><strong>Maintaining status updates:</strong> Throughout the review process, the KOR updates the Tracking Register with each status change — accepted, rejected, classified, scheduled for vote, adopted, or withdrawn</li>
  </ul></div>
  <div class="callout"><strong>Why the KOR's Logging Is Legally Significant:</strong> If a dispute arises about whether a proposal was properly received, timely reviewed, or correctly classified, the Amendment Tracking Register is the controlling record. KOR entries are presumptively correct. A member challenging a timeline outcome must demonstrate the KOR's record is in error — not merely that the member believes the timeline should have run differently.</div>
</div>`;}

function m4s4(){return `<div>

  <div class="card"><h3>How the 3-Day Window Is Calculated</h3>
  <table class="smart-tbl">
    <tr><th>Submission Day</th><th>Business Day 1</th><th>Business Day 2</th><th>Business Day 3 (Deadline)</th></tr>
    <tr><td>Monday</td><td>Tuesday</td><td>Wednesday</td><td>Thursday</td></tr>
    <tr><td>Friday</td><td>Monday</td><td>Tuesday</td><td>Wednesday</td></tr>
    <tr><td>Wednesday before Thanksgiving</td><td>Monday (after holiday)</td><td>Tuesday</td><td>Wednesday</td></tr>

  <p>Business days are Monday through Friday, excluding officially recognized chapter holidays. The chapter follows the federal holiday calendar unless the chapter's bylaws specify otherwise. Days when the KOR is on approved leave of absence count as non-business days for the purpose of this calculation — but the KOR must designate an acting KOR during any leave longer than 5 business days to ensure the timeline is maintained.</p></div>
  <div class="callout"><strong>What Happens if the KOR Misses the 3-Day Window:</strong> The submission remains valid and moves to committee review. The KOR's late logging is noted as a procedural deficiency. Repeated delays may be addressed by the Board of Directors as a performance matter. The submitter's rights and the committee's review clock are not affected by the KOR's delay.</div>

function m4s5(){return `<div>
  <div class="card"><h3>The Four-Point Conflict Check — Each Point in Detail</h3>
  <p>The committee's four-point check is not a general impression of the proposal — it is a structured, point-by-point review against specific legal standards. Each point must be checked independently; a proposal may pass three points and fail one.</p></div>
  <div class="phase-box"><div class="phase-hdr"><div class="phase-num">1</div>Direct Conflict with Constitutional or Statutory Provision</div>
    <div class="phase-body"><p>The committee searches the KAP Constitution, Statutes, Ritual, and any relevant Grand Chapter enactments for provisions that directly address the same subject as the proposal. If the proposed language contradicts — not merely differs from — a national provision, this point fails.</p><p><strong>Example of failure:</strong> A proposal setting dues at $0 for members over age 65 conflicts with a KAP Statute requiring all financial members to pay minimum chapter dues at the rate set by the national body.</p></div></div>
  <div class="phase-box"><div class="phase-hdr"><div class="phase-num">2</div>Misalignment with the Non-Conflict Standard (Art. XXX, Sec. 4)</div>
    <div class="phase-body"><p>Even if no specific national provision is directly contradicted, the proposal's overall effect must be consistent with the Art. XXX, Sec. 4 standard. This point captures proposals that technically avoid direct contradiction but create an outcome inconsistent with the fraternity's national governance framework.</p><p><strong>Example of failure:</strong> A proposal that effectively grants the chapter Polemarch veto authority over national directives would pass point 1 (no specific national provision addresses it) but fail point 2 (the overall effect conflicts with the chapter's subordinate position in the national framework).</p></div></div>
  <div class="phase-box"><div class="phase-hdr"><div class="phase-num">3</div>Duplication of Existing Bylaw Language</div>
    <div class="phase-body"><p>The committee checks whether the current DLA Bylaws already contain language that addresses the proposal's subject. Duplication creates two provisions that may be interpreted inconsistently — one of which is the controlling version is unclear.</p><p><strong>Example of failure:</strong> A proposal to add a provision requiring the Polemarch to preside at chapter meetings — when Article III, Section 2 already establishes this duty — is a duplicate.</p></div></div>
  <div class="phase-box"><div class="phase-hdr"><div class="phase-num">4</div>Internal Contradiction with Other DLA Bylaw Provisions</div>
    <div class="phase-body"><p>The proposal may not conflict with another currently effective DLA bylaw provision. The committee reviews provisions in adjacent articles and sections that may interact with the proposed language.</p><p><strong>Example of failure:</strong> A proposal establishing a 14-day meeting notice requirement in Article IV conflicts with an existing Article II provision requiring 21-day advance notice for all regular meetings.</p></div></div>
</div>`;}

function m4s6(){return `<div>
  <div class="card"><h3>Editorial vs. Substantive — What Each Means in Practice</h3>
  <p>The Editorial/Substantive classification is one of the most consequential determinations in the process. It determines the voting path, the advance notice requirement, and whether the membership or only the Board of Directors decides the outcome. The difference is not about the size of the change — it is about the nature of the change.</p></div>
  <div class="path-grid">
    <div class="path-card"><div class="path-head">EDITORIAL — Definition</div>
    <div class="path-body"><p>An amendment that corrects or clarifies the text of the bylaws without changing the substance, effect, rights, duties, procedures, or obligations established by the current provision.</p>
    <p><strong>Test:</strong> After the amendment, does any member have a different right, a different obligation, or face a different procedure? If no — Editorial. If yes — Substantive.</p>
    <p><strong>Board vote only.</strong> 2/3 affirmative vote. No advance notice or two-reading process.</p></div></div>
    <div class="path-card"><div class="path-head">SUBSTANTIVE — Definition</div>
    <div class="path-body"><p>An amendment that changes the substance, effect, rights, duties, procedures, qualifications, officer structure, financial obligations, or governance authority established by the bylaws.</p>
    <p><strong>Test:</strong> After the amendment, is any member, officer, or process affected differently than before? If yes — Substantive.</p>
    <p><strong>Full membership vote.</strong> 2/3 affirmative vote. 21-day advance notice. Two-reading process required.</p></div></div>
  </div>
  <div class="card"><h3>Why the Committee — Not the Submitter — Controls Classification</h3>
  <p>The portal form asks submitters to select the "Type of Change" (Field 6: Addition, Amendment, Deletion, Correction). This is informational — it is not the classification for voting purposes. The Bylaws Committee makes the Editorial/Substantive determination independently, and its determination is final. A submitter selecting "Correction" to avoid the two-reading process will find the committee reclassifying the proposal as Substantive if the actual change affects member rights or duties.</p></div>
</div>`;}

function m4s7(){return `<div>

function m6s3(){return `<div>
  <div class="card"><h3>The Editorial Board Path — In Detail</h3>

  <div class="card"><h3>Who Votes on the Editorial Path</h3>
  <p>The Board of Directors is the chapter's governing body between membership meetings. Membership on the Board is defined in the chapter bylaws — typically the elected chapter officers and committee chairs as specified. The exact composition of the Board for amendment voting purposes is governed by the current bylaws. Only Board members in good standing at the time of the vote may participate.</p></div>
  <div class="card"><h3>What Margin Is Needed</h3>
  <p>Adoption on the Editorial path requires a <strong>2/3 affirmative vote of Board members present and voting</strong>. This means:</p>

    <li>Abstentions are counted as present but not voting — they do not count as affirmative or negative votes, but they do count for the "present" total</li>
    <li>The 2/3 calculation is based on those actually voting (affirmative + negative), not the total present</li>
    <li>Example: 9 Board members present, 1 abstains — 8 are "voting." 2/3 of 8 = 5.33, rounded up to 6. At least 6 affirmative votes are required for adoption</li>
  </ul></div>
  <div class="card"><h3>When the Editorial Path Applies</h3>

    <tr><th>Scenario</th><th>Editorial Path Applies?</th></tr>

    <tr><td>Fixing a grammatical error that does not affect meaning or interpretation</td><td>Yes — purely textual correction</td></tr>

function m6s4(){return `<div>
  <div class="card"><h3>The Substantive Two-Reading Path — What Is "First Reading"?</h3>
  <p>The two-reading process is a structural protection that ensures members have adequate time to review, discuss, and deliberate before a consequential vote. The First Reading is not a vote — it is a formal introduction designed to put the proposal before the membership body in its official form.</p></div>
  <div class="card"><h3>What Happens at the First Reading</h3>
  <ul class="sl">

  <div class="card"><h3>Who Presents at the First Reading</h3>
  <p>The submitting member may present the proposal, the Bylaws Committee Chair may present, or a designated presenter may be appointed. Coordinate with the Polemarch before the meeting to ensure adequate agenda time is allocated.</p></div>

function m6s6(){return `<div>

function m6s7(){return `<div>
  <div class="card"><h3>The Secret Ballot Requirement — Rationale and Process</h3>
  <p>The secret ballot requirement in bylaw amendment votes is not a procedural formality — it reflects a fundamental principle about member autonomy in fraternal governance. Understanding the rationale helps members enforce the requirement correctly and resist any pressure to waive it.</p></div>
  <div class="card"><h3>Why Secret Ballot Exists in This Context</h3>
  <ul class="sl">
    <li><strong>Protecting dissent:</strong> Members who wish to vote against a proposal supported by chapter leadership may be reluctant to do so in a visible vote. Secret ballot removes this chilling effect on dissent</li>
    <li><strong>Protecting the integrity of the vote:</strong> Bylaw amendments bind all members — including those who voted against. A member who was pressured into voting in favor of a provision that later harms him has no recourse if he publicly voted "yes"</li>
    <li><strong>Ensuring genuine deliberation:</strong> When members know the vote is secret, public deliberation is more honest — members speak to the merits rather than to the room's apparent sentiment</li>
  </ul></div>
  <div class="card"><h3>Conducting the Secret Ballot</h3>
  <ul class="sl">
    <li>The Polemarch appoints tellers — at least two, who are not the submitter, not a committee member, and not a current officer with a declared position on the amendment</li>
    <li>Ballots are distributed to every financial member present and verified as a qualified voter</li>
    <li>Tellers collect, count, and verify ballots — they report the count to the Polemarch (not the individual ballot results)</li>
    <li>The Polemarch announces the result: total votes cast, affirmative, negative, and outcome (adopted/failed)</li>
    <li>The KOR records the total vote count and outcome in the minutes — individual ballot choices are never recorded</li>
  </ul></div>
  <div class="callout"><strong>One Request Is Sufficient:</strong> Any single financial member present may request a secret ballot at any time before the vote begins. No seconding, no motion, no vote on whether to use a secret ballot. One request — full stop — mandates the secret ballot process.</div>
</div>`;}

function m6s9(){return `<div>
  <div class="card"><h3>What Constitutes Passage vs. Failure — and Tie Votes</h3>
  <p>The passage threshold for bylaw amendments is one of the more frequently misunderstood procedural points. A 2/3 affirmative vote is required — but "2/3 of what" is the question that produces confusion.</p></div>
  <div class="card"><h3>The Correct Calculation</h3>
  <p><strong>2/3 of financial members present and voting.</strong> This means:</p>
  <table class="smart-tbl">

    <tr><td>Example B</td><td>25</td><td>21</td><td>4</td><td>⌈21 × 2/3⌉ = 14</td><td>14 Aff — PASSED</td></tr>
    <tr><td>Example C</td><td>18</td><td>18</td><td>0</td><td>⌈18 × 2/3⌉ = 12</td><td>14 Aff — PASSED</td></tr>
  </table></div>
  <div class="card"><h3>Tie Votes</h3>
  <p>A tie vote (equal affirmative and negative votes) is mathematically impossible to achieve the 2/3 threshold — a tie is a failure. The Polemarch does not cast a vote on bylaw amendments (even to break a tie) unless the bylaws expressly grant the Polemarch a vote in this circumstance. The Polemarch's role during the vote is to preside — not to vote, except as the bylaws specifically permit.</p></div>
  ${renderQuiz('q1','20 financial members are present. 3 abstain. The vote is 11 affirmative, 6 negative. What is the outcome?',

    'Correct — the denominator is 17 (those actually voting: 11 + 6). 2/3 of 17 = 11.33, which rounds up to 12. Only 11 affirmative votes were cast — the proposal fails. Abstentions are excluded from the voting count.')}

  <div class="card"><h3>Required Record Updates</h3>
  <table class="smart-tbl">
    <tr><th>Record</th><th>Update Required</th><th>Timeline</th></tr>
    <tr><td><strong>Amendment Tracking Register</strong></td><td>Status updated from "Adopted (Vote)" to "Filed — [Reference ID]" with the KOR stamp date</td><td>Same day as stamp application</td></tr>
    <tr><td><strong>Amendment Log</strong></td><td>Full entry completed: Reference ID, article/section, adoption date, vote tally, effective date, co-signers</td><td>Within 1 business day of stamp</td></tr>
    <tr><td><strong>Member Portal (bylaws document)</strong></td><td>KOR-certified version replaced with the updated document incorporating the new amendment</td><td>Within 5 business days of stamp</td></tr>
    <tr><td><strong>Chapter archive</strong></td><td>Prior bylaws version renamed to SUPERSEDED convention and moved to archive folder</td><td>Within 5 business days of stamp</td></tr>
    <tr><td><strong>Physical records</strong></td><td>Signed original document package stored in the KOR's official records storage</td><td>Within 5 business days of stamp</td></tr>
  </table></div>
  <div class="callout"><strong>The KOR as Sole Authority:</strong> After filing, the KOR's version is the only operative version. The Bylaws Committee's working copy, the submitter's copy, and any other version that predates the KOR stamp are superseded. If any party distributes a version of the bylaws that does not reflect the KOR's filed version, the KOR must issue a correction notice to the chapter within 2 business days of discovering the discrepancy.</div>
</div>`;}

function m7s7(){return `<div>
  <div class="card"><h3>Member Notification Requirements</h3>
  <p>Members must be informed of adopted amendments. Notification is not a courtesy — it is a procedural requirement. Members who take action in reliance on the old version of a provision, without having been notified of the amendment, have a procedural basis to challenge the application of the new provision to their actions.</p></div>
  <div class="card"><h3>Required Notification Components</h3>
  <ul class="sl">
    <li><strong>Formal chapter meeting announcement:</strong> At the next regular chapter meeting following the KOR file stamp, the Polemarch (or the KOR) must formally announce that the amendment has been adopted and filed. The announcement must include: the Reference ID, the article/section amended, the effective date, and how to access the updated bylaws</li>
    <li><strong>Portal posting:</strong> The KOR posts the updated bylaws to the member portal within 5 business days of the stamp. The portal posting must replace — not supplement — the prior version. Members accessing the portal should never encounter two simultaneous versions</li>
    <li><strong>Email notification (recommended):</strong> A brief chapter-wide email noting the amendment's Reference ID, effective date, and the article/section affected. This email is not required by the SOP but is strongly recommended to ensure all members who did not attend the meeting are informed promptly</li>
  </ul></div>
  <div class="card"><h3>Who Is Responsible for Notification</h3>
  <table class="smart-tbl">
    <tr><th>Notification Method</th><th>Responsible Party</th></tr>
    <tr><td>Chapter meeting announcement</td><td>Polemarch (with KOR providing the amendment details)</td></tr>
    <tr><td>Member portal update</td><td>Keeper of Records</td></tr>
    <tr><td>Email notification</td><td>Keeper of Records (in coordination with the Polemarch)</td></tr>
  </table></div>
</div>`;}

function m7s8(){return `<div>
  <div class="card"><h3>Effective Date Determination</h3>
  <p>When does an adopted bylaw amendment actually take effect? The answer depends on whether the amendment specifies a delayed effective date — and on the relationship between the adoption vote date and the KOR filing date.</p></div>
  <div class="card"><h3>The Default Rule: Adoption Upon Filing</h3>
  <p>Unless the adopted amendment expressly specifies a different effective date, the amendment takes effect upon the KOR's application of the file date stamp. This means:</p>
  <ul class="sl">
    <li>The vote adopts the amendment — but it is not yet officially in force</li>
    <li>The KOR's file stamp is the operative moment of legal effectiveness</li>
    <li>Actions taken between the vote and the KOR stamp are governed by the <em>old</em> version of the provision</li>
    <li>Actions taken on or after the KOR stamp date are governed by the <em>new</em> version</li>
  </ul></div>
  <div class="card"><h3>Delayed Effective Dates</h3>
  <p>A well-drafted amendment that changes a procedure, obligation, or timeline may specify a delayed effective date to allow members and officers time to adapt. Common examples:</p>
  <table class="smart-tbl">
    <tr><th>Amendment Type</th><th>Recommended Delayed Effective Date</th><th>Rationale</th></tr>
    <tr><td>Dues change</td><td>First day of next fiscal year</td><td>Gives members notice before the obligation attaches</td></tr>
    <tr><td>Election procedure change</td><td>Effective for elections occurring 60+ days after filing</td><td>Prevents retroactive application to an ongoing election cycle</td></tr>
    <tr><td>Quorum change</td><td>Effective at the next regular meeting</td><td>Gives the Polemarch time to notify members of the new quorum requirement before attendance decisions are made</td></tr>
    <tr><td>Officer duty change</td><td>Effective at the start of the next officer term</td><td>Does not change mid-term expectations for a sitting officer</td></tr>
  </table></div>
</div>`;}

function m7s9(){return `<div>
  <div class="card"><h3>Archive Requirements — Preserving the Complete Legislative History</h3>
  <p>Every superseded version of the chapter bylaws must be archived — not deleted. The archive preserves the chapter's complete legislative history, which serves as evidence in any dispute about when a provision took effect, what the prior rule was, and whether a current provision supersedes or supplements prior language.</p></div>
  <div class="card"><h3>Archiving Superseded Versions</h3>
  <ul class="sl">
    <li><strong>Rename the superseded document:</strong> Apply the convention: <em>DLA_Bylaws_v[YYYY-MM]_SUPERSEDED.pdf</em> — e.g., <em>DLA_Bylaws_v2025-09_SUPERSEDED.pdf</em>. The date in the filename is the date of the version being superseded (typically the prior KOR stamp date)</li>
    <li><strong>Move to the archive folder:</strong> The KOR maintains an archive folder separate from the active bylaws location. Do not overwrite or delete — rename and move</li>
    <li><strong>Retain indefinitely:</strong> Superseded versions are retained permanently. There is no purge schedule for prior bylaw versions</li>
    <li><strong>Access control:</strong> The archive is accessible to the KOR, the Bylaws Committee Chair, and the Polemarch. Other members may request access through the KOR</li>
  </ul></div>
  ${renderQuiz('q1','An amendment was adopted at the chapter meeting on March 10. The dual-signed document package arrived at the KOR on March 15. The KOR applied the file stamp on March 17. When did the amendment take effect (assuming no delayed effective date was specified)?',
    ['March 10 — the adoption vote at the chapter meeting',
     'March 15 — when the document package arrived at the KOR',
     'March 17 — the KOR\'s file stamp date is the operative effective date',
     'March 21 — 5 business days after the KOR stamp, when the portal must be updated'],2,
    'Correct — the default rule is that the amendment takes effect upon the KOR\'s application of the file stamp. The adoption vote (March 10) and the document\'s arrival at the KOR (March 15) are prerequisite steps, but the legal effectiveness date is the stamp date: March 17.')}
  ${renderQuiz('q2','The chapter adopts its second bylaw amendment of 2026, then supersedes it with a third amendment later in the year. What happens to the second amendment\'s file?',
    ['It is deleted — only the current controlling version should exist',
     'It is renamed to the SUPERSEDED convention and moved to the archive; it is retained permanently',
     'It is archived for 3 years then deleted per the chapter records retention schedule',
     'It remains in the active folder alongside the third amendment to show the amendment history'],1,
    'Correct — superseded versions are renamed (DLA_Bylaws_v[date]_SUPERSEDED.pdf) and moved to the archive folder. They are retained permanently — there is no purge schedule for prior bylaw versions. The archive preserves the complete legislative history of the chapter bylaws.')}
  <div class="complete-badge"> Module 7 complete — all 7 modules finished! Proceed to the Final Assessment.</div>
</div>`;}

// ========== ASSESSMENT QUESTIONS ==========
const AQ=[
  {mod:'Module 1',q:'Which constitutional provision gives the Denton-Lewisville Chapter the authority to adopt its own bylaws?',
   opts:['KAP Statutes, Chapter 7, Section 2 — Alumni Chapter Operations','KAP Constitution Art. XXX, Sec. 4 — Alumni chapter bylaw power','Grand Chapter Resolution 2025-G14 on Chapter Self-Governance','KAP Province Polemarch Directive on Local Chapter Governance'],
   cor:1,fb:'Art. XXX, Sec. 4 is the sole constitutional provision that grants alumni chapters the power to adopt bylaws, subject to the non-conflict standard.'},
  {mod:'Module 1',q:'The non-conflict standard in Art. XXX, Sec. 4 means that a chapter bylaw amendment:',
   opts:['Must be approved by the Province Polemarch before taking effect','May not conflict with the KAP Constitution, Statutes, Ritual, or other enactment of Kappa Alpha Psi','Must mirror the language used in the national bylaws wherever applicable','Requires a 3/4 supermajority vote to override any national provision'],
   cor:1,fb:'The non-conflict standard requires that no chapter bylaw conflict with the KAP Constitution, Statutes, Ritual, or other enactment of KAP. Province approval is not part of this standard.'},
  {mod:'Module 2',q:'A member wants to propose a bylaw amendment. What is the correct first step?',
   opts:['Locate and read the current DLA Bylaws on the member portal','Go directly to the portal submission form and complete all 8 fields','Consult with the Polemarch to determine priority','Review the KAP Constitution first, then check the DLA Bylaws after'],
   cor:0,fb:'The first step in Phase 1 is always to locate and read the current DLA Bylaws. Members must understand the current language or identify the gap before doing anything else.'},
  {mod:'Module 2',q:'When national law is completely silent on the topic of a proposed amendment, the alignment framework determination is:',
   opts:['Conflicts With — because there is no constitutional basis','Aligns With — because national law does not prohibit it','Within Chapter Discretion — cite "Art. XXX, Sec. 4 — chapter discretion"','The proposal cannot advance without Province advisory review'],
   cor:2,fb:'When national law is silent, the chapter has discretion under Art. XXX, Sec. 4 to adopt language. The correct citation is "Art. XXX, Sec. 4 — chapter discretion." Silence grants chapter authority.'},
  {mod:'Module 3',q:'How many fields are required on the portal submission form, and what happens if one is left incomplete?',
   opts:['6 required fields; incomplete submissions advance with a flag','10 required fields; submissions are held pending missing information','8 required fields; incomplete submissions are returned without committee review','8 required fields; incompleteness creates a rejection presumption but review continues'],
   cor:2,fb:'There are exactly 8 required fields. Any incomplete submission is returned to the member without committee review — incompleteness is itself a rejection condition.'},
  {mod:'Module 4',q:'The KOR receives a portal submission on a Monday. By when must it be logged in the Amendment Tracking Register?',
   opts:['By end of day Monday','Within 3 business days — by Thursday','Within 10 business days','Before the next regular chapter meeting'],
   cor:1,fb:'The KOR must log the submission within 3 business days of receipt. A Monday submission must be logged by Thursday.'},
  {mod:'Module 4',q:'A proposal changes the officer title "Secretary" to "Keeper of Records" throughout the bylaws. The correct classification is:',
   opts:['Substantive — officer structure changes require the two-reading process','Editorial — a cross-reference correction with no change to duties, rights, or substance','Critical Priority — officer title misalignment requires immediate resolution','Cannot be classified without Province review'],
   cor:1,fb:'Changing "Secretary" to "Keeper of Records" is a cross-reference correction with no change to duties, rights, or substance. This is Editorial — it goes to the Board of Directors only.'},
  {mod:'Module 5',q:'A proposal is constitutionally sound, but the member left Field 8 (Expected Impact) blank. The committee should:',
   opts:['Accept it — 7 of 8 fields are complete and the constitutional work is solid','Reject it — any missing required field is a rejection condition regardless of other merit','Accept it conditionally pending the missing field within 5 business days','Complete Field 8 on the member\'s behalf based on the committee\'s analysis'],
   cor:1,fb:'All 8 fields are required without exception. There are no conditional acceptances. An incomplete submission is returned to the member regardless of the quality of other fields.'},
  {mod:'Module 6',q:'During deliberation on a substantive amendment, a brother requests a secret ballot. The chapter must:',
   opts:['Take a procedural vote on whether to honor the request','Defer the vote to the next meeting to prepare ballots','Conduct the vote by secret ballot — one member\'s request triggers the requirement','Honor the request only if seconded by at least two other members'],
   cor:2,fb:'A secret ballot is required if any single member requests it. There is no threshold, no seconding requirement, and no deferral. One request mandates a secret ballot.'},
  {mod:'Module 7',q:'The chapter adopts its third bylaw amendment in 2026. Using the naming convention, what reference ID should be assigned?',
   opts:['KAP-DLA-2026-003','DLA-2026-A03','Amendment-2026-C','DLA-A03-2026'],
   cor:1,fb:'The naming convention is DLA-[YEAR]-A[##]. The third amendment in 2026 is DLA-2026-A03.'}
];

function render(){
  document.getElementById('sidebar').innerHTML=renderSidebar();
  const mc=document.getElementById('main-content');

  if(S.page==='landing'){
    const allDone=S.done.every(Boolean);
    mc.innerHTML=`

      <div class="hero-title">Bylaw Amendment Standard Operating Procedure</div>
      <div class="hero-sub">Kappa Alpha Psi — Denton-Lewisville (TX) Alumni Chapter · 2026 Edition · Prepared by the DLA Bylaws Committee</div>
      <div class="hero-name-row">
        <label for="name-input">Your Name:</label>
        <input class="name-input" id="name-input" type="text" placeholder="Enter your full name" value="${S.name}" oninput="S.name=this.value;save()">
      </div>

        <div class="stat-item"><span class="stat-label"> 7 Modules · 70 Screens</span></div>

      </div>

        ${allDone?'Review Course':'Begin Course'} →
      </button>
    </div>
    <div class="land-body">
      <div class="sec-title">What You Will Learn</div>
      <div class="sec-intro">This course covers the complete lifecycle of a bylaw amendment proposal — from constitutional authority through portal submission, committee review, voting, and official adoption.</div>
      <div class="obj-grid">

        <div class="obj-card"><div class="obj-num">2</div><div class="obj-text">Complete the three-step pre-submission research process and apply the alignment framework</div></div>
        <div class="obj-card"><div class="obj-num">3</div><div class="obj-text">Identify all 8 required portal submission fields and complete a compliant proposal</div></div>
        <div class="obj-card"><div class="obj-num">4</div><div class="obj-text">Describe the KOR receipt and logging process, and distinguish Editorial from Substantive classifications</div></div>
        <div class="obj-card"><div class="obj-num">5</div><div class="obj-text">Identify rejection and acceptance conditions and required correspondence contents</div></div>
        <div class="obj-card"><div class="obj-num">6</div><div class="obj-text">Apply the correct voting path for each classification and explain the two-reading process</div></div>

      </div>
      ${S.aSubmitted?`<button class="btn-primary" style="margin-right:11px" onclick="goPage('results')">View Assessment Results</button>`:''}
      ${S.aScore!==null&&S.aScore>=8?`<button class="btn-primary btn-gold" onclick="goPage('certificate')">View My Certificate</button>`:''}
    </div>`;
    return;
  }

  if(S.page==='module'){
    const screens=[
      [m1s0,m1s1,m1s2,m1s3,m1s4,m1s5,m1s6,m1s7,m1s8,m1s9],
      [m2s0,m2s1,m2s2,m2s3,m2s4,m2s5,m2s6,m2s7,m2s8,m2s9],
      [m3s0,m3s1,m3s2,m3s3,m3s4,m3s5,m3s6,m3s7,m3s8,m3s9],
      [m4s0,m4s1,m4s2,m4s3,m4s4,m4s5,m4s6,m4s7,m4s8,m4s9],
      [m5s0,m5s1,m5s2,m5s3,m5s4,m5s5,m5s6,m5s7,m5s8,m5s9],
      [m6s0,m6s1,m6s2,m6s3,m6s4,m6s5,m6s6,m6s7,m6s8,m6s9],

    ];
    const fn=screens[S.mi][S.si];

      <div class="breakdown">
        ${AQ.map((q,i)=>{
          const correct=S.aa[i]===q.cor;
          return `<div class="bd-row">
            <div class="bd-mod">${q.mod} — Q${i+1}</div>

  if(S.page==='certificate'){

      <div class="cert">

        <div class="cert-course">Bylaw Amendment Standard Operating Procedure</div>
        <div class="cert-chapter">DLA Bylaws Committee Training · 2026 Edition</div>
        <div class="cert-div"></div>
        <div class="cert-seal"></div>
        <div class="cert-date">Completed: ${dateStr} · Score: ${Math.round((S.aScore/AQ.length)*100)}%</div>
        <button class="btn-print" onclick="window.print()"> Print Certificate</button>
      </div>
    </div>`;
    return;
  }
}

function selectAssess(i){
  if(S.aa[S.si]!==undefined)return;
  S.aa[S.si]=i;save();render();
}

document.addEventListener('DOMContentLoaded',()=>{
  const ham=document.getElementById('hamburger');
  const ov=document.getElementById('sb-overlay');
  const sb=document.getElementById('sidebar');
  ham.addEventListener('click',()=>{
    const open=sb.classList.toggle('sb-open');

  ov.addEventListener('click',()=>{
    sb.classList.remove('sb-open');
    ov.classList.remove('show');
    ham.setAttribute('aria-expanded',false);
  });
  load();render();
});
