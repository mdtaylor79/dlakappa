<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Portal Training — DL Alumni Chapter</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiM3MDExMGMiLz48dGV4dCB4PSI1MCUiIHk9IjU0JSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9InNlcmlmIiBmb250LXNpemU9IjMwIiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0iI2MyOWEzYyI+S8OBzqk8L3RleHQ+PC9zdmc+">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cr:#70110c;--cr-d:#3a0807;--cm:#f2ebd7;--go:#c9a84c;--sw:260px;--rad:10px;--sh:0 2px 12px rgba(0,0,0,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f3ee;color:#1a1a1a;display:flex;min-height:100vh;overflow-x:hidden}

/* SIDEBAR */
#sidebar{width:var(--sw);background:var(--cr);color:var(--cm);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto;z-index:100;transition:transform .3s}
.sb-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo-badge{width:42px;height:42px;background:var(--go);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--cr-d);flex-shrink:0;font-family:'Playfair Display',serif}
.sb-title{font-size:12px;font-weight:700;color:var(--cm);line-height:1.3;letter-spacing:.02em}
.sb-sub{font-size:10px;color:rgba(242,235,215,.55);margin-top:2px}
.sb-progress{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.prog-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(242,235,215,.55);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.prog-track{height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--go);border-radius:3px;transition:width .4s ease}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.sec-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,235,215,.38);padding:10px 16px 3px}
.mod-item{display:flex;align-items:flex-start;gap:9px;padding:9px 14px;cursor:pointer;transition:background .2s;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.mod-item:hover{background:rgba(255,255,255,.07)}
.mod-item.active{background:rgba(255,255,255,.11);border-left-color:var(--go)}
.mod-item.completed .mod-badge{background:var(--go);color:var(--cr-d)}
.mod-badge{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--cm);flex-shrink:0;margin-top:1px}
.mod-title{font-size:12px;font-weight:600;color:var(--cm);line-height:1.3}
.mod-sub{font-size:10px;color:rgba(242,235,215,.48);margin-top:1px}
.sb-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sb-footer-item{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;font-size:.78rem;color:rgba(242,235,215,.7);transition:color .2s}
.sb-footer-item:hover{color:#fff}
.sb-footer-item.active{color:var(--go);font-weight:600}
.sb-icon{font-size:.9rem;width:20px;text-align:center}

/* MAIN */
#main{margin-left:var(--sw);flex:1;min-height:100vh;display:flex;flex-direction:column}

/* HAMBURGER */
#hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--cr);border:none;border-radius:8px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:8px}
#hamburger span{display:block;width:22px;height:2px;background:var(--cm);border-radius:2px;transition:.3s}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}

/* LANDING */
.hero{background:var(--cr);color:var(--cm);padding:60px 48px;position:relative;overflow:hidden}
.hero::before{content:'KΑΨ';position:absolute;right:-20px;top:-20px;font-family:'Playfair Display',serif;font-size:180px;color:rgba(255,255,255,.04);font-weight:700;pointer-events:none;line-height:1}
.hero-eyebrow{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--go);margin-bottom:12px;font-weight:600}
.hero h1{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;line-height:1.15;color:#fff;margin-bottom:14px}
.hero-sub{font-size:.95rem;color:rgba(242,235,215,.8);max-width:560px;line-height:1.6}
.stats-row{display:flex;gap:24px;margin-top:32px;flex-wrap:wrap}
.stat-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:var(--rad);padding:16px 22px;min-width:110px;text-align:center}
.stat-box strong{display:block;font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--go)}
.stat-box span{font-size:.7rem;color:rgba(242,235,215,.7);text-transform:uppercase;letter-spacing:.05em}
.landing-body{padding:40px 48px;max-width:680px}
.landing-body h2{font-family:'Playfair Display',serif;font-size:1.4rem;margin-bottom:16px;color:var(--cr)}
.landing-body p{color:#444;line-height:1.7;margin-bottom:16px;font-size:.92rem}
.name-field{margin:28px 0}
.name-field label{display:block;font-size:.78rem;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.name-field input{width:100%;max-width:380px;padding:12px 16px;border:2px solid #ddd;border-radius:8px;font-family:'Inter',sans-serif;font-size:.95rem;outline:none;transition:border .2s}
.name-field input:focus{border-color:var(--cr)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:8px;font-family:'Inter',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:.2s;text-decoration:none}
.btn-primary{background:var(--cr);color:#fff}
.btn-primary:hover{background:#5a0d09}
.btn-gold{background:var(--go);color:#1a1a1a}
.btn-gold:hover{background:#b8922e}
.btn-outline{background:transparent;color:var(--cr);border:2px solid var(--cr)}
.btn-outline:hover{background:var(--cr);color:#fff}
.btn-sm{padding:8px 18px;font-size:.8rem}

/* MODULE PAGE */
.mod-page{padding:0;display:flex;flex-direction:column;min-height:100vh}
.mod-header{background:var(--cr);color:var(--cm);padding:28px 40px}
.mod-header .mh-eyebrow{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--go);margin-bottom:6px;font-weight:600}
.mod-header h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:#fff;font-weight:700}
.mod-header .mh-sub{font-size:.82rem;color:rgba(242,235,215,.7);margin-top:6px}
.scr-dots{display:flex;gap:8px;padding:16px 40px;background:#fff;border-bottom:1px solid #eee;align-items:center}
.scr-dot{width:10px;height:10px;border-radius:50%;background:#ddd;cursor:pointer;transition:.2s}
.scr-dot.visited{background:rgba(112,17,12,.3)}
.scr-dot.active{background:var(--cr);transform:scale(1.3)}
.scr-dot.done{background:var(--go)}
.scr-content{flex:1;padding:36px 40px;max-width:760px}
.mod-nav{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-top:1px solid #eee;margin-top:auto}
.btn-nav{background:none;border:2px solid var(--cr);color:var(--cr);border-radius:8px;padding:10px 22px;font-family:'Inter',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-nav:hover{background:var(--cr);color:#fff}
.btn-nav:disabled{opacity:.35;cursor:default;pointer-events:none}
.btn-nav.btn-next{background:var(--cr);color:#fff}
.btn-nav.btn-next:hover{background:#5a0d09}
.nav-progress{font-size:.78rem;color:#888;font-weight:500}

/* CONTENT COMPONENTS */
.card{background:#fff;border-radius:var(--rad);padding:24px 28px;box-shadow:var(--sh);margin-bottom:20px}
.card h3{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--cr);margin-bottom:12px}
.card p{font-size:.88rem;color:#444;line-height:1.7}
.quote-block{border-left:4px solid var(--go);background:rgba(201,168,76,.08);padding:16px 20px;border-radius:0 8px 8px 0;margin:20px 0;font-style:italic;color:#555;font-size:.9rem;line-height:1.7}
.info-box{background:rgba(112,17,12,.06);border:1px solid rgba(112,17,12,.15);border-radius:8px;padding:16px 20px;margin:16px 0;font-size:.87rem;color:#333;line-height:1.65}
.info-box strong{color:var(--cr)}
.tip-box{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:8px;padding:14px 18px;margin:14px 0;font-size:.84rem;color:#5a4a10;line-height:1.6}
.tip-box::before{content:' ';font-style:normal}
.sl{list-style:none;padding:0;margin:14px 0}
.sl li{padding:8px 0 8px 26px;position:relative;font-size:.88rem;color:#444;border-bottom:1px solid #f0f0f0;line-height:1.6}
.sl li:last-child{border-bottom:none}
.sl li::before{content:'';position:absolute;left:6px;color:var(--go);font-weight:700}
.exp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:20px 0}
.exp-card{background:#fff;border-radius:var(--rad);padding:20px;box-shadow:var(--sh);border-top:4px solid var(--cr)}
.exp-card h4{font-size:.85rem;font-weight:700;color:var(--cr);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.exp-card p{font-size:.8rem;color:#555;line-height:1.55}
.table-wrap{overflow-x:auto;margin:20px 0}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--cr);color:#fff;padding:10px 14px;text-align:left;font-weight:600;font-size:.78rem;letter-spacing:.04em}
td{padding:9px 14px;border-bottom:1px solid #eee;color:#444;line-height:1.5}
tr:nth-child(even) td{background:#fafafa}
tr:hover td{background:#f5f3ee}
.scenario-block{background:#fff;border-radius:var(--rad);padding:20px 24px;box-shadow:var(--sh);margin-bottom:16px;border-left:4px solid var(--cr)}
.scenario-block .sc-num{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--go);font-weight:700;margin-bottom:6px}
.scenario-block .sc-q{font-size:.88rem;color:#333;font-weight:600;line-height:1.5;margin-bottom:10px}
.scenario-block .sc-a{font-size:.82rem;color:#555;background:#f5f3ee;padding:10px 14px;border-radius:6px;line-height:1.55}
.scenario-block .sc-a strong{color:var(--cr)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.badge-req{background:rgba(112,17,12,.12);color:var(--cr)}
.badge-found{background:rgba(201,168,76,.2);color:#7a5a10}
.badge-new{background:rgba(25,130,80,.12);color:#155a35}
.badge-soon{background:#eee;color:#888}
.badge-draft{background:rgba(100,100,100,.1);color:#666}
.course-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:20px 0}
.course-card{background:#fff;border-radius:var(--rad);padding:18px;box-shadow:var(--sh);border-top:3px solid var(--go)}
.course-card h4{font-size:.88rem;font-weight:700;color:#222;margin:8px 0 6px;line-height:1.3}
.course-card .cc-meta{font-size:.74rem;color:#888;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.section-title{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--cr);margin:24px 0 12px;font-weight:700}
.intro-text{font-size:.92rem;color:#444;line-height:1.7;margin-bottom:20px}

/* ASSESSMENT */
.assess-page{padding:40px}
.assess-page h2{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--cr);margin-bottom:8px}
.assess-page .sub{font-size:.88rem;color:#666;margin-bottom:32px}
.quiz{background:#fff;border-radius:var(--rad);box-shadow:var(--sh);padding:28px;margin-bottom:20px}
.quiz .q-num{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--go);font-weight:700;margin-bottom:8px}
.quiz .q-text{font-size:.95rem;font-weight:600;color:#222;line-height:1.5;margin-bottom:18px}
.quiz .opts{display:flex;flex-direction:column;gap:10px}
.quiz .opt{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:2px solid #eee;border-radius:8px;cursor:pointer;transition:.2s;font-size:.87rem;color:#444;line-height:1.45}
.quiz .opt:hover{border-color:var(--cr);background:rgba(112,17,12,.04)}
.quiz .opt.selected{border-color:var(--cr);background:rgba(112,17,12,.06)}
.quiz .opt.correct{border-color:#1a7a40;background:rgba(26,122,64,.08);color:#1a7a40}
.quiz .opt.wrong{border-color:#c0392b;background:rgba(192,57,43,.06);color:#c0392b}
.quiz .opt input{accent-color:var(--cr);margin-top:2px;flex-shrink:0}
.quiz .fb{margin-top:14px;padding:12px 16px;background:#f5f3ee;border-radius:8px;font-size:.83rem;color:#555;line-height:1.6;border-left:3px solid var(--go)}
.assess-controls{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap}

/* RESULTS */
.results-page{padding:40px;max-width:720px}
.score-circle{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 28px;border:6px solid}
.score-circle.pass{border-color:#1a7a40;background:rgba(26,122,64,.08)}
.score-circle.fail{border-color:var(--cr);background:rgba(112,17,12,.08)}
.score-circle .sc-num{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:700}
.score-circle.pass .sc-num{color:#1a7a40}
.score-circle.fail .sc-num{color:var(--cr)}
.score-circle .sc-label{font-size:.7rem;color:#888;text-transform:uppercase;letter-spacing:.06em}
.results-msg{text-align:center;margin-bottom:32px}
.results-msg h2{font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:8px}
.breakdown{background:#fff;border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden;margin-bottom:24px}
.breakdown table{width:100%}

/* CERTIFICATE */
.cert-page{padding:40px;display:flex;flex-direction:column;align-items:center}
.cert-name-field{margin-bottom:28px;width:100%;max-width:480px}
@media print{
  #sidebar,#hamburger,#overlay,.cert-controls{display:none!important}
  #main{margin-left:0}
  .cert-wrap{box-shadow:none!important;page-break-inside:avoid}
}
.cert-wrap{background:#fff;border:3px solid var(--go);border-radius:16px;padding:48px 52px;max-width:680px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.15);position:relative;overflow:hidden}
.cert-wrap::before{content:'KΑΨ';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Playfair Display',serif;font-size:220px;color:rgba(112,17,12,.03);font-weight:700;pointer-events:none;line-height:1}
.cert-logo{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--cr);font-weight:700;margin-bottom:6px}
.cert-org{font-size:.75rem;color:#888;text-transform:uppercase;letter-spacing:.1em;margin-bottom:28px}
.cert-header{font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;color:#999;margin-bottom:10px}
.cert-title{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--cr);font-weight:700;line-height:1.2;margin-bottom:6px}
.cert-course{font-size:1rem;color:#555;margin-bottom:28px}
.cert-name{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--cr);border-bottom:2px solid var(--go);display:inline-block;padding-bottom:4px;min-width:240px;margin-bottom:6px}
.cert-name-label{font-size:.72rem;color:#999;text-transform:uppercase;letter-spacing:.08em;margin-bottom:28px}
.cert-score{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);border-radius:8px;padding:12px 20px;display:inline-block;font-size:.82rem;color:#7a5a10;margin-bottom:28px}
.cert-date{font-size:.82rem;color:#888;margin-bottom:12px}
.cert-seal{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:24px;padding-top:20px;border-top:1px solid #eee}
.cert-seal-item{text-align:center;font-size:.68rem;color:#999;text-transform:uppercase;letter-spacing:.08em}
.cert-seal-item .seal-line{width:80px;height:1px;background:#ccc;margin:8px auto 4px}
.cert-controls{display:flex;gap:14px;margin-top:24px;justify-content:center;flex-wrap:wrap}

/* RESPONSIVE */
@media(max-width:700px){
  #hamburger{display:flex}
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #overlay.open{display:block}
  #main{margin-left:0}
  .hero{padding:40px 20px}
  .hero h1{font-size:1.6rem}
  .landing-body{padding:28px 20px}
  .mod-header{padding:20px 20px}
  .scr-dots{padding:12px 20px}
  .scr-content{padding:24px 20px}
  .mod-nav{padding:16px 20px}
  .assess-page,.results-page,.cert-page{padding:24px 20px}
  .stats-row{gap:14px}
}
</style>
</head>
<body>

<button id="hamburger" onclick="toggleSidebar()" aria-label="Menu">
  <span></span><span></span><span></span>
</button>
<div id="overlay" onclick="toggleSidebar()"></div>

<nav id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">
      <div class="logo-badge">K&#913;&#936;</div>
      <div>
        <div class="sb-title">Member Portal</div>
        <div class="sb-sub">Denton-Lewisville Alumni Chapter · 2026</div>
      </div>
    </div>
  </div>
  <div class="sb-progress">
    <div class="prog-label"><span>COURSE PROGRESS</span><span id="pct">0%</span></div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div class="sb-nav" id="sbNav"></div>
  <div class="sb-footer" id="sb-footer"></div>
</nav>

<main id="main"></main>

<script>
const NS = 'DLA_PORTAL_2026';
let S = { page:'landing', mi:0, si:0, name:'', done:[false,false,false,false,false], visited:{}, ix:{}, aa:{}, aScore:null, aSubmitted:false };

const MODS = [
  {title:'The DLA Digital Environment',      dur:'~30 min', screens:10, section:'FOUNDATIONS'},
  {title:'Navigating the Main DLA Website',  dur:'~30 min', screens:10, section:'ENVIRONMENTS'},
  {title:'Navigating the Member Portal',     dur:'~30 min', screens:10, section:'MEMBER RESOURCES'},
  {title:'Using the DLA Training System',    dur:'~30 min', screens:10, section:'TRAINING SYSTEM'},
  {title:'Digital Resource Challenge',       dur:'~30 min', screens:10, section:'ASSESSMENT PREP'}
];

const AQ = [
  {mod:'Module 2', q:'A prospective member wants information about joining the chapter. Where should they be directed?', opts:['A. Member Portal → My Account','B. Main DLA Website → Membership page','C. Member Portal → Pay Dues','D. Curriculead training system'], cor:1, fb:'The main DLA website\'s Membership page (dlakappas.com/membership.html) is for prospective members. The portal is for existing members only.'},
  {mod:'Module 2', q:'A community partner asks where to find information about chapter programs. Where do you send them?', opts:['A. Public Website → Programs section','B. Member Portal → Documents','C. Curriculead training system','D. Member Portal → Training hub'], cor:0, fb:'Community partners should be directed to the public website (dlakappas.com) — specifically the Programs section.'},
  {mod:'Module 3', q:'A brother needs to download the chapter bylaws. Where does he find them?', opts:['A. Public Website → About','B. Member Portal → Forms & Assessments','C. Member Portal → Documents → Chapter By Laws','D. Curriculead training system'], cor:2, fb:'Chapter Bylaws are stored in the Member Portal under Documents → Chapter By Laws folder.'},
  {mod:'Module 3', q:'A brother is planning a chapter event. What form must he submit BEFORE the event?', opts:['A. Post Event Summary','B. Event Information Form','C. Member Reimbursement','D. Committee Budget Request'], cor:1, fb:'The Event Information Form must be submitted before any chapter event for approval and planning.'},
  {mod:'Module 3', q:'Within how many hours after an event must the Post Event Summary be submitted?', opts:['A. 48 hours','B. 24 hours','C. 72 hours','D. One week'], cor:1, fb:'The Post Event Summary must be submitted within 24 hours after the event concludes.'},

function save(){try{localStorage.setItem(NS,JSON.stringify(S));}catch(e){}}
function load(){try{const d=localStorage.getItem(NS);if(d)S=JSON.parse(d);}catch(e){}}

function calcProgress(){
  let total=0,done=0;
  // 5 modules (each counts as 1 when done array true)
  total+=5; done+=S.done.filter(Boolean).length;
  // assessment submitted
  total+=1; if(S.aSubmitted)done+=1;
  // cert page visited
  total+=1; if(S.ix['cert'])done+=1;
  return Math.round((done/total)*100);
}

function getIx(key){return S.ix[key]||0;}
function setIx(key,v){S.ix[key]=v;save();}

function renderNav(){
  let html='', lastSec='';
  MODS.forEach((m,i)=>{
    if(m.section !== lastSec){
      html += `<div class="sec-label">${m.section}</div>`;
      lastSec = m.section;
    }
    const active = S.mi===i && S.page==='module';
    const done = S.done[i];
    html += `<button class="mod-item${active?' active':''}${done?' completed':''}" onclick="goModule(${i})">
      <div class="mod-badge">${i+1}</div>
      <div>
        <div class="mod-title">${m.title}</div>
        <div class="mod-sub">Module ${i+1} · ${m.dur}</div>
      </div>
    </button>`;
  });
  document.getElementById('sbNav').innerHTML = html;
  const ap=(S.page==='assess')?'active':'';
  const cp=(S.page==='cert')?'active':'';
  document.getElementById('sb-footer').innerHTML=`
    <div class="sb-footer-item ${ap}" onclick="goPage('assess')"><span class="sb-icon"></span> Final Assessment</div>
    <div class="sb-footer-item ${cp}" onclick="goPage('cert')"><span class="sb-icon"></span> Certificate</div>
  `;
}
function updateProgress(){
  const pct = Math.round(S.done.filter(Boolean).length / MODS.length * 100);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('pct').textContent = pct+'%';
}
function renderSidebar(){
  renderNav();
  updateProgress();
}

function goPage(p){S.page=p;save();render();}
function goModule(i){S.page='module';S.mi=i;S.si=getIx('m'+i)||0;save();render();}

function nextScreen(){
  const m=MODS[S.mi];
  S.visited['m'+S.mi+'s'+S.si]=true;
  if(S.si<m.screens-1){
    S.si++;
    setIx('m'+S.mi,S.si);
    save();render();
  } else {
    S.done[S.mi]=true;
    save();
    if(S.mi<MODS.length-1){goModule(S.mi+1);}
    else{goPage('assess');}
  }
}
function prevScreen(){
  if(S.si>0){S.si--;setIx('m'+S.mi,S.si);save();render();}
}

function screenDots(mi,si,total){
  return MODS[mi].screens>1?Array.from({length:total},(_,i)=>{
    let cls='scr-dot';
    if(i===si)cls+=' active';
    else if(S.done[mi])cls+=' done';
    else if(S.visited['m'+mi+'s'+i])cls+=' visited';
    return `<div class="${cls}" onclick="jumpScreen(${i})"></div>`;
  }).join(''):'';
}
function jumpScreen(i){S.si=i;setIx('m'+S.mi,i);save();render();}

function modHeader(mi,si){
  const m=MODS[mi];
  return `<div class="mod-header">
    <div class="mh-eyebrow">Module ${mi+1} of ${MODS.length}</div>
    <h2>${m.title}</h2>
    <div class="mh-sub">${m.dur} &nbsp;·&nbsp; Screen ${si+1} of ${m.screens}</div>
  </div>
  <div class="scr-dots">${screenDots(mi,si,m.screens)}</div>`;
}

function navBar(mi,si){
  const m=MODS[mi];
  const isLast=(si===m.screens-1);
  const nextLabel=isLast?(mi<MODS.length-1?`Start Module ${mi+2} →`:'Go to Assessment →'):'Next →';
  return `<div class="mod-nav">
    <button class="btn-nav" onclick="prevScreen()" ${si===0?'disabled':''}>← Previous</button>
    <span class="nav-progress">${si+1} / ${m.screens}</span>
    <button class="btn-nav btn-next" onclick="nextScreen()">${nextLabel}</button>
  </div>`;
}

/* ============================================================
   ASSESSMENT RENDERING
   ============================================================ */
function renderQuiz(){
  let html=`<div class="assess-page">
    <h2>Final Assessment</h2>
    <p class="sub">Answer all 15 questions. You need 12 correct (80%) to pass. You may select answers before submitting.</p>`;
  AQ.forEach((q,i)=>{
    const ua=S.aa[i];
    const sub=S.aSubmitted;
    html+=`<div class="quiz">
      <div class="q-num">Question ${i+1} of ${AQ.length} — ${q.mod}</div>
      <div class="q-text">${q.q}</div>
      <div class="opts">`;
    q.opts.forEach((o,j)=>{
      let cls='opt';
      if(sub){
        if(j===q.cor)cls+=' correct';
        else if(ua===j&&j!==q.cor)cls+=' wrong';
      } else if(ua===j)cls+=' selected';
      html+=`<label class="${cls}"><input type="radio" name="q${i}" value="${j}" ${ua===j?'checked':''} ${sub?'disabled':''} onchange="answerQuiz(${i},${j})"> ${o}</label>`;
    });
    html+='</div>';
    if(sub&&q.fb){html+=`<div class="fb">${q.fb}</div>`;}
    html+='</div>';
  });
  if(!S.aSubmitted){
    const answered=Object.keys(S.aa).length;
    html+=`<div class="assess-controls">
      <button class="btn btn-primary" onclick="submitQuiz()" ${answered<AQ.length?'disabled':''}>Submit Assessment (${answered}/${AQ.length} answered)</button>
    </div>`;
  } else {
    const pass=S.aScore>=12;
    html+=`<div class="assess-controls">
      ${pass?`<button class="btn btn-gold" onclick="goPage('cert')">View Certificate →</button>`:`<button class="btn btn-outline" onclick="retryQuiz()">Retry Assessment</button>`}
      <button class="btn btn-outline" onclick="goPage('landing')">← Back to Dashboard</button>
    </div>`;
  }
  html+='</div>';
  return html;
}

function answerQuiz(qi,oi){
  if(S.aSubmitted)return;
  S.aa[qi]=oi;
  save();
  // Update UI without full re-render
  document.querySelectorAll(`[name="q${qi}"]`).forEach(el=>{
    el.closest('.opt').classList.toggle('selected',parseInt(el.value)===oi);
  });
  const btn=document.querySelector('.assess-controls button');
  if(btn){
    const answered=Object.keys(S.aa).length;
    btn.textContent=`Submit Assessment (${answered}/${AQ.length} answered)`;
    btn.disabled=answered<AQ.length;
  }
}

function submitQuiz(){
  let score=0;
  AQ.forEach((q,i)=>{if(S.aa[i]===q.cor)score++;});
  S.aScore=score;
  S.aSubmitted=true;
  save();
  render();
}

function retryQuiz(){
  S.aa={};S.aScore=null;S.aSubmitted=false;save();render();
}

/* ============================================================
   RESULTS PAGE
   ============================================================ */
function renderResults(){
  const pass=S.aScore>=12;
  const pct=Math.round((S.aScore/15)*100);
  let html=`<div class="results-page">
    <div class="score-circle ${pass?'pass':'fail'}">
      <div class="sc-num">${S.aScore}/15</div>
      <div class="sc-label">${pct}%</div>
    </div>
    <div class="results-msg">
      <h2>${pass?'Congratulations! You Passed.':'Not Quite — Let\'s Try Again.'}</h2>
      <p style="color:#666;font-size:.9rem">${pass?'You have demonstrated knowledge of the DLA digital environments and member resources.':'You scored '+S.aScore+' out of 15. You need at least 12 correct (80%) to pass. Review the modules and try again.'}</p>
    </div>`;
  // Breakdown
  html+=`<div class="breakdown"><table>
    <tr><th>#</th><th>Question</th><th>Result</th></tr>`;
  AQ.forEach((q,i)=>{
    const correct=S.aa[i]===q.cor;
    html+=`<tr><td>${i+1}</td><td style="font-size:.8rem">${q.q.substring(0,70)}${q.q.length>70?'...':''}</td><td style="color:${correct?'#1a7a40':'#c0392b'};font-weight:600">${correct?' Correct':' Wrong'}</td></tr>`;
  });
  html+='</table></div>';
  if(pass){
    html+=`<div style="display:flex;gap:14px;flex-wrap:wrap">
      <button class="btn btn-gold" onclick="goPage('cert')">Get Certificate →</button>
      <button class="btn btn-outline" onclick="goPage('assess')">Review Answers</button>
    </div>`;
  } else {
    html+=`<div style="display:flex;gap:14px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="retryQuiz()">Retry Assessment</button>
      <button class="btn btn-outline" onclick="goPage('landing')">Back to Dashboard</button>
    </div>`;
  }
  html+='</div>';
  return html;
}

/* ============================================================

      <div class="card" style="max-width:480px;text-align:center;padding:36px">

        <button class="btn btn-primary" onclick="goPage('assess')">Go to Assessment</button>
      </div>
    </div>`;
  }
  return `<div class="cert-page">
    <div class="cert-name-field">
      <label class="name-field" style="margin:0"><label style="display:block;font-size:.78rem;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Your Full Name (for certificate)</label>

    <div class="cert-wrap">
      <div class="cert-logo">Kappa Alpha Psi Fraternity, Inc.®</div>
      <div class="cert-org">Denton-Lewisville Alumni Chapter</div>
      <div class="cert-header">Certificate of Completion</div>
      <div class="cert-title">Website, Member Portal &amp;<br>Training System Orientation</div>
      <div class="cert-course">Digital Literacy for Chapter Members</div>
      <div style="margin:8px 0 4px">Awarded to</div>
      <div class="cert-name" id="cert-name-display">${certName}</div>
      <div class="cert-name-label">Chapter Member</div>
      <div class="cert-score">Assessment Score: ${S.aScore}/15 (${pct}%)</div>
      <div class="cert-date">Date Completed: ${today}</div>
      <div class="cert-seal">
        <div class="cert-seal-item"><div class="seal-line"></div>Chapter Polemarch</div>
        <div class="cert-seal-item" style="font-size:1.4rem;color:var(--go)">KΑΨ</div>
        <div class="cert-seal-item"><div class="seal-line"></div>Training Administrator</div>
      </div>
    </div>
    <div class="cert-controls">
      <button class="btn btn-primary" onclick="window.print()"> Print Certificate</button>
      <button class="btn btn-outline" onclick="goPage('landing')">← Back to Dashboard</button>

function updateCertName(v){
  S.name=v;save();
  const el=document.getElementById('cert-name-display');

function startCourse(){
  if(!S.name){
    const inp=document.getElementById('name-input');
    if(inp&&inp.value)S.name=inp.value;
  }
  save();
  goModule(0);

/* ============================================================
   MAIN RENDER
   ============================================================ */
function getScreenFn(mi,si){
  const fns=[
    [m0s0,m0s1,m0s2,m0s3,m0s4,m0s5,m0s6,m0s7,m0s8,m0s9],
    [m1s0,m1s1,m1s2,m1s3,m1s4,m1s5,m1s6,m1s7,m1s8,m1s9],
    [m2s0,m2s1,m2s2,m2s3,m2s4,m2s5,m2s6,m2s7,m2s8,m2s9],
    [m3s0,m3s1,m3s2,m3s3,m3s4,m3s5,m3s6,m3s7,m3s8,m3s9],
    [m4s0,m4s1,m4s2,m4s3,m4s4,m4s5,m4s6,m4s7,m4s8,m4s9]
  ];
  return fns[mi]&&fns[mi][si]?fns[mi][si]:()=>'<div class="scr-content"><p>Screen content loading...</p></div>';
}

function render(){
  renderSidebar();
  const main=document.getElementById('main');
  if(S.page==='landing'){
    main.innerHTML=renderLanding();
  } else if(S.page==='module'){
    const mi=S.mi,si=S.si;
    const fn=getScreenFn(mi,si);
    main.innerHTML=`<div class="mod-page">${modHeader(mi,si)}${fn()}${navBar(mi,si)}</div>`;
  } else if(S.page==='assess'){
    if(S.aSubmitted){
      main.innerHTML=renderResults();
    } else {
      main.innerHTML=renderQuiz();
    }
  } else if(S.page==='cert'){
    main.innerHTML=renderCertificate();
  }
  window.scrollTo(0,0);
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

// Init
load();
render();
