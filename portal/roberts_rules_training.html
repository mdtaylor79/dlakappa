<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cr:#70110c;--cr-d:#4a0b08;--cr-dd:#3a0906;--cr-l:#8c1812;
  --cm:#f2ebd7;--cm-d:#e5d9bf;--cm-dd:#d4c9a8;
  --go:#c9a84c;--go-d:#a88838;--go-l:#d4b563;
  --tx:#1a1a1a;--tx-m:#555;--tx-l:#888;
  --wh:#fff;--sw:260px;--r:8px;--rl:12px;
  --sh:0 2px 8px rgba(0,0,0,.12);--sh-l:0 4px 20px rgba(0,0,0,.15);
  --tr:.2s ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--tx);background:#ede9df;min-height:100vh;line-height:1.6}
.skip-link{position:absolute;top:-40px;left:6px;background:var(--go);color:var(--cr-d);padding:8px 12px;border-radius:var(--r);font-weight:600;z-index:1000;text-decoration:none}
.skip-link:focus{top:6px}
#sidebar{width:var(--sw);min-width:var(--sw);background:var(--cr);height:100vh;position:fixed;left:0;top:0;overflow-y:auto;display:flex;flex-direction:column;z-index:100;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
#main{margin-left:var(--sw);min-height:100vh}
.sb-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo-badge{width:42px;height:42px;background:var(--go);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--cr-d);flex-shrink:0;font-family:'Playfair Display',serif}
.sb-title{font-size:12px;font-weight:700;color:var(--cm);line-height:1.3;letter-spacing:.02em}
.sb-sub{font-size:10px;color:rgba(242,235,215,.55);margin-top:2px}
.sb-progress{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.prog-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(242,235,215,.55);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.prog-track{height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--go);border-radius:3px;transition:width .4s ease}
.sb-nav{flex:1;padding:8px 0}
.sec-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,235,215,.38);padding:10px 16px 3px}
.mod-item{display:flex;align-items:flex-start;gap:9px;padding:9px 14px;cursor:pointer;transition:background var(--tr);border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.mod-item:hover{background:rgba(255,255,255,.07)}
.mod-item.active{background:rgba(255,255,255,.11);border-left-color:var(--go)}
.mod-item.completed .mod-badge{background:var(--go);color:var(--cr-d)}
.mod-badge{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--cm);flex-shrink:0;margin-top:1px}
.mod-title{font-size:12px;font-weight:600;color:var(--cm);line-height:1.3}
.mod-sub{font-size:10px;color:rgba(242,235,215,.48);margin-top:1px}
.sb-foot{padding:8px 0;border-top:1px solid rgba(255,255,255,.1)}
.sb-foot-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;transition:background var(--tr);border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.sb-foot-item:hover{background:rgba(255,255,255,.07)}
.sb-foot-item.active{background:rgba(255,255,255,.11);border-left-color:var(--go)}
.sb-foot-icon{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sb-foot-label{font-size:12px;font-weight:600;color:var(--cm)}
.hero{background:linear-gradient(135deg,var(--cr-dd) 0%,var(--cr) 55%,var(--cr-l) 100%);color:var(--wh);padding:52px 56px 48px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-8%;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.22);border:1px solid rgba(201,168,76,.45);color:var(--go);padding:5px 13px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:20px}
.hero-title{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;line-height:1.15;margin-bottom:14px;color:var(--wh);max-width:620px}
.hero-sub{font-size:15px;line-height:1.7;color:rgba(255,255,255,.72);max-width:540px;margin-bottom:28px}
.hero-name-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.hero-name-row label{font-size:13px;font-weight:600;color:var(--cm);white-space:nowrap}
.name-input{padding:10px 15px;border-radius:var(--r);border:2px solid rgba(201,168,76,.45);background:rgba(255,255,255,.1);color:var(--wh);font-size:14px;font-weight:500;width:230px;outline:none;transition:border-color var(--tr);font-family:inherit}
.name-input::placeholder{color:rgba(255,255,255,.38)}
.name-input:focus{border-color:var(--go)}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.stat-item{display:flex;align-items:center;gap:7px}
.stat-label{font-size:13px;font-weight:600;color:var(--cm)}
.btn-begin{display:inline-flex;align-items:center;gap:8px;background:var(--go);color:var(--cr-d);border:none;padding:13px 26px;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;transition:all var(--tr);font-family:inherit}
.btn-begin:hover{background:var(--go-l);transform:translateY(-1px)}
.btn-begin:focus{outline:3px solid var(--wh);outline-offset:2px}
.land-body{background:var(--wh);padding:48px 56px}
.sec-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--cr);margin-bottom:6px}
.sec-intro{font-size:14px;color:var(--tx-m);margin-bottom:22px;max-width:560px;line-height:1.6}
.obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:40px}
.obj-card{display:flex;align-items:flex-start;gap:11px;padding:15px;background:var(--cm);border-radius:var(--r);border-left:4px solid var(--go)}
.obj-num{width:26px;height:26px;background:var(--cr);color:var(--wh);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.obj-text{font-size:13px;line-height:1.5;color:var(--tx);font-weight:500}
.path-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.path-card{border:2px solid var(--cm-d);border-radius:var(--rl);padding:16px;transition:all var(--tr);cursor:pointer}
.path-card:hover{border-color:var(--cr);box-shadow:var(--sh)}
.path-num{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx-l);font-weight:700;margin-bottom:5px}
.path-title{font-size:13px;font-weight:700;color:var(--cr);margin-bottom:5px;line-height:1.3}
.path-desc{font-size:11px;color:var(--tx-m);line-height:1.5}
.mod-page{min-height:100vh;background:#ede9df}
.mod-header{background:var(--cr);color:var(--wh);padding:24px 44px;display:flex;align-items:center;gap:18px}
.mod-num-badge{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);width:50px;height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.mod-num-sm{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.55);font-weight:600;line-height:1}
.mod-num-lg{font-size:20px;font-weight:800;color:var(--wh);line-height:1}
.mod-hdr-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5);font-weight:600;margin-bottom:3px}
.mod-hdr-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--wh);line-height:1.25}
.mod-content{padding:36px 44px;max-width:880px}
.scr-dots{display:flex;align-items:center;gap:7px;margin-bottom:24px}
.scr-dot{width:8px;height:8px;border-radius:50%;background:var(--cm-dd);transition:all var(--tr)}
.scr-dot.active{background:var(--cr);width:22px;border-radius:4px}
.scr-dot.done{background:var(--go)}
.card{background:var(--wh);border-radius:var(--rl);padding:26px 30px;margin-bottom:18px;box-shadow:var(--sh)}
.card h3{font-size:17px;font-weight:700;color:var(--cr);margin-bottom:11px}
.card p{font-size:14px;line-height:1.7;color:var(--tx);margin-bottom:11px}
.card p:last-child{margin-bottom:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.quote-block{background:var(--cm);border-left:5px solid var(--go);padding:18px 22px;border-radius:0 var(--r) var(--r) 0;margin-bottom:18px}
.quote-text{font-family:'Playfair Display',serif;font-size:17px;font-style:italic;color:var(--cr);line-height:1.5;margin-bottom:5px}
.quote-src{font-size:11px;color:var(--tx-m);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sl{list-style:none;padding:0}
.sl li{padding:7px 0 7px 22px;position:relative;font-size:14px;line-height:1.5;color:var(--tx);border-bottom:1px solid var(--cm-d)}
.sl li:last-child{border-bottom:none}
.sl li::before{content:'→';position:absolute;left:0;color:var(--go-d);font-weight:700}
.exp-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.exp-card{background:var(--wh);border:2px solid var(--cm-d);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:all var(--tr)}
.exp-card:hover{border-color:var(--cr)}
.exp-card.open{border-color:var(--cr);box-shadow:var(--sh)}
.exp-hdr{padding:14px 18px;display:flex;align-items:center;gap:11px}
.exp-num{width:30px;height:30px;border-radius:7px;background:var(--cr);color:var(--wh);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.exp-title{font-size:14px;font-weight:700;color:var(--tx);flex:1}
.exp-toggle{font-size:18px;color:var(--tx-m);transition:transform var(--tr)}
.exp-card.open .exp-toggle{transform:rotate(45deg);color:var(--cr)}
.exp-body{display:none;padding:12px 18px 14px;font-size:13px;line-height:1.6;color:var(--tx-m);border-top:1px solid var(--cm-d)}
.exp-card.open .exp-body{display:block}
.mod-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 44px;background:var(--wh);border-top:1px solid var(--cm-d);position:sticky;bottom:0;z-index:10}
.btn-nav{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr);border:2px solid;font-family:inherit}
.btn-prev{background:var(--wh);color:var(--cr);border-color:var(--cr)}
.btn-prev:hover{background:var(--cm)}
.btn-next{background:var(--cr);color:var(--wh);border-color:var(--cr)}
.btn-next:hover{background:var(--cr-d)}
.btn-nav:disabled{opacity:.38;cursor:not-allowed}
.btn-nav:focus{outline:3px solid var(--go);outline-offset:2px}
.scr-pos{font-size:12px;color:var(--tx-m);font-weight:500}
.quiz{background:var(--wh);border-radius:var(--rl);padding:26px 30px;margin-bottom:16px;box-shadow:var(--sh)}
.quiz-q-num{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx-l);font-weight:600;margin-bottom:8px}
.quiz-q{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:18px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:9px}
.quiz-opt{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border:2px solid var(--cm-d);border-radius:var(--r);cursor:pointer;transition:all var(--tr);background:var(--wh);font-family:inherit;text-align:left;width:100%}
.quiz-opt:hover:not(:disabled){border-color:var(--cr);background:var(--cm)}
.quiz-opt.sel{border-color:var(--cr);background:rgba(112,17,12,.05)}
.quiz-opt.cor{border-color:#15803d;background:rgba(21,128,61,.08)}
.quiz-opt.inc{border-color:#b91c1c;background:rgba(185,28,28,.07)}
.quiz-opt:disabled{cursor:not-allowed}
.opt-ltr{width:24px;height:24px;border-radius:50%;background:var(--cm-d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx-m);flex-shrink:0}
.quiz-opt.cor .opt-ltr{background:#15803d;color:#fff}
.quiz-opt.inc .opt-ltr{background:#b91c1c;color:#fff}
.opt-text{font-size:13px;line-height:1.5;color:var(--tx)}
.quiz-fb{margin-top:14px;padding:13px 15px;border-radius:var(--r);font-size:13px;line-height:1.5;display:none}
.quiz-fb.show{display:block}
.quiz-fb.cor-fb{background:rgba(21,128,61,.1);border:1px solid #15803d;color:#14532d}
.quiz-fb.inc-fb{background:rgba(185,28,28,.09);border:1px solid #b91c1c;color:#7f1d1d}
.assess-header{background:var(--cr);color:var(--wh);padding:24px 44px}
.assess-q-num{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:7px}
.assess-mod-tag{display:inline-block;background:rgba(255,255,255,.15);padding:2px 9px;border-radius:100px;font-size:10px;color:var(--cm);margin-bottom:14px}
.assess-q{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--wh);line-height:1.35}
.assess-body{padding:32px 44px;max-width:780px}
.assess-dots{display:flex;gap:5px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.assess-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--cm-d);background:var(--wh);font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr);color:var(--tx-m)}
.assess-dot.answered{background:var(--cm);border-color:var(--cr);color:var(--cr)}
.assess-dot.current{background:var(--cr);border-color:var(--cr);color:#fff}
.results-pg{padding:40px 44px;max-width:680px}
.results-circle{width:130px;height:130px;border-radius:50%;border:7px solid var(--go);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 28px}
.results-score{font-size:36px;font-weight:800;color:var(--cr);line-height:1}
.results-slbl{font-size:11px;color:var(--tx-m);font-weight:600}
.results-status{text-align:center;margin-bottom:28px}
.r-pass{font-size:20px;font-weight:700;color:#166534}
.r-fail{font-size:20px;font-weight:700;color:#991b1b}
.breakdown{background:var(--wh);border-radius:var(--rl);padding:22px;box-shadow:var(--sh);margin-bottom:22px}
.bd-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--cm-d)}
.bd-row:last-child{border-bottom:none}
.bd-mod{font-size:13px;font-weight:600;color:var(--tx)}
.bd-score{font-size:13px;font-weight:700}
.sg{color:#166534}.sb-c{color:#991b1b}
.cert-wrapper{padding:36px;background:#ede9df;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cert{width:760px;max-width:100%;background:var(--wh);border:7px solid var(--go);border-radius:var(--rl);padding:44px 52px;text-align:center;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.14)}
.cert::before{content:'';position:absolute;inset:11px;border:2px solid var(--cm-d);border-radius:var(--r);pointer-events:none}
.cert-logo{font-size:44px;font-family:'Playfair Display',serif;font-weight:700;color:var(--cr);margin-bottom:7px}
.cert-org{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--tx-l);font-weight:600;margin-bottom:24px}
.cert-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--cr);margin-bottom:18px;line-height:1.2}
.cert-certifies{font-size:13px;color:var(--tx-m);margin-bottom:7px;font-style:italic}
.cert-name{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--go-d);margin-bottom:18px;line-height:1.2}
.cert-completed{font-size:13px;color:var(--tx-m);margin-bottom:7px}
.cert-course{font-size:17px;font-weight:700;color:var(--tx);margin-bottom:7px;font-family:'Playfair Display',serif}
.cert-chapter{font-size:13px;color:var(--tx-m);margin-bottom:22px}
.cert-date{font-size:13px;color:var(--tx-l);margin-bottom:22px;font-style:italic}
.cert-div{width:110px;height:3px;background:var(--go);margin:0 auto 22px;border-radius:2px}
.cert-seal{font-size:36px;margin-bottom:14px}
.btn-print{display:inline-flex;align-items:center;gap:7px;background:var(--cr);color:var(--wh);border:none;padding:11px 22px;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;margin-top:18px;transition:background var(--tr);font-family:inherit}
.btn-print:hover{background:var(--cr-d)}
.title-screen{min-height:55vh;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
.ts-mod-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--tx-l);margin-bottom:11px}
.ts-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--cr);line-height:1.25;margin-bottom:18px}
.ts-obj{font-size:15px;color:var(--tx-m);line-height:1.7;max-width:580px;background:var(--cm);padding:18px 22px;border-radius:var(--rl);border-left:4px solid var(--go)}
.mod-summary{background:linear-gradient(135deg,var(--cr-dd),var(--cr));color:var(--wh);border-radius:var(--rl);padding:28px 32px;margin-bottom:18px}
.mod-summary p{font-size:15px;line-height:1.8;color:rgba(255,255,255,.88);margin-bottom:11px}
.mod-summary p:last-child{margin-bottom:0}
.info-box{background:rgba(112,17,12,.06);border:1px solid rgba(112,17,12,.18);border-radius:var(--r);padding:14px 18px;font-size:13px;line-height:1.6;color:var(--tx);margin:14px 0}
.info-box strong{color:var(--cr)}
.complete-badge{background:var(--go);color:var(--cr-d);text-align:center;padding:10px 18px;font-size:13px;font-weight:700;border-radius:var(--r);margin-bottom:14px}
.ladder{display:flex;flex-direction:column}
.ladder-rung{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;background:var(--wh);border:1px solid var(--cm-d);border-bottom:none}
.ladder-rung:first-child{border-radius:var(--rl) var(--rl) 0 0}
.ladder-rung:last-child{border-radius:0 0 var(--rl) var(--rl);border-bottom:1px solid var(--cm-d)}
.ladder-num{width:34px;height:34px;border-radius:50%;background:var(--cr);color:var(--wh);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.ladder-title{font-size:14px;font-weight:700;color:var(--cr);margin-bottom:3px}
.ladder-desc{font-size:12px;color:var(--tx-m);line-height:1.5}
.smart-tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.smart-tbl th{background:var(--cr);color:#fff;padding:9px 13px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.smart-tbl td{padding:11px 13px;border-bottom:1px solid var(--cm-d);vertical-align:top;line-height:1.5}
.smart-tbl tr:nth-child(even) td{background:var(--cm)}
.dtree{background:var(--cm);border-radius:var(--rl);padding:20px;margin-bottom:14px}

<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<button class="hamburger" id="hamburger" aria-label="Open navigation" aria-expanded="false">&#9776;</button>
<div class="sb-overlay" id="sb-overlay"></div>
<nav id="sidebar" aria-label="Course navigation"></nav>
<main id="main" role="main">
  <div id="main-content" tabindex="-1"></div>
</main>
<script>
const NS = 'DLA_ROBERTS_2026';
let S = {
  page:'landing', mi:0, si:0, name:'',
  done:[false,false,false,false,false,false,false,false,false],
  visited:{}, ix:{}, aa:{}, aScore:null, aSubmitted:false
};
function save(){try{localStorage.setItem(NS,JSON.stringify(S))}catch(e){}}
function load(){try{const d=localStorage.getItem(NS);if(d)Object.assign(S,JSON.parse(d))}catch(e){}}

const MODS=[
  {title:'The Foundation of Parliamentary Procedure',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'The Language of Parliamentary Procedure',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'Making a Motion: The 8-Step Process',dur:'~30 min',screens:10,section:'FOUNDATIONS'},
  {title:'Types of Motions',dur:'~30 min',screens:10,section:'MOTIONS & DEBATE'},
  {title:'Order of Business, Voting & Conflict',dur:'~30 min',screens:10,section:'MOTIONS & DEBATE'},
  {title:'Maintaining Order and Proper Conduct',dur:'~30 min',screens:10,section:'MOTIONS & DEBATE'},
  {title:"Member Guidelines: Dos, Don'ts & Phrases",dur:'~30 min',screens:10,section:'ADVANCED PROCEDURE'},
  {title:'Duties of the Presiding Officer',dur:'~30 min',screens:10,section:'ADVANCED PROCEDURE'},
  {title:'Applied Scenarios & Practice',dur:'~30 min',screens:10,section:'ADVANCED PROCEDURE'}
];

function calcProgress(){
  const total=MODS.reduce((a,m)=>a+m.screens,0)+12+2;
  let done=0;
  MODS.forEach((m,mi)=>{for(let si=0;si<m.screens;si++){if(S.visited[`${mi}-${si}`])done++;}});
  if(S.aSubmitted) done+=12;
  if(S.aScore!==null&&S.aScore>=10) done+=2;
  return Math.round((done/total)*100);
}
function getIx(){return S.ix[`${S.mi}-${S.si}`]||{};}
function setIx(d){S.ix[`${S.mi}-${S.si}`]=Object.assign(getIx(),d);save();}

function renderSidebar(){
  const pct=calcProgress();
  let secShown={},items='';
  MODS.forEach((m,i)=>{
    if(!secShown[m.section]){items+=`<div class="sec-label">${m.section}</div>`;secShown[m.section]=true;}
    const isActive=S.page==='module'&&S.mi===i, isDone=S.done[i];
    items+=`<button class="mod-item${isActive?' active':''}${isDone?' completed':''}" onclick="goModule(${i})">
      <div class="mod-badge">${isDone?'&#10003;':(i+1)}</div>
      <div><div class="mod-title">${m.title}</div><div class="mod-sub">Module ${i+1} &middot; ${m.dur}</div></div>
    </button>`;
  });
  return `<div class="sb-header"><div class="sb-logo">
    <div class="logo-badge">K&#913;&#936;</div>
    <div><div class="sb-title">Roberts Rules of Order</div><div class="sb-sub">Denton-Lewisville Alumni Chapter &middot; 2026</div></div>
  </div></div>
  <div class="sb-progress">
    <div class="prog-label"><span>Course Progress</span><span>${pct}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="sb-nav">${items}</div>
  <div class="sb-foot">
    ${S.aScore!==null&&S.aScore>=10?`<button class="sb-foot-item${S.page==='certificate'?' active':''}" onclick="goPage('certificate')"><div class="sb-foot-icon">&#127885;</div><div class="sb-foot-label">My Certificate</div></button>`:''}
    ${S.aSubmitted?`<button class="sb-foot-item${S.page==='results'?' active':''}" onclick="goPage('results')"><div class="sb-foot-icon">&#128202;</div><div class="sb-foot-label">Assessment Results</div></button>`:''}
  </div>`;
}

function goPage(p){S.page=p;save();render();}
function goModule(mi){S.page='module';S.mi=mi;S.si=0;S.visited[`${mi}-0`]=true;save();render();}
function nextScreen(){
  if(S.si<MODS[S.mi].screens-1){
    S.si++;S.visited[`${S.mi}-${S.si}`]=true;save();render();window.scrollTo(0,0);
  } else {
    S.done[S.mi]=true;
    const next=S.mi+1;
    if(next<MODS.length){
      if(window.confirm(`Module ${S.mi+1} complete! Start Module ${next+1}?`)){S.page='module';S.mi=next;S.si=0;S.visited[`${next}-0`]=true;}
      else S.page='landing';
    } else {
      if(window.confirm('All modules complete! Proceed to the Final Assessment?')){S.page='assessment';S.si=0;}
      else S.page='landing';
    }
    save();render();window.scrollTo(0,0);
  }
}
function prevScreen(){if(S.si>0){S.si--;save();render();window.scrollTo(0,0);}}

function screenDots(count,current){
  let d='';
  for(let i=0;i<count;i++){
    const isDone=S.visited[`${S.mi}-${i}`]&&i<current;
    d+=`<div class="scr-dot${i===current?' active':isDone?' done':''}"></div>`;
  }
  return `<div class="scr-dots">${d}</div>`;
}
function modHeader(mi){
  const m=MODS[mi];
  return `<div class="mod-header">
    <div class="mod-num-badge"><div class="mod-num-sm">MOD</div><div class="mod-num-lg">${mi+1}</div></div>
    <div><div class="mod-hdr-lbl">Module ${mi+1} of ${MODS.length}</div><div class="mod-hdr-title">${m.title}</div></div>
  </div>`;
}
function navBar(si,total,nextLabel){
  nextLabel=nextLabel||'Next &rarr;';
  return `<div class="mod-nav">
    <button class="btn-nav btn-prev" onclick="prevScreen()" ${si===0?'disabled':''}>&#8592; Previous</button>
    <span class="scr-pos">Screen ${si+1} of ${total}</span>
    <button class="btn-nav btn-next" onclick="nextScreen()">${nextLabel}</button>
  </div>`;
}

function renderQuiz(qid,question,opts,correctIdx,feedback){
  const ix=getIx(),sel=ix[qid],submitted=sel!==undefined;
  let optHtml='';
  opts.forEach((o,i)=>{
    let cls='quiz-opt';
    if(submitted){if(i===correctIdx)cls+=' cor';else if(i===sel)cls+=' inc';}
    else if(i===sel)cls+=' sel';
    optHtml+=`<button class="${cls}" onclick="answerQuiz('${qid}',${i},${correctIdx})" ${submitted?'disabled':''}>
      <div class="opt-ltr">${String.fromCharCode(65+i)}</div><div class="opt-text">${o}</div>
    </button>`;
  });
  const fbShow=submitted?'show':'', fbCls=submitted&&sel===correctIdx?'cor-fb':'inc-fb';
  return `<div class="quiz">
    <div class="quiz-q-num">${qid.replace(/-/g,' ')}</div>
    <div class="quiz-q">${question}</div>
    <div class="quiz-opts">${optHtml}</div>
    <div class="quiz-fb ${fbCls} ${fbShow}">${submitted?feedback:''}</div>
  </div>`;
}
function answerQuiz(qid,sel,correct){
  const ix=getIx();if(ix[qid]!==undefined)return;
  ix[qid]=sel;setIx(ix);render();
}
function toggleExp(i){
  const cards=document.querySelectorAll('.exp-card');
  if(cards[i])cards[i].classList.toggle('open');
}

// ASSESSMENT QUESTIONS
const AQ=[
  {mod:'Module 1',q:"Robert's Rules of Order was first published in what year?",opts:['1776','1848','1876','1920'],cor:2,fb:"Correct &mdash; Henry Martyn Robert published the first edition in 1876, based on his experience struggling to preside over a disorganized meeting."},
  {mod:'Module 1',q:"Which is NOT one of the four core principles of Robert's Rules?",opts:['One matter at a time','Right to be heard','Unanimous agreement required','Majority rules with minority protected'],cor:2,fb:"Correct &mdash; Robert's Rules does not require unanimous agreement. The four principles are: one matter at a time, right to be heard, majority rules with minority protected, and all members are equal."},
  {mod:'Module 2',q:'What is a quorum?',opts:['The motion currently under debate','The minimum number of members required to conduct official business','The presiding officer\'s ruling on a point of order','A vote by written ballot'],cor:1,fb:'Correct &mdash; a quorum is the minimum number of members that must be present before the body can conduct official business.'},
  {mod:'Module 2',q:'A member says "I call the question." What are they requesting?',opts:['A point of information','A recess','An immediate vote, ending debate','An amendment to the motion'],cor:2,fb:'Correct &mdash; Previous Question moves to end debate immediately and proceed to a vote. It requires a 2/3 majority to pass.'},
  {mod:'Module 3',q:'After a member makes a motion, what must happen before the chair opens debate?',opts:['The chair must approve the motion','Another member must second the motion','All members must vote to proceed','The secretary must record the motion in writing'],cor:1,fb:'Correct &mdash; a motion requires a second before debate can begin. The second indicates at least one other member believes the matter deserves discussion.'},
  {mod:'Module 4',q:'Which type of motion takes precedence over all other motions?',opts:['Main motions','Subsidiary motions','Privileged motions','Incidental motions'],cor:2,fb:'Correct &mdash; privileged motions (adjourn, recess, questions of privilege) take precedence over all other business because they address the immediate needs of the assembly.'},
  {mod:'Module 5',q:'What is the correct order for the first three items in the standard order of business?',opts:['Reports, Minutes, Call to Order','Call to Order, Minutes, Officer Reports','Minutes, Call to Order, New Business','New Business, Reports, Adjournment'],cor:1,fb:'Correct &mdash; the standard order begins with Call to Order (with quorum confirmed), then approval of Minutes, then Officer Reports.'},
  {mod:'Module 5',q:'A member has a financial interest in a motion being voted on. What should they do?',opts:['Vote as normal','Abstain from the vote only','Disclose the conflict and recuse from both debate and the vote','Leave the building'],cor:2,fb:'Correct &mdash; a member with a conflict of interest should disclose it and recuse from both debate and the vote to maintain integrity of the process.'},
  {mod:'Module 6',q:'A member makes personal attacks on another member during debate. The correct response from the chair is:',opts:['Allow it &mdash; free speech applies','Call the member to order and require debate to focus on the motion','Table the motion','Ask for a vote to expel the member'],cor:1,fb:'Correct &mdash; the chair calls the member to order. Personal attacks violate parliamentary decorum; debate must address the motion.'},
  {mod:'Module 7',q:'A member believes the chair made an incorrect procedural ruling. The proper parliamentary response is:',opts:['Argue with the chair directly','Ignore the ruling','State \'I appeal the decision of the chair\' after receiving recognition','Leave the meeting in protest'],cor:2,fb:"Correct &mdash; 'I appeal the decision of the chair' triggers a formal vote by the assembly on whether to sustain or overturn the ruling."},
  {mod:'Module 8',q:'The presiding officer wishes to speak in favor of a pending motion. What must they do?',opts:['Speak from the chair &mdash; they have authority','Yield the chair temporarily to another officer','Vote instead of speaking','Wait until after the vote to comment'],cor:1,fb:'Correct &mdash; the presiding officer must yield the chair to speak in debate. Their role requires impartiality while presiding.'},
  {mod:'Module 9',q:'A voice vote is challenged &mdash; a member calls out "Division!" The chair must:',opts:['Re-take the voice vote three times','Order an immediate standing (rising) vote','Ask the secretary to decide','Proceed with the result as announced'],cor:1,fb:'Correct &mdash; Division of the House requires a standing vote to provide a clear, visible count when a voice vote result is disputed.'}
];

// MODULE 1
function m1s0(){return `<div class="title-screen">
  <div class="ts-mod-lbl">Module 1 of 9 &middot; Foundations</div>
  <div class="ts-title">The Foundation of Parliamentary Procedure</div>
  <div class="ts-obj">By the end of this module, you will understand the origin of Robert's Rules, the four core principles that govern parliamentary procedure, and why structured meetings protect every member's rights.</div>
</div>`;}
function m1s1(){return `<div>
  <div class="card"><h3>Origin of Robert's Rules</h3>
    <p>Henry Martyn Robert, a U.S. Army officer, struggled to preside over a public meeting in 1863 &mdash; he had no training. He spent years researching parliamentary law and self-published <em>Pocket Manual of Rules of Order for Deliberative Assemblies</em> in <strong>1876</strong>.</p>
    <p>The manual was an immediate success. Organizations everywhere needed a neutral, fair system for conducting business. Today, Robert's Rules is the most widely used parliamentary authority in the United States.</p>
  </div>
  <div class="quote-block">
    <div class="quote-text">"Where there is no law, but every man does what is right in his own eyes, there is the least of real liberty."</div>
    <div class="quote-src">Henry Martyn Robert</div>
  </div>
  <div class="card"><h3>Why It Matters for KA&#936;</h3>
    <p>Every chapter meeting, every vote, every committee report follows parliamentary procedure. Members who understand the rules participate effectively, protect their rights, and help the chapter conduct business with dignity and efficiency.</p>
  </div>
</div>`;}
function m1s2(){
  const ix=getIx(),q1Done=ix.q1!==undefined;
  return `<div>
  <div class="card"><h3>The Four Core Principles</h3><p>Click each card to expand.</p></div>
  <div class="exp-cards">
    <div class="exp-card" onclick="toggleExp(0)"><div class="exp-hdr"><div class="exp-num">1</div><div class="exp-title">One Matter at a Time</div><div class="exp-toggle">+</div></div><div class="exp-body">Only one main motion may be considered at a time. This prevents chaos, keeps focus, and ensures every proposal receives proper attention before another is introduced.</div></div>
    <div class="exp-card" onclick="toggleExp(1)"><div class="exp-hdr"><div class="exp-num">2</div><div class="exp-title">Right to Be Heard</div><div class="exp-toggle">+</div></div><div class="exp-body">Every member has the right to speak before a vote is taken. No one may be silenced arbitrarily. Debate ensures informed decisions.</div></div>
    <div class="exp-card" onclick="toggleExp(2)"><div class="exp-hdr"><div class="exp-num">3</div><div class="exp-title">Majority Rules, Minority Protected</div><div class="exp-toggle">+</div></div><div class="exp-body">A majority decides, but the minority has the right to speak, be heard, and bring the matter back in the future. Parliamentary law protects dissent.</div></div>
    <div class="exp-card" onclick="toggleExp(3)"><div class="exp-hdr"><div class="exp-num">4</div><div class="exp-title">All Members Are Equal</div><div class="exp-toggle">+</div></div><div class="exp-body">Every member &mdash; regardless of seniority, title, or contribution &mdash; has an equal voice and equal vote. The rules apply uniformly to everyone.</div></div>
  </div>
  ${renderQuiz('q1','Which principle guarantees every member may speak before a vote closes debate?',['One Matter at a Time','Right to Be Heard','Majority Rules','All Members Are Equal'],1,'Correct &mdash; the Right to Be Heard guarantees every member may speak before a vote. It cannot be waived unilaterally by the chair.')}
  ${q1Done?'<div class="complete-badge">&#10003; Knowledge check complete &mdash; you may continue</div>':''}
</div>`;}
function m1s3(){return `<div>
  <div class="card"><h3>Robert's Rules at Kappa Alpha Psi Chapters</h3>
    <p>Kappa Alpha Psi has operated under formal parliamentary procedure since its founding at Indiana University in 1911. The fraternity's <em>Constitution and Statutes</em> explicitly adopts <em>Robert's Rules of Order Newly Revised</em> as the parliamentary authority for all chapter meetings.</p>
    <p>This means that every Denton-Lewisville Alumni Chapter meeting &mdash; from call to order through adjournment &mdash; is governed by these rules. When a chapter violates parliamentary procedure, its decisions can be challenged, overturned, or invalidated by Grand Chapter.</p>
  </div>
  <div class="card"><h3>How KA&#936; Chapters Use Parliamentary Procedure</h3>
    <table class="smart-tbl">
      <thead><tr><th>Chapter Activity</th><th>Parliamentary Rule Applied</th></tr></thead>
      <tbody>
        <tr><td>Approving the annual budget</td><td>Main motion, debate, majority vote</td></tr>
        <tr><td>Electing chapter officers</td><td>Nominations, balloting, majority required</td></tr>
        <tr><td>Amending the chapter bylaws</td><td>Previous notice required, 2/3 majority</td></tr>
        <tr><td>Approving chapter event expenditures</td><td>Main motion, quorum required</td></tr>
        <tr><td>Censuring a member</td><td>Written charges, hearing, vote</td></tr>
        <tr><td>Overturning a committee decision</td><td>Rescind or amend previously adopted action</td></tr>
      </tbody>
    </table>
  </div>
  <div class="info-box"><strong>DL Chapter practice:</strong> The Denton-Lewisville chapter uses Robert's Rules at every regular and special meeting. Knowing the rules is not optional for active chapter participants &mdash; it is a fraternal obligation.</div>
</div>`;}
function m1s4(){return `<div>
  <div class="card"><h3>Why Parliamentary Procedure Matters for Alumni Chapters</h3>
    <p>Alumni chapters present unique parliamentary challenges. Unlike undergraduate chapters with mandatory weekly attendance, alumni chapters gather busy professionals with varying levels of parliamentary experience. This creates a higher risk of procedural shortcuts that can invalidate chapter business.</p>
  </div>
  <div class="card"><h3>The Three Risks of Skipping Procedure</h3>
    <div class="ladder">
      <div class="ladder-rung" style="border-radius:var(--rl) var(--rl) 0 0">
        <div class="ladder-num" style="background:#b91c1c">1</div>
        <div><div class="ladder-title">Invalid Decisions</div><div class="ladder-desc">A vote taken without quorum, or on a motion never properly stated, is void. Expenditures made under such votes can create personal liability for officers.</div></div>
      </div>
      <div class="ladder-rung">
        <div class="ladder-num" style="background:#b91c1c">2</div>
        <div><div class="ladder-title">Member Disenfranchisement</div><div class="ladder-desc">When debate is cut short or members are not recognized, rights are violated. Disenfranchised members can file grievances with Grand Chapter.</div></div>
      </div>
      <div class="ladder-rung" style="border-radius:0 0 var(--rl) var(--rl);border-bottom:1px solid var(--cm-d)">
        <div class="ladder-num" style="background:#b91c1c">3</div>
        <div><div class="ladder-title">Erosion of Trust</div><div class="ladder-desc">When some members control meetings through ignorance (or manipulation) of the rules, others disengage. Parliamentary procedure protects the culture of participation.</div></div>
      </div>
    </div>
  </div>
  <div class="quote-block">
    <div class="quote-text">"Parliamentary law is built on a bedrock principle: every member deserves an equal voice, an equal vote, and the protection of established rules."</div>
    <div class="quote-src">Robert's Rules of Order Newly Revised, 12th Edition</div>
  </div>
</div>`;}
function m1s5(){return `<div>
  <div class="card"><h3>The Democratic Principle Behind Each Rule</h3>
    <p>Every rule in Robert's Rules exists to protect one or more democratic rights. Understanding <em>why</em> a rule exists helps you remember it and apply it correctly under pressure.</p>
  </div>
  <table class="smart-tbl">
    <thead><tr><th>The Rule</th><th>The Democratic Principle It Protects</th></tr></thead>
    <tbody>
      <tr><td>Must be recognized before speaking</td><td>Equal access to the floor &mdash; no one can monopolize debate</td></tr>
      <tr><td>Only one main motion at a time</td><td>The assembly focuses on one matter; nothing slips through unexamined</td></tr>
      <tr><td>A second is required before debate</td><td>At least two members believe the matter deserves the chapter's attention</td></tr>
      <tr><td>Previous Question requires 2/3</td><td>A strong majority, not just a bare majority, must agree debate is finished</td></tr>
      <tr><td>Bylaws require 2/3 to amend</td><td>Fundamental rules cannot be changed by a slim majority in a single meeting</td></tr>
      <tr><td>Chair cannot vote (most cases)</td><td>The presiding officer remains impartial; their tie-breaking role is reserved</td></tr>
      <tr><td>Minority may speak before a vote</td><td>The losing side's perspective is heard, even if it does not prevail</td></tr>
      <tr><td>Quorum must be present</td><td>A small faction cannot make binding decisions for the full chapter</td></tr>
    </tbody>
  </table>
  <div class="info-box"><strong>Key insight:</strong> When you know the principle, you can reason about unfamiliar situations. A rule that seems technical almost always traces back to fairness, majority rule, or minority protection.</div>
</div>`;}
function m1s6(){return `<div>
  <div class="card"><h3>What Happens When Procedure Breaks Down</h3>
    <p>These are composite scenarios drawn from common alumni chapter meeting failures. Names are illustrative; the procedural failures are real patterns.</p>
  </div>
  <div class="exp-cards">
    <div class="exp-card" onclick="toggleExp(0)"><div class="exp-hdr"><div class="exp-num">1</div><div class="exp-title">The Unrecorded Vote</div><div class="exp-toggle">+</div></div><div class="exp-body">A chapter informally agreed by voice to donate $1,000 to a scholarship fund. No motion was stated, no quorum count was done, and the minutes read only "scholarship discussed." The treasurer refused to cut the check, correctly noting no valid motion existed. The chapter argued for three months about what had actually been decided.</div></div>
    <div class="exp-card" onclick="toggleExp(1)"><div class="exp-hdr"><div class="exp-num">2</div><div class="exp-title">The Railroaded Election</div><div class="exp-toggle">+</div></div><div class="exp-body">A presiding officer called for nominations, immediately moved to close nominations, and called a vote &mdash; all within 90 seconds. Several members had not been recognized. The election was later voided after a grievance to Grand Chapter because the right to nominate was not protected.</div></div>

      ${scBtn('d3','C) No &mdash; the Chair must remain impartial and may not second a motion','C')}

    </div>
    ${d3?`<div class="dtree-result show ${d3==='C'?'dtr-good':'dtr-bad'}">${d3==='C'?'Correct &mdash; the presiding officer may not second a motion. Their role requires impartiality. If no member seconds, the motion dies. The chair can ask the assembly: "Is there a second?" but cannot provide one.':'Incorrect &mdash; the Chair\'s impartiality prevents them from seconding a motion. If no second is offered, the motion dies for lack of a second.'}</div>`:''}
  </div>
</div>`;}
function m9s8(){
  const ix=getIx();
  const d4=ix.d4, d5=ix.d5;
  return `<div>
  <div class="card"><h3>DL Chapter Meeting Simulation &mdash; Part 2 of 2</h3></div>
  <div class="dtree">
    <div class="dtree-scenario"><strong>Decision Point 4:</strong> A motion to allocate $1,200 for a community event passes 7–4. Brother Foster, who voted yes, immediately says "Wait — I think we need to reconsider. Can I move to reconsider?"</div>
    <div class="dtree-q">May Brother Foster move to reconsider?</div>
    <div class="dtree-opts">
      ${scBtn('d4','A) Yes &mdash; any member may move to reconsider','B')}
      ${scBtn('d4','B) Yes &mdash; Brother Foster voted on the prevailing side (yes/aye), so he may move to reconsider','B')}
      ${scBtn('d4','C) No &mdash; you cannot reconsider a motion in the same meeting','B')}
      ${scBtn('d4','D) Only the President may call for reconsideration','B')}
    </div>
    ${d4?`<div class="dtree-result show ${d4==='B'?'dtr-good':'dtr-bad'}">${d4==='B'?'Correct &mdash; Brother Foster voted on the prevailing (winning) side, which is the required condition. Only members who voted with the majority may move to reconsider.':'Incorrect &mdash; Reconsider must be moved by a member who voted with the prevailing side. Brother Foster voted yes and the motion passed (yes prevailed), so he qualifies.'}</div>`:''}
  </div>
  <div class="dtree">
    <div class="dtree-scenario"><strong>Decision Point 5:</strong> The meeting is wrapping up. There is no pending business. The Chair says "OK, we're done — see everyone next month" and walks away from the podium.</div>
    <div class="dtree-q">Was the meeting properly adjourned?</div>
    <div class="dtree-opts">
      ${scBtn('d5','A) Yes &mdash; if no more business, the meeting is over','C')}
      ${scBtn('d5','B) Yes &mdash; the Chair's declaration is sufficient','C')}
      ${scBtn('d5','C) No &mdash; formal adjournment requires either a motion and vote or unanimous consent, and a declared statement from the Chair','C')}
      ${scBtn('d5','D) Only the Secretary can formally adjourn a meeting','C')}
    </div>
    ${d5?`<div class="dtree-result show ${d5==='C'?'dtr-good':'dtr-bad'}">${d5==='C'?'Correct &mdash; adjournment must be declared by the Chair, either following a motion and vote or by unanimous consent. The time of adjournment is recorded in the minutes. Informally leaving is not parliamentary adjournment.':'Incorrect &mdash; the Chair must formally declare adjournment. A motion ("I move we adjourn") followed by a vote, or the Chair asking for unanimous consent and receiving none, is required. The exact time is entered in the minutes.'}</div>`:''}
  </div>
  <div class="mod-summary" style="margin-top:18px">
    <p>Simulation complete. Continue to the Common Errors Reference Card.</p>
  </div>
</div>`;}
function m9s9(){return `<div>
  <div class="card"><h3>Common Parliamentary Errors: Quick Reference Card</h3>
    <p>These are the errors most frequently observed at alumni chapter meetings. Keep this list in mind during every DL Chapter meeting.</p>
  </div>
  <table class="smart-tbl">
    <thead><tr><th>#</th><th>The Error</th><th>The Correct Practice</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Calling a vote without confirming quorum</td><td>Always confirm quorum before any binding vote</td></tr>
      <tr><td>2</td><td>Chair seconding or debating a motion from the chair</td><td>Chair yields to VP before participating in debate</td></tr>
      <tr><td>3</td><td>Approving minutes without asking for corrections or objections</td><td>"Are there corrections? Any objection? Minutes approved."</td></tr>
      <tr><td>4</td><td>Allowing discussion without a motion on the floor</td><td>Every binding decision requires a properly stated motion</td></tr>
      <tr><td>5</td><td>Using "table" to mean "kill" a motion permanently</td><td>Use "Postpone Indefinitely" to kill; "Table" only suspends</td></tr>
      <tr><td>6</td><td>Ignoring a call for Division</td><td>Division is mandatory — Chair must retake vote by count</td></tr>
      <tr><td>7</td><td>Allowing a member to speak three times without assembly consent</td><td>Enforce the two-speech limit; require assembly vote to extend</td></tr>
      <tr><td>8</td><td>Treating "Good of the Order" as a binding decision-making session</td><td>No binding votes in Good of the Order; new matters need a motion at New Business</td></tr>
      <tr><td>9</td><td>Moving to Reconsider from the losing side</td><td>Only the prevailing side may move to reconsider</td></tr>
      <tr><td>10</td><td>Informally adjourning without a declaration</td><td>Chair must declare adjournment formally; time goes in the minutes</td></tr>
    </tbody>
  </table>
  <div class="mod-summary" style="margin-top:18px">
    <p>You have completed all nine modules of Parliamentary Procedure Training.</p>
    <p>You are now equipped to participate effectively in any chapter meeting &mdash; making motions correctly, protecting your rights, maintaining order, and understanding the full range of parliamentary tools available to you.</p>
    <p>Proceed to the Final Assessment to earn your Certificate of Completion.</p>
  </div>
</div>`;}

function renderModule(){
  const m=MODS[S.mi];
  const isLast=S.si===m.screens-1;
  const nextLabel=isLast?(S.mi<MODS.length-1?'Next Module &rarr;':'Final Assessment &rarr;'):'Next &rarr;';
  return `<div class="mod-page">
    ${modHeader(S.mi)}
    <div class="mod-content">
      ${screenDots(m.screens,S.si)}
      ${SCREEN_FNS[S.mi][S.si]()}
    </div>
    ${navBar(S.si,m.screens,nextLabel)}
  </div>`;
}

  const pct=calcProgress();
  const allDone=S.done.every(Boolean);
  return `<div>

  <div class="land-body">

function beginCourse(){
  const first=S.done.findIndex(d=>!d);
  goModule(first>=0?first:0);
}

function renderAssessment(){
  const q=AQ[S.si],answered=S.aa[S.si];
  let optHtml='';
  q.opts.forEach((o,i)=>{
    const ltr=String.fromCharCode(65+i);
    const isAns=answered===ltr,isCor=i===q.cor;
    let cls='quiz-opt';
    if(answered!==undefined){if(isCor)cls+=' cor';else if(isAns)cls+=' inc';}
    optHtml+=`<button class="${cls}" onclick="assessAnswer(${i})" ${answered!==undefined?'disabled':''}>
      <div class="opt-ltr">${ltr}</div><div class="opt-text">${o}</div>
    </button>`;
  });
  let dots='';
  AQ.forEach((_,i)=>{
    dots+=`<button class="assess-dot${i===S.si?' current':S.aa[i]?' answered':''}" onclick="S.si=${i};save();render()">${i+1}</button>`;
  });
  const allAnswered=Object.keys(S.aa).length===AQ.length;
  return `<div>
  <div class="assess-header">
    <div class="assess-q-num">Question ${S.si+1} of ${AQ.length}</div>
    <div class="assess-mod-tag">${q.mod}</div>
    <div class="assess-q">${q.q}</div>
  </div>
  <div class="assess-body">
    <div class="quiz-opts">${optHtml}</div>
    ${answered!==undefined?`<div class="quiz-fb ${answered===String.fromCharCode(65+q.cor)?'cor-fb':'inc-fb'} show">${q.fb}</div>`:''}
    <div class="assess-dots">${dots}</div>
    ${allAnswered&&!S.aSubmitted?`<button class="btn-primary" style="margin-top:18px" onclick="submitAssessment()">Submit Assessment &rarr;</button>`:''}
    ${S.aSubmitted?`<button class="btn-primary" style="margin-top:18px" onclick="goPage('results')">View Results &rarr;</button>`:''}
  </div>
</div>`;}

function assessAnswer(i){
  if(S.aa[S.si]!==undefined)return;
  S.aa[S.si]=String.fromCharCode(65+i);save();render();
}
function submitAssessment(){
  let correct=0;
  AQ.forEach((q,i)=>{if(S.aa[i]===String.fromCharCode(65+q.cor))correct++;});
  S.aScore=correct;S.aSubmitted=true;save();goPage('results');
}

function renderResults(){
  const score=S.aScore,total=AQ.length,pct=Math.round((score/total)*100),pass=score>=Math.ceil(total*0.8);
  const grouped={};
  AQ.forEach((q,i)=>{
    if(!grouped[q.mod])grouped[q.mod]={total:0,correct:0};
    grouped[q.mod].total++;
    if(S.aa[i]===String.fromCharCode(65+q.cor))grouped[q.mod].correct++;
  });
  let bdHtml='';
  Object.entries(grouped).forEach(([mod,d])=>{
    const ok=d.correct===d.total;
    bdHtml+=`<div class="bd-row"><div class="bd-mod">${mod}</div><div class="bd-score ${ok?'sg':'sb-c'}">${d.correct}/${d.total}</div></div>`;
  });
  return `<div style="background:#ede9df;min-height:100vh">
  <div class="assess-header"><div style="font-size:18px;font-weight:700;color:var(--wh)">Assessment Results</div></div>
  <div class="results-pg">
    <div class="results-circle"><div class="results-score">${pct}%</div><div class="results-slbl">${score}/${total} correct</div></div>
    <div class="results-status">
      ${pass?`<div class="r-pass">&#10003; Assessment Passed</div><p style="font-size:14px;color:var(--tx-m);margin-top:7px">Congratulations. You have demonstrated proficiency in Parliamentary Procedure.</p>`:`<div class="r-fail">&#10007; Score Below 80%</div><p style="font-size:14px;color:var(--tx-m);margin-top:7px">Review the modules and retake. You need ${Math.ceil(total*0.8)} correct answers to pass.</p>`}
    </div>
    <div class="breakdown"><h3 style="font-size:15px;font-weight:700;color:var(--cr);margin-bottom:14px">Breakdown by Module</h3>${bdHtml}</div>
    <div style="display:flex;gap:11px;flex-wrap:wrap">
      ${pass?`<button class="btn-primary" onclick="goPage('certificate')">View Certificate &rarr;</button>`:''}
      <button class="btn-primary" style="background:var(--wh);color:var(--cr);border:2px solid var(--cr)" onclick="retakeAssessment()">Retake Assessment</button>
      <button class="btn-primary" style="background:var(--wh);color:var(--cr);border:2px solid var(--cr)" onclick="goPage('landing')">&larr; Back to Course</button>
    </div>
  </div>
</div>`;}

function retakeAssessment(){S.aa={};S.aScore=null;S.aSubmitted=false;S.si=0;save();goPage('assessment');}

function renderCertificate(){
  const d=new Date(),dateStr=d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const name=S.name||'Course Participant';
  return `<div class="cert-wrapper">
  <div class="cert">
    <div class="cert-logo">K&#913;&#936;</div>
    <div class="cert-org">Kappa Alpha Psi Fraternity, Inc. &middot; Denton-Lewisville Alumni Chapter</div>
    <div class="cert-div"></div>
    <div class="cert-title">Certificate of Completion</div>
    <div class="cert-certifies">This certifies that</div>
    <div class="cert-name">${name}</div>
    <div class="cert-completed">has successfully completed</div>
    <div class="cert-course">Roberts Rules of Order &mdash; Parliamentary Procedure Training</div>
    <div class="cert-chapter">Denton-Lewisville Alumni Chapter &middot; 2026 Training Series</div>
    <div class="cert-div"></div>
    <div class="cert-seal">&#127963;</div>
    <div class="cert-date">Completed ${dateStr} &middot; Assessment Score: ${S.aScore}/${AQ.length} (${Math.round((S.aScore/AQ.length)*100)}%)</div>
  </div>
  <button class="btn-print" onclick="window.print()">&#128424; Print Certificate</button>
</div>`;}

function render(){
  document.getElementById('sidebar').innerHTML=renderSidebar();
  let html='';
  if(S.page==='landing') html=renderLanding();
  else if(S.page==='module') html=renderModule();
  else if(S.page==='assessment') html=renderAssessment();
  else if(S.page==='results') html=renderResults();
  else if(S.page==='certificate') html=renderCertificate();
  document.getElementById('main-content').innerHTML=html;
}

document.getElementById('hamburger').addEventListener('click',()=>{
  const sb=document.getElementById('sidebar'),ov=document.getElementById('sb-overlay');
  const open=sb.classList.toggle('sb-open');
  ov.classList.toggle('show',open);
  document.getElementById('hamburger').setAttribute('aria-expanded',open);
});
document.getElementById('sb-overlay').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.remove('sb-open');
  document.getElementById('sb-overlay').classList.remove('show');
  document.getElementById('hamburger').setAttribute('aria-expanded','false');
});

load();render();
</script>
